<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MedExit — Medical Exit Exam Prep</title>
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-naskh-arabic@latest/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#1e3a8a;--primary-light:#3b5998;--primary-dark:#152a6b;
  --accent:#6366f1;--accent-soft:rgba(99,102,241,0.15);
  --success:#10b981;--success-soft:rgba(16,185,129,0.12);
  --danger:#ef4444;--danger-soft:rgba(239,68,68,0.12);
  --warning:#f59e0b;--warning-soft:rgba(245,158,11,0.12);
  --info:#06b6d4;--info-soft:rgba(6,182,212,0.12);
  --purple:#a855f7;--purple-soft:rgba(168,85,247,0.12);
  --bg:#f5f7fb;--bg-card:#ffffff;--bg-elevated:#ffffff;
  --text:#0f172a;--text-2:#475569;--text-3:#94a3b8;--text-4:#cbd5e1;
  --border:#e2e8f0;--border-2:#f1f5f9;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.12);
  --shadow-xl:0 20px 60px rgba(0,0,0,0.15);
  --radius-sm:12px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;
  --font-main:'Inter',system-ui,sans-serif;
  --font-arabic:'Noto Naskh Arabic','Inter',sans-serif;
}
[data-theme="dark"]{
  --bg:#0a0e1a;--bg-card:#141a2e;--bg-elevated:#1a2140;
  --text:#f1f5f9;--text-2:#a8c5d1;--text-3:#6b8a99;--text-4:#2a3654;
  --border:#1e3a47;--border-2:#0f1724;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.3);
  --shadow-md:0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.5);
  --shadow-xl:0 20px 60px rgba(0,0,0,0.6);
}
html,body{font-family:var(--font-main);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
body.rtl{font-family:var(--font-arabic)}
.app{max-width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* Header */
.header{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  color:white;padding:16px 20px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(30,58,138,0.3);
}
.header-back,.header-search,.header-theme,.header-more{
  width:40px;height:40px;border:none;background:rgba(255,255,255,0.15);
  color:white;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .2s;backdrop-filter:blur(10px);
}
.header-back:hover,.header-search:hover,.header-theme:hover,.header-more:hover{background:rgba(255,255,255,0.25)}
.header-title{flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:-0.3px}
.header-title small{display:block;font-size:11px;opacity:0.8;font-weight:500;margin-top:2px}

/* Content */
.content{flex:1;padding:20px 16px;overflow-y:auto;padding-bottom:100px}

/* Stats Card */
.stats-card{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  border-radius:var(--radius-lg);padding:24px 20px;margin-bottom:20px;
  box-shadow:var(--shadow-lg);color:white;
}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat-box{
  background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);
  border-radius:var(--radius-md);padding:16px 12px;text-align:center;
  border:1px solid rgba(255,255,255,0.15);
}
.stat-circle{
  width:64px;height:64px;border-radius:50%;
  background:rgba(255,255,255,0.1);border:3px solid rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;margin:0 auto 8px;
  position:relative;
}
.stat-circle::before{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:3px solid transparent;border-top-color:#10b981;
  transform:rotate(-90deg);
}
.stat-icon{font-size:28px;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:800;line-height:1}
.stat-label{font-size:11px;opacity:0.85;margin-top:6px;font-weight:500}

/* Version Bar */
.version-bar{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:14px 16px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:var(--shadow-sm);
}
.version-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.version-info .cloud{color:var(--primary);font-size:18px}
.version-btn{
  padding:8px 14px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;font-size:12px;font-weight:600;color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;
  transition:all .2s;
}
.version-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Section Header */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;padding:0 4px;
}
.section-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:20px}
.section-link{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}

/* Category Cards */
.cat-card{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  border-radius:var(--radius-lg);padding:20px;margin-bottom:12px;
  display:flex;align-items:center;gap:16px;cursor:pointer;
  box-shadow:var(--shadow-md);color:white;transition:all .25s;
  position:relative;overflow:hidden;
}
.cat-card::before{
  content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;
  background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);
  pointer-events:none;
}
.cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.cat-card:active{transform:scale(0.98)}
.cat-icon-wrap{
  width:56px;height:56px;border-radius:14px;
  background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;border:1px solid rgba(255,255,255,0.2);
  position:relative;z-index:1;
}
.cat-info{flex:1;min-width:0;position:relative;z-index:1}
.cat-name{font-size:16px;font-weight:700;margin-bottom:4px;line-height:1.3}
.cat-badge{
  display:inline-block;padding:4px 12px;background:rgba(255,255,255,0.2);
  border-radius:20px;font-size:11px;font-weight:600;backdrop-filter:blur(10px);
}
.cat-arrow{font-size:22px;opacity:0.7;position:relative;z-index:1}

/* Exam Setup */
.setup-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;
  box-shadow:var(--shadow-md);
}
.setup-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.setup-circle{
  width:80px;height:80px;border-radius:50%;
  background:var(--bg);border:4px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:var(--primary);flex-shrink:0;
}
.setup-info{flex:1}
.setup-title{font-size:18px;font-weight:700;margin-bottom:4px}
.setup-subtitle{font-size:12px;color:var(--text-3);margin-bottom:10px}
.setup-stats{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
.setup-stats span{display:flex;align-items:center;gap:6px}
.setup-stats .correct{color:var(--success);font-weight:600}
.setup-stats .remaining{color:var(--text-3)}

.count-selector{margin:20px 0}
.count-label{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.count-options{display:flex;gap:8px;flex-wrap:wrap}
.count-btn{
  padding:12px 20px;background:var(--bg);border:2px solid var(--border);
  border-radius:12px;font-size:14px;font-weight:700;color:var(--text);
  cursor:pointer;transition:all .2s;font-family:inherit;min-width:60px;text-align:center;
}
.count-btn:hover{border-color:var(--accent);color:var(--accent)}
.count-btn.active{background:var(--primary);border-color:var(--primary);color:white}

.start-btn{
  width:100%;padding:18px;background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:white;border:none;border-radius:var(--radius-md);
  font-size:17px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 8px 24px rgba(30,58,138,0.3);transition:all .2s;font-family:inherit;
  margin-top:20px;
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(30,58,138,0.4)}
.start-btn:active{transform:scale(0.98)}

/* MCQ Card */
.mcq-header{text-align:center;margin-bottom:16px;font-size:14px;color:var(--text-2);font-weight:600}
.mcq-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:28px 24px;
  box-shadow:var(--shadow-md);position:relative;
  animation:slideIn .4s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRTL{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
[dir="rtl"] .mcq-card{animation:slideInRTL .4s ease}

.mcq-actions{display:flex;justify-content:space-between;margin-bottom:16px}
.mcq-bookmark,.mcq-tag{
  width:36px;height:36px;border:none;background:var(--bg);
  border-radius:10px;cursor:pointer;font-size:18px;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.mcq-bookmark:hover,.mcq-tag:hover{background:var(--accent-soft);color:var(--accent)}
.mcq-bookmark.active{background:var(--warning-soft);color:var(--warning)}

.mcq-image{
  width:100%;border-radius:var(--radius-md);margin-bottom:16px;
  max-height:240px;object-fit:cover;
}
.mcq-video{
  width:100%;border-radius:var(--radius-md);margin-bottom:16px;
  aspect-ratio:16/9;border:none;
}

.mcq-question{
  font-size:18px;font-weight:700;line-height:1.7;margin-bottom:24px;
  text-align:center;
}

.mcq-options{display:flex;flex-direction:column;gap:10px}
.mcq-option{
  padding:16px 18px;background:var(--bg);border:2px solid var(--border);
  border-radius:var(--radius-md);cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:all .25s;font-size:15px;line-height:1.6;
}
.mcq-option:hover:not(.disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateX(-4px)}
[dir="rtl"] .mcq-option:hover:not(.disabled){transform:translateX(4px)}
.mcq-option .opt-letter{
  width:36px;height:36px;border-radius:50%;
  background:var(--primary);color:white;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;flex-shrink:0;
  transition:all .25s;
}
.mcq-option .opt-text{flex:1}
.mcq-option.correct{border-color:var(--success);background:var(--success-soft)}
.mcq-option.correct .opt-letter{background:var(--success)}
.mcq-option.wrong{border-color:var(--danger);background:var(--danger-soft)}
.mcq-option.wrong .opt-letter{background:var(--danger)}
.mcq-option.disabled{cursor:default;opacity:0.7}
.mcq-option.correct.disabled,.mcq-option.wrong.disabled{opacity:1}

.mcq-hint{text-align:center;margin-top:20px;font-size:13px;color:var(--text-3);font-style:italic}

.mcq-nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:20px;padding:0 4px;
}
.nav-btn{
  width:44px;height:44px;border:2px solid var(--border);background:var(--bg-card);
  border-radius:12px;cursor:pointer;font-size:18px;color:var(--text);
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:white}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.nav-counter{font-size:14px;font-weight:700;color:var(--text-2)}

/* Notes */
.notes-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:16px;margin-top:16px;
  box-shadow:var(--shadow-sm);
}
.notes-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.notes-content{font-size:14px;color:var(--text-2);line-height:1.7}

/* Flashcard */
.flashcard-wrapper{max-width:600px;margin:0 auto}
.flashcard-counter{text-align:center;margin-bottom:20px;font-size:14px;color:var(--text-2);font-weight:600}
.flashcard-container{perspective:1500px;min-height:380px;margin-bottom:20px}
.flashcard{
  width:100%;min-height:380px;position:relative;
  transform-style:preserve-3d;transition:transform .8s cubic-bezier(0.4,0,0.2,1);
  cursor:pointer;
}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:32px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:var(--shadow-lg);
}
.flashcard-front{background:linear-gradient(135deg,var(--bg-card),var(--bg))}
.flashcard-back{
  transform:rotateY(180deg);
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:white;border-color:var(--primary);
}
.flashcard-label{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:2px;
  color:var(--text-3);margin-bottom:20px;padding:6px 14px;
  background:var(--bg);border-radius:20px;
}
.flashcard-back .flashcard-label{background:rgba(255,255,255,0.15);color:white}
.flashcard-text{font-size:20px;font-weight:600;line-height:1.7}
.flashcard-back .flashcard-text{color:white}
.flashcard-hint{margin-top:24px;font-size:12px;color:var(--text-3);font-style:italic}
.flashcard-back .flashcard-hint{color:rgba(255,255,255,0.7)}

/* Q&A */
.qa-list{display:flex;flex-direction:column;gap:10px}
.qa-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden;
  box-shadow:var(--shadow-sm);transition:all .2s;
}
.qa-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
.qa-question{
  padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;
}
.qa-icon{
  width:40px;height:40px;border-radius:12px;
  background:var(--success-soft);color:var(--success);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;flex-shrink:0;
}
.qa-text{flex:1;font-size:14px;font-weight:600;line-height:1.6}
.qa-toggle{
  width:32px;height:32px;border-radius:10px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);font-size:14px;transition:all .3s;
}
.qa-card.open .qa-toggle{transform:rotate(180deg);color:var(--success)}
.qa-answer{max-height:0;overflow:hidden;transition:max-height .3s ease}
.qa-card.open .qa-answer{max-height:500px}
.qa-answer-inner{
  padding:0 20px 20px 74px;font-size:14px;color:var(--success);
  font-weight:600;line-height:1.7;
}
[dir="rtl"] .qa-answer-inner{padding:0 74px 20px 20px}
.qa-answer-inner .arrow{color:var(--warning);margin-inline-end:6px;font-weight:800}

/* Mnemonics */
.mnemonics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mnemonic-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:22px;position:relative;
  overflow:hidden;box-shadow:var(--shadow-sm);transition:all .3s;
}
.mnemonic-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--warning),var(--danger));
}
.mnemonic-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--warning)}
.mn-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mn-icon{
  width:48px;height:48px;border-radius:14px;
  background:var(--warning-soft);border:1px solid var(--warning);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
}
.mn-title{font-size:16px;font-weight:700;color:var(--warning)}
.mn-code{
  font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--purple);
  margin:10px 0 14px;padding:8px 14px;background:var(--purple-soft);
  border-radius:10px;display:inline-block;border:1px solid rgba(168,85,247,0.2);
  font-weight:700;
}
.mn-items{list-style:none}
.mn-items li{
  font-size:13px;color:var(--text-2);padding:8px 0;
  display:flex;gap:10px;line-height:1.6;
  border-bottom:1px dashed var(--border);
}
.mn-items li:last-child{border-bottom:none}
.mn-items li .letter{
  color:var(--success);font-weight:800;
  font-family:'JetBrains Mono',monospace;
  min-width:30px;background:var(--success-soft);
  padding:3px 10px;border-radius:8px;text-align:center;
  font-size:12px;border:1px solid var(--success);
}

/* Tabs */
.content-tabs{
  display:flex;gap:6px;padding:6px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:var(--radius-md);
  margin-bottom:20px;overflow-x:auto;box-shadow:var(--shadow-sm);
}
.content-tabs::-webkit-scrollbar{display:none}
.content-tab{
  padding:12px 18px;background:transparent;border:none;
  color:var(--text-3);font-size:13px;font-weight:700;
  cursor:pointer;border-radius:10px;transition:all .2s;
  font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.content-tab:hover:not(:disabled){color:var(--text);background:var(--bg)}
.content-tab.active{background:var(--primary);color:white;box-shadow:0 4px 12px rgba(30,58,138,0.3)}
.content-tab:disabled{opacity:0.3;cursor:not-allowed}
.tab-count{
  background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:10px;
  font-size:10px;font-weight:800;
}
.content-tab:not(.active) .tab-count{background:var(--bg);color:var(--text-3)}

.content-panel{display:none}
.content-panel.active{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Empty */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-3);
  background:var(--bg-card);border:1px dashed var(--border);
  border-radius:var(--radius-lg);
}
.empty-state .es-icon{font-size:64px;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:18px;color:var(--text-2);margin-bottom:8px;font-weight:700}
.empty-state p{font-size:13px;line-height:1.6}

/* Loading */
.loading-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;gap:20px;background:var(--bg);
}
.loading-spinner{
  width:52px;height:52px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--text-3);font-weight:500}

/* Toast */
.toast-container{position:fixed;top:20px;inset-inline-end:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--bg-card);border:1px solid var(--border);
  border-inline-start:4px solid var(--primary);
  border-radius:14px;padding:14px 18px;min-width:260px;max-width:400px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;
  animation:slideInT .3s ease;font-size:13px;font-weight:500;
}
@keyframes slideInT{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-inline-start-color:var(--success)}
.toast.error{border-inline-start-color:var(--danger)}
.toast.warning{border-inline-start-color:var(--warning)}
.toast-icon{font-size:18px;flex-shrink:0}
.toast-message{flex:1;color:var(--text)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.modal-overlay.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-xl);width:100%;max-width:500px;
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);
  animation:slideUp .3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{
  padding:22px 26px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-close{
  width:34px;height:34px;border:1px solid var(--border);background:var(--bg);
  color:var(--text-3);cursor:pointer;border-radius:10px;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.modal-close:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.modal-body{padding:26px;font-size:14px;color:var(--text-2);line-height:1.7}
.modal-body h4{color:var(--text);margin-bottom:10px;margin-top:20px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.modal-body h4:first-child{margin-top:0}
.modal-body ul{list-style:none;padding:0;margin:10px 0}
.modal-body ul li{padding:8px 0 8px 26px;position:relative;font-size:13px;line-height:1.6}
.modal-body ul li::before{content:'✦';position:absolute;inset-inline-start:4px;color:var(--accent);font-size:12px}
.modal-footer{padding:18px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--bg)}
.btn{
  padding:11px 22px;border-radius:12px;border:none;font-size:13px;
  font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;box-shadow:0 4px 16px rgba(30,58,138,0.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(30,58,138,0.4)}
.btn-secondary{background:var(--bg);color:var(--text-2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-card-hover);color:var(--text)}

/* RTL adjustments */
[dir="rtl"] .mcq-option:hover:not(.disabled){transform:translateX(4px)}
[dir="rtl"] .qa-answer-inner{padding:0 74px 20px 20px}
[dir="rtl"] .mnemonic-card::before{left:0;right:0}

/* Responsive */
@media(max-width:600px){

// ==================== STATE ====================
let state = {
  language: localStorage.getItem('medexit_lang') || 'ps',
  theme: localStorage.getItem('medexit_theme') || 'light',
  data: null,

function t(key) {
  return (i18n[state.language] && i18n[state.language][key]) || i18n.en[key] || key;
}

// ==================== RTL DETECTION ====================
function isRTLText(text) {
  if (!text) return false;
  return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(text);
}

function dirClass(text) {
  return isRTLText(text) ? 'rtl-text' : 'ltr-text';
}

function applyTextDir(el, text) {
  if (!el) return;
  el.className = (el.className || '').replace(/\b(rtl-text|ltr-text)\b/g, '').trim();
  if (text && isRTLText(text)) {
    el.classList.add('rtl-text');
  } else {
    el.classList.add('ltr-text');
  }
}

// ==================== LANGUAGE & THEME ====================
function setLanguage(lang) {
  state.language = lang;
  localStorage.setItem('medexit_lang', lang);
  const isRTL = (lang === 'ps' || lang === 'dr');
  document.documentElement.lang = lang === 'ps' ? 'ps' : lang === 'dr' ? 'fa' : 'en';
  document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
  document.body.classList.toggle('rtl', isRTL);
  renderAll();
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('medexit_theme', state.theme);
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('headerTheme').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

// ==================== DATA LOADING ====================
async function loadData() {
  try {
    const response = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    state.data = normalizeData(data);
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderAll();
  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('loadingScreen').innerHTML = `
      <div style="text-align:center;padding:20px;">
        <div style="font-size:56px;margin-bottom:16px;">⚠️</div>
        <h3 style="margin-bottom:8px;font-size:18px;">${t('loadingFailed')}</h3>
        <p style="font-size:13px;margin-bottom:20px;color:var(--text-3)">${err.message}</p>
        <button class="btn btn-primary" onclick="location.reload()">🔄 ${t('refresh')}</button>
      </div>
    `;
  }
}

function normalizeData(data) {
  if (!data) return { categories: [] };
  if (Array.isArray(data)) return { categories: data.map(normalizeItem) };
  if (data.categories) return { categories: data.categories.map(normalizeItem) };
  return { categories: [] };
}

function normalizeItem(item) {
  if (!item) return null;
  const result = {
    id: item.id || ('id_' + Math.random().toString(36).slice(2, 8)),
    name: item.name || '',
    icon: item.icon || '📚',
    description: item.description || '',
    content: item.content || null,
    image: item.image || null,
    video: item.video || null,
    notes: item.notes || '',
    children: []
  };
  const childSources = [item.children, item.subjects, item.topics, item.subtopics, item.categories];
  childSources.forEach(source => {
    if (Array.isArray(source)) {
      source.forEach(child => {
        const normalized = normalizeItem(child);
        if (normalized) result.children.push(normalized);
      });
    }
  });
  return result;
}

// ==================== NAVIGATION ====================
function getCurrentItem() {
  if (state.navStack.length === 0) return null;
  return state.navStack[state.navStack.length - 1].item;
}

function navigateTo(item) {
  state.navStack.push({ item });
  state.currentTab = 'mcqs';
  renderAll();
  document.getElementById('content').scrollTo(0, 0);
}

function goBack() {
  if (state.navStack.length > 0) {
    state.navStack.pop();
    renderAll();
    document.getElementById('content').scrollTo(0, 0);
  }
}

function goToIndex(index) {
  state.navStack = state.navStack.slice(0, index);
  renderAll();
  document.getElementById('content').scrollTo(0, 0);
}

function goHome() {
  state.navStack = [];
  renderAll();
  document.getElementById('content').scrollTo(0, 0);
}

function navigateToItem(id) {
  const item = findItemById(state.data?.categories || [], id);
  if (item) navigateTo(item);
}

function findItemById(items, id) {
  for (const item of items) {
    if (item.id === id) return item;
    if (item.children && item.children.length > 0) {
      const found = findItemById(item.children, id);
      if (found) return found;
    }
  }
  return null;
}

// ==================== DATA HELPERS ====================
function countContent(item) {
  if (!item) return { mcqs: 0, qa: 0, flash: 0, mnem: 0, total: 0 };
  const c = item.content || {};
  const direct = {
    mcqs: (c.mcqs || []).length,
    qa: (c.qa || []).length,
    flash: (c.flashcards || []).length,
    mnem: (c.mnemonics || []).length
  };
  let childCount = { mcqs: 0, qa: 0, flash: 0, mnem: 0 };
  (item.children || []).forEach(child => {
    const cc = countContent(child);
    childCount.mcqs += cc.mcqs;
    childCount.qa += cc.qa;
    childCount.flash += cc.flash;
    childCount.mnem += cc.mnem;
  });
  const total = {
    mcqs: direct.mcqs + childCount.mcqs,
    qa: direct.qa + childCount.qa,
    flash: direct.flash + childCount.flash,
    mnem: direct.mnem + childCount.mnem
  };
  total.total = total.mcqs + total.qa + total.flash + total.mnem;
  return total;
}

function getItemType(item) {
  if (!item) return 'empty';
  const hasChildren = (item.children || []).length > 0;
  const hasContent = item.content && (
    (item.content.mcqs || []).length > 0 ||
    (item.content.qa || []).length > 0 ||
    (item.content.flashcards || []).length > 0 ||
    (item.content.mnemonics || []).length > 0
  );
  if (hasChildren && !hasContent) return 'container';
  if (hasContent) return 'leaf';
  if (hasChildren) return 'mixed';
  return 'empty';
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function getVideoEmbed(url) {
  if (!url) return null;
  if (url.includes('youtube.com/watch')) {
    const id = new URL(url).searchParams.get('v');
    return `https://www.youtube.com/embed/${id}`;
  }
  if (url.includes('youtu.be/')) {
    const id = url.split('youtu.be/')[1].split('?')[0];
    return `https://www.youtube.com/embed/${id}`;
  }
  if (url.includes('vimeo.com/')) {
    const id = url.split('vimeo.com/')[1].split('?')[0];
    return `https://player.vimeo.com/video/${id}`;
  }
  return url;
}

// ==================== RENDERING ====================
function renderAll() {
  renderHeader();
  renderContent();
}

function renderHeader() {
  const backBtn = document.getElementById('headerBack');
  const moreBtn = document.getElementById('headerMore');
  const title = document.getElementById('headerTitle');
  const subtitle = document.getElementById('headerSubtitle');
  
  backBtn.style.display = state.navStack.length > 0 ? 'flex' : 'none';
  moreBtn.style.display = state.navStack.length > 0 ? 'flex' : 'none';
  
  if (state.navStack.length === 0) {
    title.innerHTML = `<div>طبي EXIT ازموینه</div><small>زده کړه</small>`;
  } else {
    const current = getCurrentItem();
    title.innerHTML = `<div>${escapeHtml(current.name)}</div>`;
    subtitle.textContent = current.description ? current.description.substring(0, 50) : '';
  }
}

function renderContent() {
  const content = document.getElementById('content');
  
  if (state.navStack.length === 0) {
    content.innerHTML = renderDashboard();
  } else {
    const current = getCurrentItem();
    const type = getItemType(current);
    
    if (type === 'container') {
      content.innerHTML = renderContainerView(current);
    } else if (type === 'leaf' || type === 'mixed') {
      content.innerHTML = renderLeafView(current);
    } else {
      content.innerHTML = renderEmptyView();
    }
  }
}

          <div class="setup-subtitle">${escapeHtml(item.id)}</div>
          <div class="setup-stats">
            <span>📋 ${t('totalQ')}: ${counts.total}</span>
            <span class="correct">✅ ${t('correctQ')}: 0</span>

          </div>
        </div>
      </div>
    </div>

  children.forEach(child => {

        <div class="cat-info">

  )) {
    html += renderContentTabs(item);

function renderLeafView(item) {
  const c = item.content || {};
  const mcqs = c.mcqs || [];
  const hasChildren = (item.children || []).length > 0;
  
  let html = '';
  
  if (hasChildren) {
    // Show setup + children list + content tabs
    const counts = countContent(item);
    const selectedCount = state.mcqCount[item.id] || Math.min(20, mcqs.length) || mcqs.length;
    
    html += `
      <div class="setup-card">
        <div class="setup-header">
          <div class="setup-circle">0%</div>
          <div class="setup-info">
            <div class="setup-title ${dirClass(item.name)}">${escapeHtml(item.name)}</div>
            <div class="setup-subtitle">${escapeHtml(item.id)}</div>
            <div class="setup-stats">
              <span>📋 ${t('totalQ')}: ${counts.total}</span>
              <span class="correct">✅ ${t('correctQ')}: 0</span>
              <span class="remaining">⏳ ${t('remainingQ')}: ${counts.total}</span>
            </div>
          </div>
        </div>
        
        ${mcqs.length > 0 ? `
          <div class="count-selector">
            <div class="count-label">📊 ${t('questionCount')}</div>
            <div class="count-options">
              ${[10, 20, 30, 50, 100].filter(n => n <= mcqs.length).map(n => `
                <button class="count-btn ${selectedCount === n ? 'active' : ''}" onclick="setMcqCount('${item.id}', ${n})">${n}</button>
              `).join('')}
              <button class="count-btn ${selectedCount === mcqs.length ? 'active' : ''}" onclick="setMcqCount('${item.id}', ${mcqs.length})">${t('all')}</button>
            </div>
          </div>
          <button class="start-btn" onclick="startQuiz('${item.id}')">▶ ${t('startLearning')}</button>
        ` : ''}
      </div>
    `;
    
    if (item.children.length > 0) {
      html += `<div class="section-header"><div class="section-title"><span class="icon">📚</span> ${t('categories')}</div></div>`;
      item.children.forEach(child => {
        const childCounts = countContent(child);
        html += `
          <div class="cat-card" onclick="navigateToItem('${child.id}')">
            <div class="cat-icon-wrap">${child.icon || '📄'}</div>
            <div class="cat-info">
              <div class="cat-name ${dirClass(child.name)}">${escapeHtml(child.name)}</div>
              <div class="cat-badge">${childCounts.total} ${t('questions')}</div>
            </div>
            <div class="cat-arrow">‹</div>
          </div>
        `;
      });
    }
    
    if (mcqs.length > 0 || (c.qa || []).length > 0 || (c.flashcards || []).length > 0 || (c.mnemonics || []).length > 0) {
      html += renderContentTabs(item);
    }
  } else {
    // Pure leaf - show content directly
    html = renderContentTabs(item);
  }
  
  return html;
}

function renderEmptyView() {
  return `
    <div class="empty-state">
      <div class="es-icon">📭</div>
      <h3>${t('noContent')}</h3>
      <p>${t('noContentDesc')}</p>
    </div>
  `;
}

function renderContentTabs(item) {
  const c = item.content || {};
  const mcqs = c.mcqs || [];
  const qa = c.qa || [];
  const flashcards = c.flashcards || [];
  const mnemonics = c.mnemonics || [];
  const topicKey = item.id;
  
  if (state.mcqShowResults[topicKey]) {
    return renderQuizResults(mcqs, topicKey);
  }
  
  // Determine which tab to show
  let activeTab = state.currentTab;
  if (activeTab === 'mcqs' && mcqs.length === 0) {
    if (qa.length > 0) activeTab = 'qa';
    else if (flashcards.length > 0) activeTab = 'flashcards';
    else if (mnemonics.length > 0) activeTab = 'mnemonics';
  }
  
  let html = `
    <div class="content-tabs">
      <button class="content-tab ${activeTab === 'mcqs' ? 'active' : ''}" onclick="switchTab('mcqs')" ${!mcqs.length ? 'disabled' : ''}>
        📋 ${t('mcqs')} <span class="tab-count">${mcqs.length}</span>
      </button>
      <button class="content-tab ${activeTab === 'qa' ? 'active' : ''}" onclick="switchTab('qa')" ${!qa.length ? 'disabled' : ''}>
        💬 ${t('qa')} <span class="tab-count">${qa.length}</span>
      </button>
      <button class="content-tab ${activeTab === 'flashcards' ? 'active' : ''}" onclick="switchTab('flashcards')" ${!flashcards.length ? 'disabled' : ''}>
        🎴 ${t('flashcards')} <span class="tab-count">${flashcards.length}</span>
      </button>
      <button class="content-tab ${activeTab === 'mnemonics' ? 'active' : ''}" onclick="switchTab('mnemonics')" ${!mnemonics.length ? 'disabled' : ''}>
        🧠 ${t('mnemonics')} <span class="tab-count">${mnemonics.length}</span>
      </button>
    </div>
    
    <div class="content-panel ${activeTab === 'mcqs' ? 'active' : ''}" id="panel-mcqs">
      ${mcqs.length ? renderMCQQuiz(mcqs, topicKey) : renderEmpty()}
    </div>
    
    <div class="content-panel ${activeTab === 'qa' ? 'active' : ''}" id="panel-qa">
      ${qa.length ? renderQA(qa, topicKey) : renderEmpty()}
    </div>
    
    <div class="content-panel ${activeTab === 'flashcards' ? 'active' : ''}" id="panel-flashcards">
      ${flashcards.length ? renderFlashcards(flashcards, topicKey) : renderEmpty()}
    </div>
    
    <div class="content-panel ${activeTab === 'mnemonics' ? 'active' : ''}" id="panel-mnemonics">
      ${mnemonics.length ? renderMnemonics(mnemonics) : renderEmpty()}
    </div>
  `;
  
  // Notes
  if (item.notes) {
    html += `
      <div class="notes-card">
        <div class="notes-title">📝 ${t('notes')}</div>
        <div class="notes-content ${dirClass(item.notes)}">${escapeHtml(item.notes)}</div>
      </div>
    `;
  }
  
  return html;
}

function renderEmpty() {
  return `<div class="empty-state"><div class="es-icon">📭</div><h3>${t('noContent')}</h3><p>${t('noContentDesc')}</p></div>`;
}

// ==================== MCQ QUIZ ====================
function setMcqCount(topicKey, count) {
  state.mcqCount[topicKey] = count;
  renderContent();
}

function startQuiz(topicKey) {
  state.mcqAnswers[topicKey] = {};
  state.mcqCurrentIndex[topicKey] = 0;
  state.mcqShowResults[topicKey] = false;
  state.currentTab = 'mcqs';
  renderContent();
  document.getElementById('content').scrollTo(0, 0);
}

function renderMCQQuiz(mcqs, topicKey) {
  if (!state.mcqAnswers[topicKey]) state.mcqAnswers[topicKey] = {};
  if (state.mcqCurrentIndex[topicKey] === undefined) state.mcqCurrentIndex[topicKey] = 0;
  
  const count = state.mcqCount[topicKey] || mcqs.length;
  const quizMcqs = mcqs.slice(0, count);
  const answers = state.mcqAnswers[topicKey];
  const currentIdx = state.mcqCurrentIndex[topicKey];
  
  if (currentIdx >= quizMcqs.length) {
    state.mcqCurrentIndex[topicKey] = quizMcqs.length - 1;
  }
  const mcq = quizMcqs[state.mcqCurrentIndex[topicKey]];
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  const arabicLetters = ['الف', 'ب', 'ج', 'د', 'هـ', 'و'];
  const isRTL = state.language === 'ps' || state.language === 'dr';
  const letterLabels = isRTL ? arabicLetters : letters;
  
  const answered = Object.keys(answers).filter(k => parseInt(k) < quizMcqs.length).length;
  const correct = Object.entries(answers).filter(([qIdx, optIdx]) => quizMcqs[qIdx].answer === optIdx).length;
  const progress = quizMcqs.length > 0 ? (answered / quizMcqs.length) * 100 : 0;
  
  const wasAnswered = answers[state.mcqCurrentIndex[topicKey]] !== undefined;
  const selected = answers[state.mcqCurrentIndex[topicKey]];
  const correctIdx = mcq.answer;
  const question = mcq.q || mcq.question || '';
  const options = mcq.options || [];
  const explanation = mcq.explanation || mcq.explain || '';
  const image = mcq.image || null;
  const video = mcq.video || null;
  const isCorrect = wasAnswered && selected === correctIdx;
  
  let html = `
    <div class="mcq-header">${t('card')} ${state.mcqCurrentIndex[topicKey] + 1} ${t('of')} ${quizMcqs.length}</div>
    
    <div class="mcq-card">
      <div class="mcq-actions">
        <button class="mcq-bookmark ${state.bookmarks.has(topicKey + '_' + state.mcqCurrentIndex[topicKey]) ? 'active' : ''}" onclick="toggleBookmark('${topicKey}', ${state.mcqCurrentIndex[topicKey]})">🔖</button>
        <button class="mcq-tag">🏷️</button>
      </div>
      
      ${image ? `<img class="mcq-image" src="${image}" alt="">` : ''}
      ${video ? `<iframe class="mcq-video" src="${getVideoEmbed(video)}" allowfullscreen></iframe>` : ''}
      
      <div class="mcq-question ${dirClass(question)}">${escapeHtml(question)}</div>
      
      <div class="mcq-options">
  `;
  
  options.forEach((opt, oIdx) => {
    let classes = 'mcq-option';
    if (wasAnswered) {
      classes += ' disabled';
      if (oIdx === correctIdx) classes += ' correct';
      else if (oIdx === selected) classes += ' wrong';
    }
    html += `
      <div class="${classes}" onclick="${wasAnswered ? '' : `answerMCQ('${topicKey}', ${state.mcqCurrentIndex[topicKey]}, ${oIdx}, ${quizMcqs.length})`}">
        <div class="opt-letter">${letterLabels[oIdx] || letters[oIdx]}</div>
        <div class="opt-text ${dirClass(opt)}">${escapeHtml(opt)}</div>
      </div>
    `;
  });
  
  html += `</div>`;
  
  if (explanation) {
    html += `
      <div class="quiz-explanation ${wasAnswered ? 'show' : ''} ${dirClass(explanation)}" style="margin-top:16px;padding:14px 18px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;font-size:13px;line-height:1.7;color:var(--text-2);display:${wasAnswered ? 'block' : 'none'}">
        <strong style="color:var(--accent)">💡 ${t('explanation')}:</strong> ${escapeHtml(explanation)}
      </div>
    `;
  }
  
  html += `
    <div class="mcq-hint">${t('tapToSee')}</div>
    
    <div class="mcq-nav">
      <button class="nav-btn" onclick="prevMCQ('${topicKey}', ${quizMcqs.length})" ${state.mcqCurrentIndex[topicKey] === 0 ? 'disabled' : ''}>›</button>
      <div class="nav-counter">${state.mcqCurrentIndex[topicKey] + 1} / ${quizMcqs.length}</div>
      <button class="nav-btn" onclick="nextMCQ('${topicKey}', ${quizMcqs.length})" ${state.mcqCurrentIndex[topicKey] >= quizMcqs.length - 1 ? 'disabled' : ''}>‹</button>
    </div>
  `;
  
  html += `</div>`;
  return html;
}

function answerMCQ(topicKey, qIdx, optIdx, total) {
  if (!state.mcqAnswers[topicKey]) state.mcqAnswers[topicKey] = {};
  state.mcqAnswers[topicKey][qIdx] = optIdx;
  
  const mcqs = getCurrentItem()?.content?.mcqs || [];
  const quizMcqs = mcqs.slice(0, state.mcqCount[topicKey] || mcqs.length);
  const isCorrect = quizMcqs[qIdx].answer === optIdx;
  
  renderContent();
  
  // Auto-advance on correct answer
  if (isCorrect && qIdx < total - 1) {
    setTimeout(() => {
      state.mcqCurrentIndex[topicKey] = qIdx + 1;
      renderContent();
      document.getElementById('content').scrollTo(0, 0);
    }, 800);
  }
}

function prevMCQ(topicKey, total) {
  if (state.mcqCurrentIndex[topicKey] > 0) {
    state.mcqCurrentIndex[topicKey]--;
    renderContent();
  }
}

function nextMCQ(topicKey, total) {
  if (state.mcqCurrentIndex[topicKey] < total - 1) {
    state.mcqCurrentIndex[topicKey]++;
    renderContent();
  } else {
    finishQuiz(topicKey);
  }
}

function finishQuiz(topicKey) {
  state.mcqShowResults[topicKey] = true;
  renderContent();
  document.getElementById('content').scrollTo(0, 0);
}

function renderQuizResults(mcqs, topicKey) {
  const count = state.mcqCount[topicKey] || mcqs.length;
  const quizMcqs = mcqs.slice(0, count);
  const answers = state.mcqAnswers[topicKey] || {};
  const total = quizMcqs.length;
  const correct = Object.entries(answers).filter(([qIdx, optIdx]) => quizMcqs[qIdx].answer === optIdx).length;
  const wrong = total - correct;
  const percent = total > 0 ? Math.round((correct / total) * 100) : 0;
  
  let icon, message;
  if (percent >= 90) { icon = '🏆'; message = t('excellent'); }
  else if (percent >= 70) { icon = '🌟'; message = t('great'); }
  else if (percent >= 50) { icon = '📚'; message = t('good'); }
  else { icon = '💪'; message = t('keepGoing'); }
  
  return `
    <div style="max-width:600px;margin:0 auto">
      <div class="setup-card" style="text-align:center;padding:40px 24px">
        <div style="font-size:80px;margin-bottom:16px">${icon}</div>
        <div style="font-size:64px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px">${percent}%</div>
        <div style="font-size:18px;color:var(--text-2);margin-bottom:24px">${t('youScored')} ${correct} / ${total}</div>
        
        <div class="stats-grid" style="margin-bottom:24px">
          <div class="stat-box" style="background:var(--success-soft);border-color:var(--success)">
            <div class="stat-value" style="color:var(--success)">${correct}</div>
            <div class="stat-label">${t('correctQ')}</div>
          </div>
          <div class="stat-box" style="background:var(--danger-soft);border-color:var(--danger)">
            <div class="stat-value" style="color:var(--danger)">${wrong}</div>
            <div class="stat-label">${t('wrong')}</div>
          </div>
          <div class="stat-box" style="background:var(--accent-soft);border-color:var(--accent)">
            <div class="stat-value" style="color:var(--accent)">${total}</div>
            <div class="stat-label">${t('questions')}</div>
          </div>
        </div>
        
        <div style="font-size:14px;color:var(--text-2);margin-bottom:24px;line-height:1.6">${message}</div>
        
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="retryQuiz('${topicKey}')">🔄 ${t('retry')}</button>
          <button class="btn btn-secondary" onclick="reviewQuiz('${topicKey}')">📖 ${t('review')}</button>
        </div>
      </div>
    </div>
  `;
}

function retryQuiz(topicKey) {
  state.mcqAnswers[topicKey] = {};
  state.mcqCurrentIndex[topicKey] = 0;
  state.mcqShowResults[topicKey] = false;
  renderContent();
}

function reviewQuiz(topicKey) {
  state.mcqShowResults[topicKey] = false;
  state.mcqCurrentIndex[topicKey] = 0;
  renderContent();
}

function toggleBookmark(topicKey, qIdx) {
  const key = topicKey + '_' + qIdx;
  if (state.bookmarks.has(key)) state.bookmarks.delete(key);
  else state.bookmarks.add(key);
  renderContent();
}

// ==================== Q&A ====================
function renderQA(qa, topicKey) {
  let html = `<div class="qa-list">`;
  qa.forEach((item, idx) => {
    const cardId = `${topicKey}_qa_${idx}`;
    const isOpen = state.openQA[cardId];
    const q = item.q || item.question || '';
    const a = item.a || item.answer || '';
    const image = item.image || null;
    html += `
      <div class="qa-card ${isOpen ? 'open' : ''}" id="qa-${cardId}" onclick="toggleQA('${cardId}')">
        <div class="qa-question">
          <div class="qa-icon">Q</div>
          <div class="qa-text ${dirClass(q)}">${escapeHtml(q)}</div>
          <div class="qa-toggle">▾</div>
        </div>
        ${image ? `<img class="content-image" src="${image}" style="margin:0 20px 10px;max-height:200px" onclick="event.stopPropagation()">` : ''}
        <div class="qa-answer">
          <div class="qa-answer-inner ${dirClass(a)}">
            <span class="arrow">→</span> ${escapeHtml(a)}
          </div>
        </div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

function toggleQA(cardId) {
  state.openQA[cardId] = !state.openQA[cardId];
  const card = document.getElementById(`qa-${cardId}`);
  if (card) card.classList.toggle('open');
}

// ==================== FLASHCARDS ====================
function renderFlashcards(flashcards, topicKey) {
  if (state.flashcardIndex[topicKey] === undefined) state.flashcardIndex[topicKey] = 0;
  const idx = state.flashcardIndex[topicKey];
  const card = flashcards[idx];
  const front = card.front || card.q || card.question || '';
  const back = card.back || card.a || card.answer || '';
  const image = card.image || null;
  
  return `
    <div class="flashcard-wrapper">
      <div class="flashcard-counter">${t('card')} ${idx + 1} ${t('of')} ${flashcards.length}</div>
      <div class="flashcard-container">
        <div class="flashcard" id="flashcard-${topicKey}" onclick="flipFlashcard('${topicKey}')">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-label">${t('front')}</div>
            ${image ? `<img class="content-image" src="${image}" style="max-height:180px;margin-bottom:16px" onclick="event.stopPropagation()">` : ''}
            <div class="flashcard-text ${dirClass(front)}">${escapeHtml(front)}</div>
            <div class="flashcard-hint">👆 ${t('tapToSee')}</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-label">${t('back')}</div>
            <div class="flashcard-text ${dirClass(back)}">${escapeHtml(back)}</div>
          </div>
        </div>
      </div>
      <div class="mcq-nav">
        <button class="nav-btn" onclick="prevFlashcard('${topicKey}', ${flashcards.length})" ${idx === 0 ? 'disabled' : ''}>›</button>
        <div class="nav-counter">${idx + 1} / ${flashcards.length}</div>
        <button class="nav-btn" onclick="nextFlashcard('${topicKey}', ${flashcards.length})" ${idx === flashcards.length - 1 ? 'disabled' : ''}>‹</button>
      </div>
    </div>
  `;
}

function flipFlashcard(topicKey) {
  const card = document.getElementById(`flashcard-${topicKey}`);
  if (card) card.classList.toggle('flipped');
}

function prevFlashcard(topicKey, total) {
  if (state.flashcardIndex[topicKey] > 0) {
    state.flashcardIndex[topicKey]--;
    renderContent();
  }
}

function nextFlashcard(topicKey, total) {
  if (state.flashcardIndex[topicKey] < total - 1) {
    state.flashcardIndex[topicKey]++;
    renderContent();
  }
}

// ==================== MNEMONICS ====================
function renderMnemonics(mnemonics) {
  let html = `<div class="mnemonics-grid">`;
  mnemonics.forEach(mn => {
    const title = mn.title || '';
    const code = mn.code || '';
    const items = mn.items || [];
    html += `
      <div class="mnemonic-card">
        <div class="mn-header">
          <div class="mn-icon">${mn.icon || '🧠'}</div>
          <div class="mn-title ${dirClass(title)}">${escapeHtml(title)}</div>
        </div>
        ${code ? `<div class="mn-code ${dirClass(code)}">${escapeHtml(code)}</div>` : ''}
        <ul class="mn-items">
          ${items.map(it => `
            <li>
              <span class="letter ${dirClass(it.letter)}">${escapeHtml(it.letter)}</span>
              <span class="${dirClass(it.text)}">${escapeHtml(it.text)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

// ==================== TABS ====================
function switchTab(tab) {
  state.currentTab = tab;
  renderContent();
}

// ==================== REFRESH ====================
async function refreshData() {
  try {
    const response = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    state.data = normalizeData(data);
    renderAll();
    toast(t('refreshSuccess'), 'success');
  } catch (err) {
    toast(t('loadingFailed'), 'error');
  }
}

// ==================== MODAL ====================
function openSearch() {
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-header">
      <h3>🔍 ${t('search')}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="text" placeholder="${t('search')}..." style="width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:14px;color:var(--text);font-family:inherit;outline:none" oninput="handleSearch(this.value)">
      <div id="searchResults" style="margin-top:16px"></div>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function handleSearch(query) {
  const results = document.getElementById('searchResults');
  if (!query || query.length < 2) { results.innerHTML = ''; return; }
  
  const q = query.toLowerCase();
  const found = [];
  function search(items, path) {
    items.forEach(item => {
      if (item.name.toLowerCase().includes(q) || (item.description || '').toLowerCase().includes(q)) {
        found.push({ item, path: path + item.name });
      }
      if (item.children) search(item.children, path + item.name + ' > ');
    });
  }
  search(state.data?.categories || [], '');
  
  results.innerHTML = found.slice(0, 10).map(f => `
    <div class="cat-card" style="margin-bottom:8px;padding:14px" onclick="navigateToItem('${f.item.id}');closeModal()">
      <div class="cat-icon-wrap" style="width:44px;height:44px;font-size:20px">${f.item.icon || '📄'}</div>
      <div class="cat-info">
        <div class="cat-name" style="font-size:14px">${escapeHtml(f.path)}</div>
      </div>
    </div>
  `).join('') || '<div style="text-align:center;color:var(--text-3);padding:20px">No results</div>';
}

function openMore() {
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-header">
      <h3>⋮ ${t('about')}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p>${t('aboutText')}</p>
      <h4>✨ ${t('features')}</h4>
      <ul>
        ${t('featureList').map(f => `<li>${f}</li>`).join('')}
      </ul>
      <h4>🌐 Language</h4>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn ${state.language === 'en' ? 'btn-primary' : 'btn-secondary'}" onclick="setLanguage('en')">English</button>
        <button class="btn ${state.language === 'ps' ? 'btn-primary' : 'btn-secondary'}" onclick="setLanguage('ps')">پښتو</button>
        <button class="btn ${state.language === 'dr' ? 'btn-primary' : 'btn-secondary'}" onclick="setLanguage('dr')">دری</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">✓ ${t('ok')}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function openAboutModal() { openMore(); }

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ==================== TOAST ====================
function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: '️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span><span class="toast-message">${message}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'slideInT .3s ease reverse';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('show')) closeModal();
    else if (state.navStack.length > 0) goBack();
  }
});

// ==================== INIT ====================
function init() {
  applyTheme();
  setLanguage(state.language);
  loadData();
}

init();
</script>
</body>
</html>
