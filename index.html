<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedExit — Medical Exit Exam Prep</title>
    <meta name="theme-color" content="#0b1220">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-512.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-naskh-arabic@latest/index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-0: #080e1a;
            --bg-1: #0d1428;
            --bg-2: #131c36;
            --bg-3: #1a254a;
            --surface: rgba(255, 255, 255, .04);
            --surface-hover: rgba(255, 255, 255, .08);
            --surface-active: rgba(255, 255, 255, .12);
            --border: rgba(255, 255, 255, .08);
            --border-strong: rgba(255, 255, 255, .18);
            --text-1: #f0f4ff;
            --text-2: #b8c4e0;
            --text-3: #7a88a8;
            --text-4: #4e5c7c;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-glow: rgba(99, 102, 241, .4);
            --primary-soft: rgba(99, 102, 241, .15);
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, .15);
            --danger: #f43f5e;
            --danger-soft: rgba(244, 63, 94, .15);
            --warning: #f59e0b;
            --warning-soft: rgba(245, 158, 11, .15);
            --info: #06b6d4;
            --info-soft: rgba(6, 182, 212, .15);
            --purple: #a855f7;
            --purple-soft: rgba(168, 85, 247, .15);
            --pink: #ec4899;
            --pink-soft: rgba(236, 72, 153, .15);
            --gradient-primary: linear-gradient(135deg, #6366f1, #a855f7 50%, #ec4899);
            --gradient-success: linear-gradient(135deg, #10b981, #06b6d4);
            --gradient-warm: linear-gradient(135deg, #f59e0b, #f43f5e);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, .35);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, .45);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --font-main: Inter, system-ui, sans-serif;
            --font-arabic: 'Noto Naskh Arabic', Inter, sans-serif;
        }
        [data-theme="light"] {
            --bg-0: #f1f5f9;
            --bg-1: #fff;
            --bg-2: #f8fafc;
            --bg-3: #e2e8f0;
            --surface: rgba(0, 0, 0, .02);
            --surface-hover: rgba(0, 0, 0, .04);
            --border: rgba(0, 0, 0, .08);
            --border-strong: rgba(0, 0, 0, .15);
            --text-1: #0f172a;
            --text-2: #334155;
            --text-3: #64748b;
            --text-4: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }
        html,
        body {
            font-family: var(--font-main);
            background: var(--bg-0);
            color: var(--text-1);
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99, 102, 241, .2), transparent 50%), radial-gradient(ellipse 60% 50% at 80% 100%, rgba(236, 72, 153, .12), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .app {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 1;
        }
        .sidebar {
            width: 300px;
            background: var(--bg-1);
            border-inline-end: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            backdrop-filter: blur(20px);
            transition: transform .3s;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, rgba(99, 102, 241, .1), rgba(236, 72, 153, .05));
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 24px var(--primary-glow);
            flex-shrink: 0;
        }
        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text p {
            font-size: 11px;
            color: var(--text-3);
        }
        .controls-bar {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .lang-selector {
            flex: 1;
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
        }
        .lang-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--text-3);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: .2s;
            font-family: inherit;
        }
        .lang-btn.active {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .theme-toggle {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .breadcrumb-nav {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            overflow-x: auto;
            background: var(--surface);
        }
        .breadcrumb-nav::-webkit-scrollbar {
            display: none;
        }
        .breadcrumb-item {
            color: var(--text-3);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: 600;
            transition: .15s;
            white-space: nowrap;
        }
        .breadcrumb-item:hover {
            background: var(--surface-hover);
            color: var(--text-1);
        }
        .breadcrumb-item.current {
            color: var(--primary-hover);
            background: var(--primary-soft);
        }
        .breadcrumb-sep {
            color: var(--text-4);
        }
        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .nav-list::-webkit-scrollbar {
            width: 4px;
        }
        .nav-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .nav-section-title {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-4);
            padding: 14px 12px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-section-title::before {
            content: '';
            width: 14px;
            height: 2px;
            background: var(--gradient-primary);
            border-radius: 2px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-2);
            transition: .15s;
            margin-bottom: 3px;
            font-weight: 500;
        }
        .nav-item:hover {
            background: var(--surface-hover);
            color: var(--text-1);
        }
        .nav-item.active {
            background: var(--primary-soft);
            color: var(--primary-hover);
            font-weight: 600;
        }
        .nav-item .ni-icon {
            font-size: 18px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border-radius: 8px;
        }
        .nav-item.active .ni-icon {
            background: var(--gradient-primary);
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .nav-item .ni-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nav-item .ni-count {
            font-size: 10px;
            background: var(--surface);
            color: var(--text-3);
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 700;
        }
        .sidebar-footer {
            padding: 14px;
            border-top: 1px solid var(--border);
            font-size: 10px;
            color: var(--text-4);
            text-align: center;
            background: var(--surface);
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }
        .topbar {
            height: 64px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-1);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: .2s;
        }
        .icon-btn:hover {
            background: var(--surface-hover);
            color: var(--text-1);
        }
        .icon-btn.visible {
            display: flex;
        }
        .topbar-title {
            flex: 1;
            min-width: 0;
        }
        .topbar-title h2 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .topbar-title p {
            font-size: 11px;
            color: var(--text-3);
        }
        .topbar-actions {
            display: flex;
            gap: 8px;
        }
        .topbar-btn {
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-2);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .topbar-btn:hover {
            background: var(--surface-hover);
        }
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            scroll-behavior: smooth;
        }
        .content::-webkit-scrollbar {
            width: 6px;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .dashboard {
            max-width: 1280px;
            margin: 0 auto;
            animation: fadeUp .5s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .dashboard-hero {
            position: relative;
            padding: 40px;
            margin-bottom: 30px;
            border-radius: var(--radius-xl);
            background: linear-gradient(135deg, rgba(99, 102, 241, .2), rgba(168, 85, 247, .1), rgba(236, 72, 153, .1));
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .dashboard-hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, .3), transparent 70%);
            pointer-events: none;
        }
        .dashboard-hero>* {
            position: relative;
            z-index: 1;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .dashboard-hero h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        .hero-desc {
            color: rgba(255, 255, 255, .85);
            font-size: 15px;
            line-height: 1.6;
            max-width: 600px;
            margin-bottom: 24px;
        }
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            max-width: 700px;
        }
        .hero-stat {
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: .3s;
        }
        .hero-stat:hover {
            background: rgba(255, 255, 255, .15);
            transform: translateY(-2px);
        }
        .hero-stat .hs-icon {
            font-size: 22px;
        }
        .hero-stat .hs-value {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
        }
        .hero-stat .hs-label {
            font-size: 10px;
            color: rgba(255, 255, 255, .7);
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .category-card {
            position: relative;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            cursor: pointer;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            overflow: hidden;
        }
        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            transform: scaleX(0);
            transform-origin: left;
            transition: .4s;
        }
        .category-card:hover::before {
            transform: scaleX(1);
        }
        .category-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }
        .cc-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .cc-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: var(--gradient-primary);
            box-shadow: 0 8px 20px var(--primary-glow);
            flex-shrink: 0;
        }
        .cc-title {
            flex: 1;
        }
        .cc-title h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .cc-desc {
            font-size: 12px;
            color: var(--text-3);
            line-height: 1.4;
        }
        .cc-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .cc-stat {
            text-align: center;
            padding: 8px 4px;
            background: var(--surface);
            border-radius: 10px;
        }
        .cc-stat-value {
            font-size: 16px;
            font-weight: 800;
        }
        .cc-stat-label {
            font-size: 8px;
            color: var(--text-3);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 4px;
        }
        .cc-stat.mcq .cc-stat-value {
            color: var(--primary-hover);
        }
        .cc-stat.qa .cc-stat-value {
            color: var(--success);
        }
        .cc-stat.flash .cc-stat-value {
            color: var(--purple);
        }
        .cc-stat.mnem .cc-stat-value {
            color: var(--warning);
        }
        .cc-arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            transition: .3s;
        }
        .category-card:hover .cc-arrow {
            background: var(--gradient-primary);
            color: #fff;
            transform: translateX(4px);
        }
        .section-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin: 28px 0 18px;
        }
        .section-header h2 {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-header h2::before {
            content: '';
            width: 4px;
            height: 22px;
            background: var(--gradient-primary);
            border-radius: 3px;
        }
        .section-subtitle {
            font-size: 13px;
            color: var(--text-3);
        }
        .children-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }
        .child-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            cursor: pointer;
            transition: .25s;
            position: relative;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .child-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .child-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .child-content {
            flex: 1;
        }
        .child-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .child-meta {
            display: flex;
            gap: 6px;
            font-size: 10px;
            color: var(--text-3);
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .child-meta span {
            padding: 3px 8px;
            background: var(--surface);
            border-radius: 6px;
        }
        .content-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .content-badge {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 700;
        }
        .content-badge.mcq {
            background: var(--primary-soft);
            color: var(--primary-hover);
        }
        .content-badge.qa {
            background: var(--success-soft);
            color: var(--success);
        }
        .content-badge.flash {
            background: var(--purple-soft);
            color: var(--purple);
        }
        .content-badge.mnem {
            background: var(--warning-soft);
            color: var(--warning);
        }
        /* MCQ Quiz */
        .quiz-container {
            max-width: 850px;
            margin: 0 auto;
        }
        .quiz-header {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .quiz-progress-info {
            flex: 1;
            min-width: 160px;
        }
        .quiz-progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-3);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .quiz-progress-bar {
            height: 8px;
            background: var(--surface);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .quiz-progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 5px;
            transition: .4s;
            box-shadow: 0 0 8px var(--primary-glow);
        }
        .quiz-stats {
            display: flex;
            gap: 10px;
        }
        .quiz-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            background: var(--surface);
        }
        .quiz-stat.correct {
            color: var(--success);
            background: var(--success-soft);
        }
        .quiz-stat.wrong {
            color: var(--danger);
            background: var(--danger-soft);
        }
        .quiz-stat.remaining {
            color: var(--text-3);
        }
        .quiz-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            position: relative;
            overflow: hidden;
            animation: fadeUp .3s;
        }
        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--gradient-primary);
        }
        .quiz-card.answered-correct::before {
            background: var(--gradient-success);
        }
        .quiz-card.answered-wrong::before {
            background: var(--gradient-warm);
        }
        .quiz-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .quiz-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            background: var(--gradient-primary);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            border-radius: 12px;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .quiz-status {
            margin-left: auto;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: none;
        }
        .quiz-card.answered-correct .quiz-status {
            display: flex;
            background: var(--success-soft);
            color: var(--success);
        }
        .quiz-card.answered-wrong .quiz-status {
            display: flex;
            background: var(--danger-soft);
            color: var(--danger);
        }
        .quiz-question {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 20px;
        }
        .quiz-options {
            display: grid;
            gap: 10px;
        }
        .quiz-option {
            padding: 15px 16px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
        }
        .quiz-option:hover:not(.disabled) {
            border-color: var(--primary);
            background: var(--primary-soft);
            transform: translateX(4px);
        }
        .quiz-option .opt-letter {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--bg-3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .quiz-option .opt-text {
            flex: 1;
            padding-top: 2px;
        }
        .quiz-option.correct {
            border-color: var(--success);
            background: var(--success-soft);
            animation: popIn .3s;
        }
        .quiz-option.correct .opt-letter {
            background: var(--success);
            color: #fff;
        }
        .quiz-option.wrong {
            border-color: var(--danger);
            background: var(--danger-soft);
            animation: shake .4s;
        }
        .quiz-option.wrong .opt-letter {
            background: var(--danger);
            color: #fff;
        }
        .quiz-option.disabled {
            cursor: default;
        }
        .quiz-option.disabled:not(.correct):not(.wrong) {
            opacity: .5;
        }
        @keyframes popIn {
            0% {
                transform: scale(.95);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }
        .quiz-explanation {
            margin-top: 18px;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--primary-soft), var(--info-soft));
            border: 1px solid rgba(99, 102, 241, .3);
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-2);
            display: none;
            position: relative;
        }
        .quiz-explanation.show {
            display: block;
            animation: fadeUp .3s;
        }
        .quiz-explanation strong {
            color: var(--primary-hover);
        }
        .mcq-image {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 16px;
            background: var(--surface);
        }
        .mcq-video {
            width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-bottom: 16px;
            background: #000;
        }
        .mcq-note {
            margin-top: 10px;
            padding: 12px 16px;
            background: var(--warning-soft);
            border-left: 4px solid var(--warning);
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-2);
            line-height: 1.5;
        }
        .quiz-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            gap: 10px;
        }
        .quiz-nav-btn {
            padding: 12px 20px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-2);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quiz-nav-btn:hover:not(:disabled) {
            background: var(--primary-soft);
            color: var(--primary-hover);
            border-color: var(--primary);
        }
        .quiz-nav-btn:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        .quiz-nav-btn.primary {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .quiz-nav-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--primary-glow);
        }
        .quiz-dots {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 14px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-top: 12px;
        }
        .quiz-dot {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-3);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }
        .quiz-dot.current {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .quiz-dot.answered-correct {
            background: var(--success);
            color: #fff;
            border: none;
        }
        .quiz-dot.answered-wrong {
            background: var(--danger);
            color: #fff;
            border: none;
        }
        .quiz-results {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 40px;
            text-align: center;
            animation: fadeUp .5s;
            position: relative;
        }
        .results-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s;
        }
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        .results-score {
            font-size: 72px;
            font-weight: 900;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }
        .results-label {
            font-size: 17px;
            color: var(--text-2);
            margin-bottom: 20px;
            font-weight: 600;
        }
        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 0 auto 24px;
        }
        .results-stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }
        .results-stat-value {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .results-stat-value.correct {
            color: var(--success);
        }
        .results-stat-value.wrong {
            color: var(--danger);
        }
        .results-stat-value.total {
            color: var(--primary-hover);
        }
        .results-stat-label {
            font-size: 10px;
            color: var(--text-3);
            text-transform: uppercase;
            font-weight: 700;
        }
        .results-message {
            font-size: 14px;
            color: var(--text-2);
            margin-bottom: 24px;
        }
        .results-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 22px;
            border-radius: 12px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: .2s;
        }
        .btn-primary {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--surface);
            color: var(--text-2);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--surface-hover);
        }
        /* Flashcards */
        .flashcard-wrapper {
            max-width: 700px;
            margin: 0 auto;
        }
        .flashcard-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .flashcard-counter {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-2);
            background: var(--bg-1);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .flashcard-counter span {
            color: var(--primary-hover);
            font-size: 20px;
            font-weight: 800;
        }
        .flashcard-nav {
            display: flex;
            gap: 6px;
        }
        .flashcard-nav button {
            padding: 10px 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-2);
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .flashcard-nav button:hover:not(:disabled) {
            background: var(--primary-soft);
            color: var(--primary-hover);
            border-color: var(--primary);
        }
        .flashcard-nav button:disabled {
            opacity: .3;
        }
        .flashcard-container {
            perspective: 1500px;
            min-height: 360px;
        }
        .flashcard {
            width: 100%;
            min-height: 360px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform .7s cubic-bezier(.4, 0, .2, 1);
            cursor: pointer;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 24px;
            padding: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }
        .flashcard-front {
            background: linear-gradient(145deg, var(--bg-1), var(--bg-2));
            position: relative;
            overflow: hidden;
        }
        .flashcard-front::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary-soft), transparent 70%);
        }
        .flashcard-back {
            background: linear-gradient(145deg, var(--primary-soft), var(--bg-1));
            transform: rotateY(180deg);
            border-color: var(--primary);
        }
        .flashcard-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-3);
            margin-bottom: 18px;
            padding: 6px 14px;
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }
        .flashcard-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.7;
            color: var(--text-1);
            position: relative;
            z-index: 1;
        }
        .flashcard-back .flashcard-text {
            color: var(--primary-hover);
        }
        .flashcard-hint {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-4);
            padding: 6px 14px;
            background: var(--surface);
            border-radius: 20px;
            position: relative;
            z-index: 1;
        }
        /* Q&A */
        .qa-list {
            display: grid;
            gap: 8px;
        }
        .qa-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: .2s;
        }
        .qa-card:hover {
            border-color: var(--success);
        }
        .qa-question {
            padding: 16px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .qa-question .q-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--success-soft);
            color: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            border: 1px solid var(--success);
            flex-shrink: 0;
        }
        .qa-question .q-text {
            flex: 1;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
        }
        .qa-question .q-toggle {
            color: var(--text-4);
            font-size: 14px;
            transition: .3s;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border-radius: 8px;
        }
        .qa-card.open .q-toggle {
            transform: rotate(180deg);
        }
        .qa-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s;
        }
        .qa-card.open .qa-answer {
            max-height: 600px;
        }
        .qa-answer-inner {
            padding: 0 18px 18px 64px;
            font-size: 14px;
            color: var(--success);
            line-height: 1.7;
            font-weight: 500;
        }
        /* Mnemonics */
        .mnemonics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        .mnemonic-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            position: relative;
            transition: .3s;
        }
        .mnemonic-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--warning);
        }
        .mn-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .mn-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--warning-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 1px solid var(--warning);
        }
        .mn-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--warning);
        }
        .mn-code {
            font-family: monospace;
            font-size: 13px;
            color: var(--pink);
            margin: 10px 0 14px;
            font-weight: 700;
            padding: 8px 12px;
            background: var(--pink-soft);
            border-radius: 8px;
            display: inline-block;
        }
        .mn-items {
            list-style: none;
        }
        .mn-items li {
            font-size: 13px;
            color: var(--text-2);
            padding: 6px 0;
            display: flex;
            gap: 8px;
            border-bottom: 1px dashed var(--border);
            line-height: 1.5;
        }
        .mn-items li:last-child {
            border-bottom: none;
        }
        .mn-items li .letter {
            color: var(--success);
            font-weight: 800;
            min-width: 26px;
            background: var(--success-soft);
            padding: 3px 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 11px;
            border: 1px solid var(--success);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
            background: var(--bg-1);
            border: 1px dashed var(--border);
            border-radius: 20px;
        }
        .empty-state .es-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 18px;
            color: var(--text-2);
            margin-bottom: 8px;
        }
        /* RTL */
        .rtl-text {
            font-family: var(--font-arabic) !important;
            direction: rtl !important;
            text-align: right !important;
            line-height: 1.9 !important;
        }
        /* Mobile */
        .mobile-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 200;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 140;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.show {
            display: block;
        }
        @media(max-width:900px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 150;
                transform: translateX(-100%);
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-toggle {
                display: flex;
            }
            .content {
                padding: 16px 12px;
            }
            .topbar {
                padding: 0 12px;
                padding-left: 56px;
            }
            .category-grid,
            .children-grid {
                grid-template-columns: 1fr;
            }
            .dashboard-hero {
                padding: 24px;
            }
            .dashboard-hero h1 {
                font-size: 24px;
            }
            .quiz-card {
                padding: 20px;
            }
            .flashcard-face {
                padding: 24px;
            }
        }
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
            background: var(--bg-0);
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 14px;
            padding: 12px 16px;
            min-width: 250px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            animation: slideIn .3s;
        }
        .toast.success {
            border-left-color: var(--success);
        }
        .toast.error {
            border-left-color: var(--danger);
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

    <button class="mobile-toggle icon-btn" onclick="toggleSidebar()">☰</button>

    </div>

        // ==================== I18N ====================
        const i18n = {
