<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MedExit — Medical Exit Exam Prep</title>

<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedExit">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-naskh-arabic@latest/index.css">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg-0: #06090f;
  --bg-1: #0c1220;
  --bg-2: #131a2e;
  --bg-3: #1a2340;
  --bg-4: #232e52;
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.06);
  --surface-active: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.15);
  --text-1: #f5f7fb;
  --text-2: #c5cde0;
  --text-3: #8892ad;
  --text-4: #5a6480;
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --primary-glow: rgba(99,102,241,0.4);
  --primary-soft: rgba(99,102,241,0.15);
  --success: #10b981;
  --success-soft: rgba(16,185,129,0.15);
  --danger: #ef4444;
  --danger-soft: rgba(239,68,68,0.15);
  --warning: #f59e0b;
  --warning-soft: rgba(245,158,11,0.15);
  --info: #06b6d4;
  --info-soft: rgba(6,182,212,0.15);
  --purple: #a855f7;
  --purple-soft: rgba(168,85,247,0.15);
  --pink: #ec4899;
  --pink-soft: rgba(236,72,153,0.15);
  --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
  --gradient-accent: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
  --gradient-success: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
  --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
  --gradient-cool: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 40px rgba(99,102,241,0.25);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-arabic: 'Noto Naskh Arabic', 'Inter', sans-serif;
  --sidebar-w: 300px;
  --topbar-h: 64px;
  --bottomnav-h: 68px;
}

[data-theme="light"] {
  --bg-0: #f8fafc;
  --bg-1: #ffffff;
  --bg-2: #f1f5f9;
  --bg-3: #e2e8f0;
  --bg-4: #cbd5e1;
  --surface: rgba(0,0,0,0.02);
  --surface-hover: rgba(0,0,0,0.04);
  --surface-active: rgba(0,0,0,0.07);
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.15);
  --text-1: #0f172a;
  --text-2: #334155;
  --text-3: #64748b;
  --text-4: #94a3b8;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.12);
}

html, body {
  font-family: var(--font-main);
  background: var(--bg-0);
  color: var(--text-1);
  min-height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s, color 0.3s;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99,102,241,0.15) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 80% 100%, rgba(236,72,153,0.1) 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(6,182,212,0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

[data-theme="light"] body::before {
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99,102,241,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 80% 100%, rgba(236,72,153,0.05) 0%, transparent 50%);
}

.rtl-text {
  font-family: var(--font-arabic) !important;
  direction: rtl !important;
  text-align: right !important;
  line-height: 1.9 !important;
}

.ltr-text {
  direction: ltr !important;
  text-align: left !important;
}

/* ============ LAYOUT ============ */
.app {
  display: flex;
  height: 100vh;
  position: relative;
  z-index: 1;
}

/* ============ SIDEBAR (Desktop) ============ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-1);
  border-inline-end: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  backdrop-filter: blur(20px);
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(236,72,153,0.04));
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--gradient-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  box-shadow: 0 8px 24px var(--primary-glow);
  position: relative;
  overflow: hidden;
}

.logo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
}

.logo-text h1 {
  font-size: 18px;
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.logo-text p {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.3px;
  margin-top: 2px;
}

/* Controls */
.controls-bar {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
}

.lang-selector {
  flex: 1;
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  gap: 2px;
}

.lang-btn {
  flex: 1;
  padding: 8px 4px;
  background: transparent;
  border: none;
  color: var(--text-3);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  font-family: inherit;
}

.lang-btn.active {
  background: var(--gradient-primary);
  color: white;
  box-shadow: 0 4px 12px var(--primary-glow);
}

.lang-btn:hover:not(.active) {
  color: var(--text-1);
  background: var(--surface-hover);
}

.theme-toggle {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
}

.theme-toggle:hover {
  background: var(--surface-hover);
  color: var(--primary-hover);
  border-color: var(--primary);
}

/* Breadcrumb */
.breadcrumb-nav {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  overflow-x: auto;
  white-space: nowrap;
  background: var(--surface);
}

.breadcrumb-nav::-webkit-scrollbar { display: none; }

.breadcrumb-item {
  color: var(--text-3);
  cursor: pointer;
  padding: 5px 10px;
  border-radius: 8px;
  transition: all 0.15s;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.breadcrumb-item:hover {
  color: var(--text-1);
  background: var(--surface-hover);
}

.breadcrumb-item.current {
  color: var(--primary-hover);
  background: var(--primary-soft);
}

.breadcrumb-sep {
  color: var(--text-4);
  font-size: 10px;
}

/* Nav list */
.nav-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.nav-list::-webkit-scrollbar { width: 5px; }
.nav-list::-webkit-scrollbar-track { background: transparent; }
.nav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.nav-section-title {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-4);
  padding: 14px 12px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-section-title::before {
  content: '';
  width: 16px;
  height: 2px;
  background: var(--gradient-primary);
  border-radius: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-2);
  transition: all 0.15s;
  margin-bottom: 3px;
  position: relative;
  font-weight: 500;
}

.nav-item:hover {
  background: var(--surface-hover);
  color: var(--text-1);
}

.nav-item.active {
  background: var(--primary-soft);
  color: var(--primary-hover);
  font-weight: 600;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 60%;
  background: var(--gradient-primary);
  border-radius: 0 3px 3px 0;
}

.nav-item .ni-icon {
  font-size: 18px;
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border-radius: 8px;
}

.nav-item.active .ni-icon {
  background: var(--gradient-primary);
  box-shadow: 0 4px 12px var(--primary-glow);
}

.nav-item .ni-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-item .ni-count {
  font-size: 10px;
  background: var(--surface);
  color: var(--text-3);
  padding: 3px 8px;
  border-radius: 10px;
  font-weight: 700;
}

.nav-item.active .ni-count {
  background: var(--gradient-primary);
  color: white;
}

.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-4);
  text-align: center;
  background: var(--surface);
  font-weight: 500;
}

/* ============ MAIN ============ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.topbar {
  height: var(--topbar-h);
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-1);
  backdrop-filter: blur(20px);
  flex-shrink: 0;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  border-radius: 12px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  flex-shrink: 0;
}

.icon-btn:hover {
  background: var(--surface-hover);
  color: var(--text-1);
  border-color: var(--border-strong);
}

.icon-btn.visible { display: flex; }

.icon-btn.back:hover {
  background: var(--primary-soft);
  color: var(--primary-hover);
  border-color: var(--primary);
}

.topbar-title {
  flex: 1;
  min-width: 0;
}

.topbar-title h2 {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar-title p {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.topbar-btn {
  padding: 9px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

.topbar-btn:hover {
  background: var(--surface-hover);
  color: var(--text-1);
  border-color: var(--border-strong);
}

.topbar-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.topbar-btn .spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 28px;
  scroll-behavior: smooth;
}

.content::-webkit-scrollbar { width: 8px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ============ DASHBOARD ============ */
.dashboard {
  max-width: 1280px;
  margin: 0 auto;
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.dashboard-hero {
  position: relative;
  padding: 48px 40px;
  margin-bottom: 36px;
  border-radius: var(--radius-xl);
  background: linear-gradient(135deg, rgba(99,102,241,0.15) 0%, rgba(139,92,246,0.1) 40%, rgba(236,72,153,0.1) 100%);
  border: 1px solid var(--border);
  overflow: hidden;
  backdrop-filter: blur(20px);
}

.dashboard-hero::before {
  content: '';
  position: absolute;
  top: -100px;
  right: -100px;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%);
  pointer-events: none;
  animation: float 8s ease-in-out infinite;
}

.dashboard-hero::after {
  content: '';
  position: absolute;
  bottom: -80px;
  left: -80px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(236,72,153,0.2) 0%, transparent 70%);
  pointer-events: none;
  animation: float 10s ease-in-out infinite reverse;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(20px, -20px); }
}

.dashboard-hero > * { position: relative; z-index: 1; }

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 11px;
  font-weight: 700;
  border-radius: 20px;
  margin-bottom: 18px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.dashboard-hero h1 {
  font-size: 40px;
  font-weight: 800;
  margin-bottom: 14px;
  letter-spacing: -1px;
  line-height: 1.15;
  color: white;
  text-shadow: 0 2px 20px rgba(0,0,0,0.2);
}

.dashboard-hero .hero-desc {
  color: rgba(255,255,255,0.85);
  font-size: 16px;
  line-height: 1.6;
  max-width: 600px;
  margin-bottom: 28px;
}

.hero-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  max-width: 700px;
}

.hero-stat {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.3s;
}

.hero-stat:hover {
  background: rgba(255,255,255,0.15);
  transform: translateY(-2px);
}

.hero-stat .hs-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.hero-stat .hs-value {
  font-size: 24px;
  font-weight: 800;
  color: white;
  line-height: 1;
}

.hero-stat .hs-label {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
  font-weight: 500;
}

/* Section header */
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin: 32px 0 20px;
  gap: 16px;
}

.section-header h2 {
  font-size: 22px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 12px;
  letter-spacing: -0.5px;
}

.section-header h2::before {
  content: '';
  width: 5px;
  height: 26px;
  background: var(--gradient-primary);
  border-radius: 3px;
  box-shadow: 0 0 12px var(--primary-glow);
}

.section-subtitle {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 4px;
  font-weight: 500;
}

/* Category cards */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.category-card {
  position: relative;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.category-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--card-gradient, var(--gradient-primary));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s;
}

.category-card:hover::before { transform: scaleX(1); }

.category-card::after {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, var(--card-glow, rgba(99,102,241,0.1)) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

.category-card:hover::after { opacity: 1; }

.category-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}

.cc-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}

.cc-icon-wrap {
  width: 60px;
  height: 60px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  flex-shrink: 0;
  background: var(--card-gradient, var(--gradient-primary));
  box-shadow: 0 8px 20px var(--card-glow, var(--primary-glow));
  position: relative;
  overflow: hidden;
}

.cc-icon-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
}

.cc-title { flex: 1; min-width: 0; }

.cc-title h3 {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -0.3px;
}

.cc-desc {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
}

.cc-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  position: relative;
  z-index: 1;
}

.cc-stat {
  text-align: center;
  padding: 10px 4px;
  background: var(--surface);
  border-radius: 10px;
  transition: all 0.2s;
}

.category-card:hover .cc-stat {
  background: var(--surface-hover);
}

.cc-stat-value {
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
}

.cc-stat-label {
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
  font-weight: 700;
}

.cc-stat.mcq .cc-stat-value { color: var(--primary-hover); }
.cc-stat.qa .cc-stat-value { color: var(--success); }
.cc-stat.flash .cc-stat-value { color: var(--purple); }
.cc-stat.mnem .cc-stat-value { color: var(--warning); }

.cc-arrow {
  position: absolute;
  bottom: 24px;
  inset-inline-end: 24px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: 16px;
  transition: all 0.3s;
  z-index: 1;
}

.category-card:hover .cc-arrow {
  background: var(--gradient-primary);
  color: white;
  transform: translateX(4px);
  box-shadow: 0 4px 16px var(--primary-glow);
}

[dir="rtl"] .category-card:hover .cc-arrow {
  transform: translateX(-4px);
}

/* ============ CHILDREN GRID (generic for subjects/topics/subtopics) ============ */
.children-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  animation: fadeUp 0.4s ease;
}

.child-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-start;
  gap: 16px;
}

.child-card::before {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--gradient-primary);
  transform: scaleY(0);
  transition: transform 0.3s;
}

.child-card:hover::before { transform: scaleY(1); }

.child-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.child-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--gradient-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
  box-shadow: 0 6px 18px var(--primary-glow);
  position: relative;
  overflow: hidden;
}

.child-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
}

.child-content { flex: 1; min-width: 0; }

.child-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -0.2px;
  line-height: 1.3;
}

.child-meta {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--text-3);
  margin-top: 10px;
  flex-wrap: wrap;
}

.child-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--surface);
  border-radius: 6px;
  font-weight: 600;
}

.child-arrow {
  color: var(--text-4);
  font-size: 18px;
  transition: all 0.2s;
  align-self: center;
}

.child-card:hover .child-arrow {
  color: var(--primary-hover);
  transform: translateX(3px);
}

[dir="rtl"] .child-card:hover .child-arrow {
  transform: translateX(-3px);
}

/* Content badges on cards */
.content-badges {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.content-badge {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.content-badge.mcq { background: var(--primary-soft); color: var(--primary-hover); }
.content-badge.qa { background: var(--success-soft); color: var(--success); }
.content-badge.flash { background: var(--purple-soft); color: var(--purple); }
.content-badge.mnem { background: var(--warning-soft); color: var(--warning); }

/* ============ TOPIC VIEWER ============ */
.topic-viewer {
  max-width: 1100px;
  margin: 0 auto;
  animation: fadeUp 0.4s ease;
}

.topic-hero {
  position: relative;
  padding: 32px;
  margin-bottom: 24px;
  border-radius: var(--radius-xl);
  background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(6,182,212,0.08));
  border: 1px solid var(--border);
  overflow: hidden;
}

.topic-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, transparent 70%);
  pointer-events: none;
}

.topic-hero > * { position: relative; z-index: 1; }

.topic-hero-top {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 16px;
}

.topic-icon-wrap {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: var(--gradient-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  flex-shrink: 0;
  box-shadow: 0 10px 30px var(--primary-glow);
  position: relative;
  overflow: hidden;
}

.topic-icon-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
}

.topic-info { flex: 1; min-width: 0; }

.topic-info h1 {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
  line-height: 1.2;
  color: white;
}

.topic-path {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-weight: 500;
}

.topic-path span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.topic-description {
  color: rgba(255,255,255,0.85);
  font-size: 14px;
  line-height: 1.7;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.topic-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.topic-badge {
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
}

/* Tabs */
.content-tabs {
  display: flex;
  gap: 6px;
  padding: 8px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 24px;
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
}

.content-tabs::-webkit-scrollbar { display: none; }

.content-tab {
  padding: 12px 20px;
  background: transparent;
  border: none;
  color: var(--text-3);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.content-tab:hover:not(:disabled) {
  color: var(--text-1);
  background: var(--surface-hover);
}

.content-tab.active {
  background: var(--gradient-primary);
  color: white;
  box-shadow: 0 4px 16px var(--primary-glow);
}

.content-tab:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.content-tab .tab-count {
  background: rgba(255,255,255,0.2);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 800;
}

.content-tab:not(.active) .tab-count {
  background: var(--surface);
  color: var(--text-3);
}

.content-panel { display: none; }
.content-panel.active { display: block; animation: fadeUp 0.3s ease; }

/* ============ MCQ QUIZ MODE ============ */
.quiz-container {
  max-width: 800px;
  margin: 0 auto;
}

.quiz-header {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.quiz-progress-info {
  flex: 1;
  min-width: 200px;
}

.quiz-progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 8px;
  font-weight: 600;
}

.quiz-progress-bar {
  height: 10px;
  background: var(--surface);
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.quiz-progress-fill {
  height: 100%;
  background: var(--gradient-primary);
  border-radius: 6px;
  transition: width 0.4s ease;
  box-shadow: 0 0 10px var(--primary-glow);
}

.quiz-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
  font-weight: 700;
}

.quiz-stat {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 10px;
  background: var(--surface);
}

.quiz-stat.correct { color: var(--success); background: var(--success-soft); }
.quiz-stat.wrong { color: var(--danger); background: var(--danger-soft); }
.quiz-stat.remaining { color: var(--text-3); }

.quiz-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 32px;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.4s ease;
}

.quiz-card::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  width: 5px;
  height: 100%;
  background: var(--gradient-primary);
}

.quiz-card.answered-correct::before { background: var(--gradient-success); }
.quiz-card.answered-wrong::before { background: var(--gradient-warm); }

.quiz-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.quiz-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  padding: 0 14px;
  background: var(--gradient-primary);
  color: white;
  font-size: 14px;
  font-weight: 800;
  border-radius: 12px;
  box-shadow: 0 4px 16px var(--primary-glow);
}

.quiz-status {
  margin-inline-start: auto;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  display: none;
  align-items: center;
  gap: 5px;
}

.quiz-card.answered-correct .quiz-status {
  display: flex;
  background: var(--success-soft);
  color: var(--success);
}

.quiz-card.answered-wrong .quiz-status {
  display: flex;
  background: var(--danger-soft);
  color: var(--danger);
}

.quiz-question {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.7;
  margin-bottom: 24px;
  letter-spacing: -0.3px;
}

.quiz-options { display: grid; gap: 10px; }

.quiz-option {
  padding: 16px 18px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  font-size: 14px;
  line-height: 1.6;
  font-weight: 500;
}

.quiz-option:hover:not(.disabled) {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateX(4px);
}

[dir="rtl"] .quiz-option:hover:not(.disabled) {
  transform: translateX(-4px);
}

.quiz-option .opt-letter {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
  transition: all 0.2s;
  border: 1px solid var(--border);
}

.quiz-option .opt-text { flex: 1; padding-top: 3px; }

.quiz-option.correct {
  border-color: var(--success);
  background: var(--success-soft);
}

.quiz-option.correct .opt-letter {
  background: var(--success);
  color: white;
  border-color: var(--success);
}

.quiz-option.wrong {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.quiz-option.wrong .opt-letter {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.quiz-option.disabled { cursor: default; }
.quiz-option.correct.disabled,
.quiz-option.wrong.disabled { opacity: 1; }
.quiz-option.disabled:not(.correct):not(.wrong) { opacity: 0.5; }

.quiz-explanation {
  margin-top: 20px;
  padding: 16px 20px;
  background: linear-gradient(135deg, var(--primary-soft), var(--info-soft));
  border: 1px solid var(--primary);
  border-radius: var(--radius-md);
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-2);
  display: none;
  position: relative;
}

.quiz-explanation::before {
  content: '💡';
  position: absolute;
  top: -14px;
  inset-inline-start: 16px;
  background: var(--bg-1);
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 16px;
  border: 1px solid var(--primary);
}

.quiz-explanation.show {
  display: block;
  animation: fadeUp 0.3s ease;
}

.quiz-explanation strong { color: var(--primary-hover); }

/* Quiz Navigation */
.quiz-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
  gap: 12px;
}

.quiz-nav-btn {
  padding: 12px 24px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 8px;
}

.quiz-nav-btn:hover:not(:disabled) {
  background: var(--primary-soft);
  color: var(--primary-hover);
  border-color: var(--primary);
}

.quiz-nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.quiz-nav-btn.primary {
  background: var(--gradient-primary);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 16px var(--primary-glow);
}

.quiz-nav-btn.primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px var(--primary-glow);
}

/* Question dots navigation */
.quiz-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 16px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-top: 16px;
}

.quiz-dot {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-3);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.quiz-dot:hover {
  background: var(--surface-hover);
  color: var(--text-1);
}

.quiz-dot.current {
  background: var(--gradient-primary);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 12px var(--primary-glow);
}

.quiz-dot.answered-correct {
  background: var(--success);
  color: white;
  border-color: transparent;
}

.quiz-dot.answered-wrong {
  background: var(--danger);
  color: white;
  border-color: transparent;
}

/* Quiz Results */
.quiz-results {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px;
  text-align: center;
  animation: fadeUp 0.5s ease;
  position: relative;
  overflow: hidden;
}

.quiz-results::before {
  content: '';
  position: absolute;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
  pointer-events: none;
}

.quiz-results > * { position: relative; z-index: 1; }

.results-icon {
  font-size: 80px;
  margin-bottom: 20px;
  animation: bounce 1s ease;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

.results-score {
  font-size: 72px;
  font-weight: 900;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 8px;
  letter-spacing: -2px;
}

.results-label {
  font-size: 18px;
  color: var(--text-2);
  margin-bottom: 24px;
  font-weight: 600;
}

.results-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 500px;
  margin: 0 auto 28px;
}

.results-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
}

.results-stat-value {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}

.results-stat-value.correct { color: var(--success); }
.results-stat-value.wrong { color: var(--danger); }
.results-stat-value.total { color: var(--primary-hover); }

.results-stat-label {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 700;
}

.results-message {
  font-size: 15px;
  color: var(--text-2);
  margin-bottom: 28px;
  line-height: 1.6;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.results-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ============ Q&A ============ */
.qa-list { display: grid; gap: 10px; }

.qa-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: all 0.2s;
}

.qa-card:hover {
  border-color: var(--success);
  box-shadow: var(--shadow-sm);
}

.qa-question {
  padding: 18px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: background 0.15s;
}

.qa-question:hover { background: var(--surface-hover); }

.qa-question .q-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--success-soft);
  color: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
  border: 1px solid var(--success);
}

.qa-question .q-text {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.6;
}

.qa-question .q-toggle {
  color: var(--text-4);
  font-size: 14px;
  transition: transform 0.3s;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border-radius: 8px;
}

.qa-card.open .q-toggle { transform: rotate(180deg); color: var(--success); }

.qa-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.qa-card.open .qa-answer { max-height: 600px; }

.qa-answer-inner {
  padding: 0 20px 20px 70px;
  font-size: 14px;
  color: var(--success);
  font-weight: 500;
  line-height: 1.7;
}

.qa-answer-inner .arrow {
  color: var(--warning);
  margin-inline-end: 8px;
  font-weight: 800;
}

/* ============ FLASHCARDS ============ */
.flashcard-wrapper {
  max-width: 700px;
  margin: 0 auto;
}

.flashcard-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.flashcard-counter {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--bg-1);
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.flashcard-counter span {
  color: var(--primary-hover);
  font-size: 20px;
  font-weight: 800;
}

.flashcard-nav { display: flex; gap: 8px; }

.flashcard-nav button {
  padding: 10px 18px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-2);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.flashcard-nav button:hover:not(:disabled) {
  background: var(--primary-soft);
  color: var(--primary-hover);
  border-color: var(--primary);
}

.flashcard-nav button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.flashcard-container {
  perspective: 1500px;
  min-height: 340px;
}

.flashcard {
  width: 100%;
  min-height: 340px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.flashcard.flipped { transform: rotateY(180deg); }

.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius-xl);
  padding: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
}

.flashcard-front {
  background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
  position: relative;
  overflow: hidden;
}

.flashcard-front::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
  pointer-events: none;
}

.flashcard-back {
  background: linear-gradient(135deg, var(--primary-soft) 0%, var(--bg-1) 100%);
  transform: rotateY(180deg);
  border-color: var(--primary);
  position: relative;
  overflow: hidden;
}

.flashcard-back::before {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--success-soft) 0%, transparent 70%);
  pointer-events: none;
}

.flashcard-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-3);
  margin-bottom: 20px;
  padding: 6px 14px;
  background: var(--surface);
  border-radius: 20px;
  border: 1px solid var(--border);
  position: relative;
  z-index: 1;
}

.flashcard-text {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.7;
  color: var(--text-1);
  position: relative;
  z-index: 1;
}

.flashcard-back .flashcard-text {
  color: var(--primary-hover);
  font-size: 20px;
}

.flashcard-hint {
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-4);
  font-style: italic;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--surface);
  border-radius: 20px;
  position: relative;
  z-index: 1;
}

/* ============ MNEMONICS ============ */
.mnemonics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.mnemonic-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}

.mnemonic-card::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  inset-inline-end: 0;
  height: 4px;
  background: var(--gradient-warm);
}

.mnemonic-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--warning);
}

.mn-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.mn-icon-wrap {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--warning-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  border: 1px solid var(--warning);
}

.mn-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--warning);
  letter-spacing: -0.3px;
}

.mn-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--pink);
  margin: 10px 0 16px;
  font-weight: 700;
  padding: 8px 14px;
  background: var(--pink-soft);
  border-radius: 10px;
  display: inline-block;
  border: 1px solid rgba(236,72,153,0.2);
}

.mn-items { list-style: none; }

.mn-items li {
  font-size: 13px;
  color: var(--text-2);
  padding: 8px 0;
  display: flex;
  gap: 10px;
  line-height: 1.6;
  border-bottom: 1px dashed var(--border);
}

.mn-items li:last-child { border-bottom: none; }

.mn-items li .letter {
  color: var(--success);
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  min-width: 28px;
  background: var(--success-soft);
  padding: 3px 10px;
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
  border: 1px solid var(--success);
}

/* ============ EMPTY STATE ============ */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-3);
  background: var(--bg-1);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  animation: fadeUp 0.4s ease;
}

.empty-state .es-icon {
  font-size: 72px;
  margin-bottom: 20px;
  opacity: 0.5;
}

.empty-state h3 {
  font-size: 20px;
  color: var(--text-2);
  margin-bottom: 10px;
  font-weight: 700;
}

.empty-state p {
  font-size: 14px;
  line-height: 1.6;
  max-width: 400px;
  margin: 0 auto;
}

/* Loading */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 20px;
  background: var(--bg-0);
}

.loading-spinner {
  width: 56px;
  height: 56px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loading-text {
  font-size: 14px;
  color: var(--text-3);
  font-weight: 500;
}

/* Toast */
.toast-container {
  position: fixed;
  top: 20px;
  inset-inline-end: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-inline-start: 4px solid var(--primary);
  border-radius: 14px;
  padding: 14px 18px;
  min-width: 280px;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideIn 0.3s ease;
  font-size: 13px;
  font-weight: 500;
  backdrop-filter: blur(20px);
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.toast.success { border-inline-start-color: var(--success); }
.toast.error { border-inline-start-color: var(--danger); }
.toast.warning { border-inline-start-color: var(--warning); }

.toast-icon { font-size: 18px; flex-shrink: 0; }
.toast-message { flex: 1; color: var(--text-1); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.show {
  display: flex;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 22px 26px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, rgba(99,102,241,0.05), transparent);
}

.modal-header h3 {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-close {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-3);
  cursor: pointer;
  border-radius: 10px;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.modal-close:hover {
  background: var(--surface-hover);
  color: var(--text-1);
}

.modal-body {
  padding: 26px;
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.7;
}

.modal-body h4 {
  color: var(--text-1);
  margin-bottom: 10px;
  margin-top: 20px;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.modal-body h4:first-child { margin-top: 0; }

.modal-body ul {
  list-style: none;
  padding: 0;
  margin: 10px 0;
}

.modal-body ul li {
  padding: 8px 0 8px 26px;
  position: relative;
  font-size: 13px;
  line-height: 1.6;
}

.modal-body ul li::before {
  content: '✦';
  position: absolute;
  inset-inline-start: 4px;
  color: var(--primary);
  font-size: 12px;
}

.modal-footer {
  padding: 18px 26px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--surface);
}

.btn {
  padding: 11px 22px;
  border-radius: 12px;
  border: none;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--gradient-primary);
  color: white;
  box-shadow: 0 4px 16px var(--primary-glow);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px var(--primary-glow);
}

.btn-secondary {
  background: var(--surface);
  color: var(--text-2);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--surface-hover);
  color: var(--text-1);
}

/* ============ MOBILE ============ */
.mobile-toggle {
  display: none;
  position: fixed;
  top: 12px;
  inset-inline-start: 12px;
  z-index: 200;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 140;
  backdrop-filter: blur(4px);
}

.sidebar-overlay.show { display: block; }

@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    inset-inline-start: 0;
    top: 0;
    height: 100vh;
    z-index: 150;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
  }

  [dir="rtl"] .sidebar {
    transform: translateX(100%);
  }

  .sidebar.open { transform: translateX(0) !important; }
  .mobile-toggle { display: flex; }
  .content { padding: 20px 16px; }
  .topbar { padding: 0 16px; padding-inline-start: 60px; }
  .topbar-btn span:not(.spinner) { display: none; }
  .topbar-btn { padding: 9px 12px; }
  .category-grid, .children-grid { grid-template-columns: 1fr; }
  .dashboard-hero { padding: 32px 24px; }
  .dashboard-hero h1 { font-size: 28px; }
  .dashboard-hero .hero-desc { font-size: 14px; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .topic-hero { padding: 24px 20px; }
  .topic-info h1 { font-size: 22px; }
  .topic-icon-wrap { width: 56px; height: 56px; font-size: 28px; }
  .mnemonics-grid { grid-template-columns: 1fr; }
  .quiz-card { padding: 24px 20px; }
  .quiz-question { font-size: 16px; }
  .flashcard-face { padding: 28px 20px; }
  .flashcard-text { font-size: 18px; }
  .results-score { font-size: 56px; }
  .results-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .results-stat { padding: 12px 8px; }
  .results-stat-value { font-size: 22px; }
  .quiz-header { padding: 16px; }
  .section-header h2 { font-size: 18px; }
  .cc-stats { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cc-stat-value { font-size: 15px; }
  .cc-stat-label { font-size: 8px; }
  .category-card { padding: 22px; }
  .cc-title h3 { font-size: 17px; }
}

@media (max-width: 500px) {
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .hero-stat { padding: 12px; }
  .hero-stat .hs-icon { width: 36px; height: 36px; font-size: 18px; }
  .hero-stat .hs-value { font-size: 20px; }
  .quiz-stats { width: 100%; justify-content: space-between; }
  .quiz-nav { flex-direction: column; }
  .quiz-nav-btn { width: 100%; justify-content: center; }
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-4); }

[dir="rtl"] .breadcrumb-sep { transform: scaleX(-1); }

// ==================== DATA LOADING ====================
async function loadData() {
  try {
    const response = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    state.data = normalizeData(data);
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderAll();
  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('loadingScreen').innerHTML = `
      <div style="text-align:center;padding:20px;">
        <div style="font-size:56px;margin-bottom:16px;">⚠️</div>
        <h3 style="color:var(--text-1);margin-bottom:8px;font-size:18px;">${t('loadingFailed')}</h3>
        <p style="color:var(--text-3);font-size:13px;margin-bottom:20px;">${err.message}</p>
        <button class="btn btn-primary" onclick="location.reload()">🔄 ${t('refresh')}</button>
      </div>
    `;
  }
}

async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const response = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    state.data = normalizeData(data);

    toast(t('refreshSuccess'), 'success');

  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>🔄</span> <span id="refreshLabel">' + t('refresh') + '</span>';
  }
}

// Normalize JSON to unified structure
// Supports:
// - categories -> subjects -> topics -> subtopics -> content
// - categories -> subjects -> topics -> content
// - categories -> children -> children -> children (generic)
function normalizeData(data) {
  if (!data) return { categories: [] };
  if (Array.isArray(data)) return { categories: data.map(normalizeItem) };
  if (data.categories) {
    return { categories: data.categories.map(normalizeItem) };
  }
  return { categories: [] };
}

function normalizeItem(item) {
  if (!item) return null;
  const result = {
    id: item.id || ('id_' + Math.random().toString(36).slice(2, 8)),
    name: item.name || '',
    icon: item.icon || '📚',
    description: item.description || '',
    content: item.content || null,
    children: []
  };

  // Collect children from various possible keys
  const childSources = [
    item.children,
    item.subjects,
    item.topics,
    item.subtopics,
    item.categories
  ];

  childSources.forEach(source => {
    if (Array.isArray(source)) {
      source.forEach(child => {
        const normalized = normalizeItem(child);
        if (normalized) result.children.push(normalized);
      });
    }
  });

  return result;
}

function getCurrentItem() {
  if (state.navStack.length === 0) return null;
  return state.navStack[state.navStack.length - 1].item;

function navigateTo(item) {
  state.navStack.push({ item });
  state.currentTab = 'mcqs';
  renderAll();
  document.getElementById('content').scrollTo(0, 0);
  closeSidebar();
}

function goBack() {
  if (state.navStack.length > 0) {
    state.navStack.pop();
    renderAll();
    document.getElementById('content').scrollTo(0, 0);
  }
}

function goToIndex(index) {
  state.navStack = state.navStack.slice(0, index);
  renderAll();
  document.getElementById('content').scrollTo(0, 0);
}

function goHome() {
  state.navStack = [];
  renderAll();
  document.getElementById('content').scrollTo(0, 0);
  closeSidebar();
}

// ==================== DATA HELPERS ====================
function countContent(item) {
  if (!item) return { mcqs: 0, qa: 0, flash: 0, mnem: 0, total: 0 };
  const c = item.content || {};
  const direct = {
    mcqs: (c.mcqs || []).length,
    qa: (c.qa || []).length,
    flash: (c.flashcards || []).length,
    mnem: (c.mnemonics || []).length
  };
  // Also count from all descendants
  let childCount = { mcqs: 0, qa: 0, flash: 0, mnem: 0 };
  (item.children || []).forEach(child => {
    const cc = countContent(child);
    childCount.mcqs += cc.mcqs;
    childCount.qa += cc.qa;
    childCount.flash += cc.flash;
    childCount.mnem += cc.mnem;
  });
  const total = {
    mcqs: direct.mcqs + childCount.mcqs,
    qa: direct.qa + childCount.qa,
    flash: direct.flash + childCount.flash,
    mnem: direct.mnem + childCount.mnem
  };
  total.total = total.mcqs + total.qa + total.flash + total.mnem;
  return total;
}

function getItemType(item) {
  if (!item) return 'empty';
  const hasChildren = (item.children || []).length > 0;
  const hasContent = item.content && (
    (item.content.mcqs || []).length > 0 ||
    (item.content.qa || []).length > 0 ||
    (item.content.flashcards || []).length > 0 ||
    (item.content.mnemonics || []).length > 0
  );
  if (hasChildren) return 'container'; // has sub-items
  if (hasContent) return 'leaf'; // has content, no children
  return 'empty';
}

// ==================== UTILITIES ====================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function getNavTitle() {
  const current = getCurrentItem();
  if (!current) return 'categories';
  const depth = state.navStack.length;
  if (depth === 1) return 'subjects';
  if (depth === 2) return 'topics';
  return 'subtopics';
}

function buildPathToCurrent(childIdx) {
  // Build JS expression to navigate to child
  let path = 'state.data';
  // We need to track the path from root to current
  // Since we don't store indices, we'll use a different approach
  // Store the item reference directly
  const current = getCurrentItem();
  const child = current.children[childIdx];
  return `navigateToItem(${JSON.stringify(child.id)})`;
}

// Navigate by ID - search through tree
function navigateToItem(id) {
  const item = findItemById(state.data?.categories || [], id);
  if (item) {
    navigateTo(item);
  }
}

function findItemById(items, id) {
  for (const item of items) {
    if (item.id === id) return item;
    if (item.children && item.children.length > 0) {
      const found = findItemById(item.children, id);
      if (found) return found;
    }
  }
  return null;
}

  content.innerHTML = html;
}

function renderLeafView(item) {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="topic-viewer">${renderContentTabs(item)}</div>`;
}

function renderEmptyView() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="topic-viewer">
      <div class="empty-state">
        <div class="es-icon">📭</div>
        <h3>${t('noContent')}</h3>
        <p>${t('noContentDesc')}</p>
      </div>
    </div>
  `;
}

function buildPathDisplay() {
  const parts = [];
  state.navStack.forEach(entry => {
    parts.push(`<span>${entry.item.icon || '📚'} ${escapeHtml(entry.item.name)}</span>`);
  });
  return parts.join('<span style="color:rgba(255,255,255,0.4)">›</span>');
}

function renderContentTabs(item) {
  const c = item.content || {};
  const mcqs = c.mcqs || [];
  const qa = c.qa || [];
  const flashcards = c.flashcards || [];
  const mnemonics = c.mnemonics || [];
  const topicKey = item.id;
  
  // Check if results are showing
  if (state.mcqShowResults[topicKey]) {
    return renderQuizResults(mcqs, topicKey);
  }
  
  let html = `
    <div class="topic-hero" style="margin-bottom:24px;">
      <div class="topic-hero-top">
        <div class="topic-icon-wrap">${item.icon || '📚'}</div>
        <div class="topic-info">
          <h1 class="${dirClass(item.name)}">${escapeHtml(item.name)}</h1>
          <div class="topic-path">${buildPathDisplay()}</div>
        </div>
      </div>
      ${item.description ? `<div class="topic-description ${dirClass(item.description)}">${escapeHtml(item.description)}</div>` : ''}
      <div class="topic-badges">
        ${mcqs.length ? `<div class="topic-badge">📋 ${mcqs.length} ${t('mcqs')}</div>` : ''}
        ${qa.length ? `<div class="topic-badge">💬 ${qa.length} ${t('qa')}</div>` : ''}
        ${flashcards.length ? `<div class="topic-badge">🎴 ${flashcards.length} ${t('flashcards')}</div>` : ''}
        ${mnemonics.length ? `<div class="topic-badge">🧠 ${mnemonics.length} ${t('mnemonics')}</div>` : ''}
      </div>
    </div>
    
    <div class="content-tabs">
      <button class="content-tab ${state.currentTab === 'mcqs' ? 'active' : ''}" onclick="switchTab('mcqs')" ${!mcqs.length ? 'disabled' : ''}>
        📋 ${t('mcqs')} <span class="tab-count">${mcqs.length}</span>
      </button>
      <button class="content-tab ${state.currentTab === 'qa' ? 'active' : ''}" onclick="switchTab('qa')" ${!qa.length ? 'disabled' : ''}>
        💬 ${t('qa')} <span class="tab-count">${qa.length}</span>
      </button>
      <button class="content-tab ${state.currentTab === 'flashcards' ? 'active' : ''}" onclick="switchTab('flashcards')" ${!flashcards.length ? 'disabled' : ''}>
        🎴 ${t('flashcards')} <span class="tab-count">${flashcards.length}</span>
      </button>
      <button class="content-tab ${state.currentTab === 'mnemonics' ? 'active' : ''}" onclick="switchTab('mnemonics')" ${!mnemonics.length ? 'disabled' : ''}>
        🧠 ${t('mnemonics')} <span class="tab-count">${mnemonics.length}</span>
      </button>
    </div>
    
    <div class="content-panel ${state.currentTab === 'mcqs' ? 'active' : ''}" id="panel-mcqs">
      ${mcqs.length ? renderMCQQuiz(mcqs, topicKey) : renderEmpty()}
    </div>
    
    <div class="content-panel ${state.currentTab === 'qa' ? 'active' : ''}" id="panel-qa">
      ${qa.length ? renderQA(qa, topicKey) : renderEmpty()}
    </div>
    
    <div class="content-panel ${state.currentTab === 'flashcards' ? 'active' : ''}" id="panel-flashcards">
      ${flashcards.length ? renderFlashcards(flashcards, topicKey) : renderEmpty()}
    </div>
    
    <div class="content-panel ${state.currentTab === 'mnemonics' ? 'active' : ''}" id="panel-mnemonics">
      ${mnemonics.length ? renderMnemonics(mnemonics) : renderEmpty()}
    </div>
  `;
  
  return html;
}

function renderEmpty() {
  return `
    <div class="empty-state">
      <div class="es-icon">📭</div>
      <h3>${t('noContent')}</h3>
      <p>${t('noContentDesc')}</p>
    </div>
  `;
}

// ==================== MCQ QUIZ MODE ====================
function renderMCQQuiz(mcqs, topicKey) {
  // Initialize state
  if (!state.mcqAnswers[topicKey]) state.mcqAnswers[topicKey] = {};
  if (state.mcqCurrentIndex[topicKey] === undefined) state.mcqCurrentIndex[topicKey] = 0;
  
  const answers = state.mcqAnswers[topicKey];
  const currentIdx = state.mcqCurrentIndex[topicKey];
  const mcq = mcqs[currentIdx];
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  
  const answered = Object.keys(answers).length;
  const correct = Object.entries(answers).filter(([qIdx, optIdx]) => mcqs[qIdx].answer === optIdx).length;
  const wrong = answered - correct;
  const progress = mcqs.length > 0 ? (answered / mcqs.length) * 100 : 0;
  
  const wasAnswered = answers[currentIdx] !== undefined;
  const selected = answers[currentIdx];
  const correctIdx = mcq.answer;
  const question = mcq.q || mcq.question || '';
  const options = mcq.options || [];
  const explanation = mcq.explanation || mcq.explain || '';
  const isCorrect = wasAnswered && selected === correctIdx;
  
  let cardClass = 'quiz-card';
  if (wasAnswered) cardClass += isCorrect ? ' answered-correct' : ' answered-wrong';
  
  let html = `
    <div class="quiz-container">
      <div class="quiz-header">
        <div class="quiz-progress-info">
          <div class="quiz-progress-label">
            <span>${t('progress')}</span>
            <span>${answered} / ${mcqs.length}</span>
          </div>
          <div class="quiz-progress-bar">
            <div class="quiz-progress-fill" style="width: ${progress}%"></div>
          </div>
        </div>
        <div class="quiz-stats">
          <div class="quiz-stat correct">✓ ${correct}</div>
          <div class="quiz-stat wrong">✗ ${wrong}</div>
          <div class="quiz-stat remaining">${mcqs.length - answered} ${t('remaining')}</div>
        </div>
      </div>
      
      <div class="${cardClass}">
        <div class="quiz-card-header">
          <div class="quiz-number">${t('question')} ${currentIdx + 1}</div>
          <div class="quiz-status">
            ${isCorrect ? '✓ ' + t('correct') : '✗ ' + t('wrong')}
          </div>
        </div>
        <div class="quiz-question ${dirClass(question)}">${escapeHtml(question)}</div>
        <div class="quiz-options">
  `;
  
  options.forEach((opt, oIdx) => {
    let classes = 'quiz-option';
    if (wasAnswered) {
      classes += ' disabled';
      if (oIdx === correctIdx) classes += ' correct';
      else if (oIdx === selected) classes += ' wrong';
    }
    html += `
      <div class="${classes}" onclick="${wasAnswered ? '' : `answerMCQ('${topicKey}', ${currentIdx}, ${oIdx})`}">
        <div class="opt-letter">${letters[oIdx]}</div>
        <div class="opt-text ${dirClass(opt)}">${escapeHtml(opt)}</div>
      </div>
    `;
  });
  
  html += `</div>`;
  
  if (explanation) {
    html += `
      <div class="quiz-explanation ${wasAnswered ? 'show' : ''} ${dirClass(explanation)}">
        <strong>${t('explanation')}:</strong> ${escapeHtml(explanation)}
      </div>
    `;
  }
  
  html += `</div>`;
  
  // Navigation buttons
  html += `
    <div class="quiz-nav">
      <button class="quiz-nav-btn" onclick="prevMCQ('${topicKey}')" ${currentIdx === 0 ? 'disabled' : ''}>
        ← ${t('previous')}
      </button>
      ${answered === mcqs.length ? `
        <button class="quiz-nav-btn primary" onclick="finishQuiz('${topicKey}')">
          ${t('finish')} 🏁
        </button>
      ` : currentIdx < mcqs.length - 1 ? `
        <button class="quiz-nav-btn primary" onclick="nextMCQ('${topicKey}')">
          ${t('next')} →
        </button>
      ` : `
        <button class="quiz-nav-btn primary" onclick="finishQuiz('${topicKey}')">
          ${t('finish')} 🏁
        </button>
      `}
    </div>
  `;
  
  // Question dots
  html += `<div class="quiz-dots">`;
  mcqs.forEach((_, idx) => {
    let dotClass = 'quiz-dot';
    if (idx === currentIdx) dotClass += ' current';
    else if (answers[idx] !== undefined) {
      dotClass += answers[idx] === mcqs[idx].answer ? ' answered-correct' : ' answered-wrong';
    }
    html += `<button class="${dotClass}" onclick="goToMCQ('${topicKey}', ${idx})">${idx + 1}</button>`;
  });
  html += `</div>`;
  
  html += `</div>`;
  return html;
}

function answerMCQ(topicKey, qIdx, optIdx) {
  if (!state.mcqAnswers[topicKey]) state.mcqAnswers[topicKey] = {};
  state.mcqAnswers[topicKey][qIdx] = optIdx;
  renderContent();
}

function prevMCQ(topicKey) {
  if (state.mcqCurrentIndex[topicKey] > 0) {
    state.mcqCurrentIndex[topicKey]--;
    renderContent();
  }
}

function nextMCQ(topicKey) {
  const item = getCurrentItem();
  if (!item) return;
  const mcqs = item.content?.mcqs || [];
  if (state.mcqCurrentIndex[topicKey] < mcqs.length - 1) {
    state.mcqCurrentIndex[topicKey]++;
    renderContent();
  }
}

function goToMCQ(topicKey, idx) {
  state.mcqCurrentIndex[topicKey] = idx;
  renderContent();
}

function finishQuiz(topicKey) {
  state.mcqShowResults[topicKey] = true;
  renderContent();
  document.getElementById('content').scrollTo(0, 0);
}

function renderQuizResults(mcqs, topicKey) {
  const answers = state.mcqAnswers[topicKey] || {};
  const total = mcqs.length;
  const correct = Object.entries(answers).filter(([qIdx, optIdx]) => mcqs[qIdx].answer === optIdx).length;
  const wrong = total - correct;
  const percent = total > 0 ? Math.round((correct / total) * 100) : 0;
  
  let icon, message;
  if (percent >= 90) { icon = '🏆'; message = t('excellent'); }
  else if (percent >= 70) { icon = '🌟'; message = t('great'); }
  else if (percent >= 50) { icon = '📚'; message = t('good'); }
  else { icon = '💪'; message = t('keepGoing'); }
  
  return `
    <div class="quiz-container">
      <div class="quiz-results">
        <div class="results-icon">${icon}</div>
        <div class="results-score">${percent}%</div>
        <div class="results-label">${t('youScored')} ${correct} / ${total}</div>
        
        <div class="results-stats">
          <div class="results-stat">
            <div class="results-stat-value correct">${correct}</div>
            <div class="results-stat-label">${t('correct')}</div>
          </div>
          <div class="results-stat">
            <div class="results-stat-value wrong">${wrong}</div>
            <div class="results-stat-label">${t('wrong')}</div>
          </div>
          <div class="results-stat">
            <div class="results-stat-value total">${total}</div>
            <div class="results-stat-label">${t('question')}</div>
          </div>
        </div>
        
        <div class="results-message">${message}</div>
        
        <div class="results-actions">
          <button class="btn btn-primary" onclick="retryQuiz('${topicKey}')">🔄 ${t('retry')}</button>
          <button class="btn btn-secondary" onclick="reviewQuiz('${topicKey}')">📖 ${t('reviewAnswers')}</button>
          <button class="btn btn-secondary" onclick="backToTopic('${topicKey}')">← ${t('backToTopic')}</button>
        </div>
      </div>
    </div>
  `;
}

function retryQuiz(topicKey) {
  state.mcqAnswers[topicKey] = {};
  state.mcqCurrentIndex[topicKey] = 0;
  state.mcqShowResults[topicKey] = false;
  renderContent();
}

function reviewQuiz(topicKey) {
  state.mcqShowResults[topicKey] = false;
  state.mcqCurrentIndex[topicKey] = 0;
  renderContent();
}

function backToTopic(topicKey) {
  state.mcqShowResults[topicKey] = false;
  renderContent();
}

// ==================== Q&A ====================
function renderQA(qa, topicKey) {
  let html = `<div class="qa-list">`;
  qa.forEach((item, idx) => {
    const cardId = `${topicKey}_qa_${idx}`;
    const isOpen = state.openQA[cardId];
    const q = item.q || item.question || '';
    const a = item.a || item.answer || '';
    html += `
      <div class="qa-card ${isOpen ? 'open' : ''}" id="qa-${cardId}" onclick="toggleQA('${cardId}')">
        <div class="qa-question">
          <div class="q-icon">Q</div>
          <div class="q-text ${dirClass(q)}">${escapeHtml(q)}</div>
          <div class="q-toggle">▾</div>
        </div>
        <div class="qa-answer">
          <div class="qa-answer-inner ${dirClass(a)}">
            <span class="arrow">→</span> ${escapeHtml(a)}
          </div>
        </div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

function toggleQA(cardId) {
  state.openQA[cardId] = !state.openQA[cardId];
  const card = document.getElementById(`qa-${cardId}`);
  if (card) card.classList.toggle('open');
}

// ==================== FLASHCARDS ====================
function renderFlashcards(flashcards, topicKey) {
  if (state.flashcardIndex[topicKey] === undefined) state.flashcardIndex[topicKey] = 0;
  const idx = state.flashcardIndex[topicKey];
  const card = flashcards[idx];
  const front = card.front || card.q || card.question || '';
  const back = card.back || card.a || card.answer || '';
  
  return `
    <div class="flashcard-wrapper">
      <div class="flashcard-controls">
        <div class="flashcard-counter">
          <span>${idx + 1}</span> ${t('of')} ${flashcards.length}
        </div>
        <div class="flashcard-nav">
          <button onclick="prevFlashcard('${topicKey}', ${flashcards.length})" ${idx === 0 ? 'disabled' : ''}>← ${t('previous')}</button>
          <button onclick="nextFlashcard('${topicKey}', ${flashcards.length})" ${idx === flashcards.length - 1 ? 'disabled' : ''}>${t('next')} →</button>
        </div>
      </div>
      <div class="flashcard-container">
        <div class="flashcard" id="flashcard-${topicKey}" onclick="flipFlashcard('${topicKey}')">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-label">${t('front')}</div>
            <div class="flashcard-text ${dirClass(front)}">${escapeHtml(front)}</div>
            <div class="flashcard-hint">👆 ${t('tapToFlip')}</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-label">${t('back')}</div>
            <div class="flashcard-text ${dirClass(back)}">${escapeHtml(back)}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function flipFlashcard(topicKey) {
  const card = document.getElementById(`flashcard-${topicKey}`);
  if (card) card.classList.toggle('flipped');
}

function prevFlashcard(topicKey, total) {
  if (state.flashcardIndex[topicKey] > 0) {
    state.flashcardIndex[topicKey]--;
    renderContent();
  }
}

function nextFlashcard(topicKey, total) {
  if (state.flashcardIndex[topicKey] < total - 1) {
    state.flashcardIndex[topicKey]++;
    renderContent();
  }
}

// ==================== MNEMONICS ====================
function renderMnemonics(mnemonics) {
  let html = `<div class="mnemonics-grid">`;
  mnemonics.forEach(mn => {
    const title = mn.title || '';
    const code = mn.code || '';
    const items = mn.items || [];
    html += `
      <div class="mnemonic-card">
        <div class="mn-header">
          <div class="mn-icon-wrap">${mn.icon || '🧠'}</div>
          <div class="mn-title ${dirClass(title)}">${escapeHtml(title)}</div>
        </div>
        ${code ? `<div class="mn-code ${dirClass(code)}">${escapeHtml(code)}</div>` : ''}
        <ul class="mn-items">
          ${items.map(it => `
            <li>
              <span class="letter ${dirClass(it.letter)}">${escapeHtml(it.letter)}</span>
              <span class="${dirClass(it.text)}">${escapeHtml(it.text)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

// ==================== TABS ====================
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.content-tab').forEach(t => {
    const onclick = t.getAttribute('onclick') || '';
    t.classList.toggle('active', onclick.includes(`'${tab}'`));
  });
  document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById(`panel-${tab}`);
  if (panel) panel.classList.add('active');
}

// ==================== SIDEBAR ====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ==================== MODAL ====================
function openAboutModal() {
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-header">
      <h3>ℹ️ ${t('aboutTitle')}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p>${t('aboutText')}</p>
      <h4>✨ ${t('features')}</h4>
      <ul>
        ${t('featureList').map(f => `<li>${f}</li>`).join('')}
      </ul>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">✓ ${t('ok')}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ==================== TOAST ====================
function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <span class="toast-icon">${icons[type] || icons.info}</span>
    <span class="toast-message">${message}</span>
  `;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'slideIn 0.3s ease reverse';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('show')) {
      closeModal();
    } else if (state.navStack.length > 0) {
      goBack();
    }
  }
  if ((e.altKey || e.metaKey) && e.key === 'ArrowLeft') {
    e.preventDefault();
    goBack();
  }
});

// ==================== INIT ====================
function init() {
  applyTheme();
  setLanguage(state.language);
  loadData();
}

init();
</script>
</body>
</html>
