<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MedExit — Medical Exit Exam Prep</title>
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedExit">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-naskh-arabic@latest/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg-0:#04070d;--bg-1:#0a1020;--bg-2:#111827;--bg-3:#1a2340;--bg-4:#232e52;
--surface:rgba(255,255,255,0.03);--surface-hover:rgba(255,255,255,0.06);--surface-active:rgba(255,255,255,0.09);
--border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.14);
--text-1:#f5f7fb;--text-2:#c5cde0;--text-3:#8892ad;--text-4:#5a6480;
--primary:#6366f1;--primary-hover:#818cf8;--primary-glow:rgba(99,102,241,0.4);--primary-soft:rgba(99,102,241,0.15);
--success:#10b981;--success-soft:rgba(16,185,129,0.15);
--danger:#ef4444;--danger-soft:rgba(239,68,68,0.15);
--warning:#f59e0b;--warning-soft:rgba(245,158,11,0.15);
--info:#06b6d4;--info-soft:rgba(6,182,212,0.15);
--purple:#a855f7;--purple-soft:rgba(168,85,247,0.15);
--pink:#ec4899;--pink-soft:rgba(236,72,153,0.15);
--gradient-primary:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
--gradient-accent:linear-gradient(135deg,#06b6d4 0%,#6366f1 100%);
--gradient-success:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
--gradient-warm:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);
--gradient-cool:linear-gradient(135deg,#6366f1 0%,#06b6d4 100%);
--gradient-medical:linear-gradient(135deg,#0ea5e9 0%,#6366f1 50%,#a855f7 100%);
--shadow-sm:0 2px 8px rgba(0,0,0,0.3);--shadow-md:0 8px 24px rgba(0,0,0,0.4);--shadow-lg:0 20px 50px rgba(0,0,0,0.5);
--shadow-glow:0 0 40px rgba(99,102,241,0.25);
--radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;
--font-main:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
--font-arabic:'Noto Naskh Arabic','Inter',sans-serif;
--sidebar-w:300px;--topbar-h:64px;
}
[data-theme="light"]{
--bg-0:#f8fafc;--bg-1:#ffffff;--bg-2:#f1f5f9;--bg-3:#e2e8f0;--bg-4:#cbd5e1;
--surface:rgba(0,0,0,0.02);--surface-hover:rgba(0,0,0,0.04);--surface-active:rgba(0,0,0,0.07);
--border:rgba(0,0,0,0.08);--border-strong:rgba(0,0,0,0.15);
--text-1:#0f172a;--text-2:#334155;--text-3:#64748b;--text-4:#94a3b8;
--primary:#6366f1;--primary-hover:#4f46e5;
--shadow-sm:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 8px 24px rgba(0,0,0,0.08);--shadow-lg:0 20px 50px rgba(0,0,0,0.12);
}
html,body{font-family:var(--font-main);background:var(--bg-0);color:var(--text-1);min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(99,102,241,0.12) 0%,transparent 50%),radial-gradient(ellipse 60% 50% at 80% 100%,rgba(236,72,153,0.08) 0%,transparent 50%),radial-gradient(ellipse 50% 40% at 50% 50%,rgba(6,182,212,0.04) 0%,transparent 50%);pointer-events:none;z-index:0}
[data-theme="light"] body::before{background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(99,102,241,0.06) 0%,transparent 50%),radial-gradient(ellipse 60% 50% at 80% 100%,rgba(236,72,153,0.04) 0%,transparent 50%)}
.rtl-text{font-family:var(--font-arabic)!important;direction:rtl!important;text-align:right!important;line-height:1.9!important}
.ltr-text{direction:ltr!important;text-align:left!important}
.app{display:flex;height:100vh;position:relative;z-index:1;overscroll-behavior:none}
.sidebar{width:var(--sidebar-w);background:var(--bg-1);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s ease,opacity .3s;backdrop-filter:blur(20px);overscroll-behavior:none}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(236,72,153,0.04))}
.logo{width:48px;height:48px;border-radius:14px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 8px 24px var(--primary-glow);position:relative;overflow:hidden}
.logo::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent)}
.logo-text h1{font-size:18px;font-weight:800;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.logo-text p{font-size:11px;color:var(--text-3);letter-spacing:.3px;margin-top:2px}
.controls-bar{padding:14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.lang-selector{flex:1;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;gap:2px}
.lang-btn{flex:1;padding:8px 4px;background:transparent;border:none;color:var(--text-3);font-size:11px;font-weight:700;cursor:pointer;border-radius:8px;transition:all .2s;font-family:inherit}
.lang-btn.active{background:var(--gradient-primary);color:white;box-shadow:0 4px 12px var(--primary-glow)}
.lang-btn:hover:not(.active){color:var(--text-1);background:var(--surface-hover)}
.theme-toggle{width:42px;height:42px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
.theme-toggle:hover{background:var(--surface-hover);color:var(--primary-hover);border-color:var(--primary)}
.breadcrumb-nav{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:12px;overflow-x:auto;white-space:nowrap;background:var(--surface);overscroll-behavior:none}
.breadcrumb-nav::-webkit-scrollbar{display:none}
.breadcrumb-item{color:var(--text-3);cursor:pointer;padding:5px 10px;border-radius:8px;transition:all .15s;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.breadcrumb-item:hover{color:var(--text-1);background:var(--surface-hover)}
.breadcrumb-item.current{color:var(--primary-hover);background:var(--primary-soft)}
.breadcrumb-sep{color:var(--text-4);font-size:10px}
.nav-list{flex:1;overflow-y:auto;padding:12px;overscroll-behavior:contain}
.nav-list::-webkit-scrollbar{width:5px}
.nav-list::-webkit-scrollbar-track{background:transparent}
.nav-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav-section-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-4);padding:14px 12px 8px;display:flex;align-items:center;gap:8px}
.nav-section-title::before{content:'';width:16px;height:2px;background:var(--gradient-primary);border-radius:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:13px;color:var(--text-2);transition:all .15s;margin-bottom:3px;position:relative;font-weight:500}
.nav-item:hover{background:var(--surface-hover);color:var(--text-1)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-hover);font-weight:600}
.nav-item.active::before{content:'';position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--gradient-primary);border-radius:0 3px 3px 0}
.nav-item .ni-icon{font-size:18px;flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:8px}
.nav-item.active .ni-icon{background:var(--gradient-primary);box-shadow:0 4px 12px var(--primary-glow)}
.nav-item .ni-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .ni-count{font-size:10px;background:var(--surface);color:var(--text-3);padding:3px 8px;border-radius:10px;font-weight:700}
.nav-item.active .ni-count{background:var(--gradient-primary);color:white}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--border);font-size:10px;color:var(--text-4);text-align:center;background:var(--surface);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:all .3s}
.topbar{height:var(--topbar-h);padding:0 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:var(--bg-1);backdrop-filter:blur(20px);flex-shrink:0;transition:all .3s}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:12px;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-hover);color:var(--text-1);border-color:var(--border-strong)}
.icon-btn.visible{display:flex}
.icon-btn.back:hover{background:var(--primary-soft);color:var(--primary-hover);border-color:var(--primary)}
.topbar-title{flex:1;min-width:0}
.topbar-title h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-title p{font-size:11px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-actions{display:flex;gap:8px;align-items:center}
.topbar-btn{padding:9px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text-2);font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:6px;font-weight:600}
.topbar-btn:hover{background:var(--surface-hover);color:var(--text-1);border-color:var(--border-strong)}
.topbar-btn:disabled{opacity:.5;cursor:not-allowed}
.topbar-btn .spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px;scroll-behavior:smooth;overscroll-behavior:none;-webkit-overflow-scrolling:touch;transition:padding .3s}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ============ FULLSCREEN QUIZ MODE ============ */
.app.quiz-fullscreen .sidebar{transform:translateX(-100%);opacity:0;pointer-events:none;width:0;overflow:hidden;border:none}
[dir="rtl"] .app.quiz-fullscreen .sidebar{transform:translateX(100%)}
.app.quiz-fullscreen .topbar{display:none}
.app.quiz-fullscreen .mobile-toggle{display:none!important}
.app.quiz-fullscreen .content{padding:0}
.app.quiz-fullscreen .main{background:var(--bg-0)}

.quiz-fullscreen-page{min-height:100vh;display:flex;flex-direction:column;background:var(--bg-0);position:relative;animation:fadeIn .4s ease}
.quiz-fullscreen-page::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(99,102,241,0.1) 0%,transparent 50%),radial-gradient(ellipse 60% 50% at 80% 100%,rgba(236,72,153,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.quiz-fs-header{position:sticky;top:0;z-index:10;padding:16px 24px;background:rgba(4,7,13,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
[data-theme="light"] .quiz-fs-header{background:rgba(255,255,255,0.9)}
.quiz-fs-exit{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0}
.quiz-fs-exit:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.quiz-fs-title{flex:1;min-width:0}
.quiz-fs-title h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quiz-fs-title p{font-size:11px;color:var(--text-3);margin-top:2px}
.quiz-fs-timer{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;flex-shrink:0}
.quiz-fs-timer .timer-icon{color:var(--warning);font-size:14px}
.quiz-fs-streak{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--warning-soft);border:1px solid var(--warning);border-radius:10px;font-size:12px;font-weight:700;color:var(--warning);flex-shrink:0}
.quiz-fs-streak.on-fire{animation:pulse 1s ease infinite;background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(239,68,68,0.2));border-color:var(--danger);color:var(--danger)}
.quiz-fs-progress{padding:12px 24px;background:var(--bg-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.quiz-fs-progress-bar-wrap{flex:1;min-width:200px}
.quiz-fs-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:6px;font-weight:600}
.quiz-fs-progress-bar{height:8px;background:var(--surface);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.quiz-fs-progress-fill{height:100%;background:var(--gradient-primary);border-radius:6px;transition:width .4s ease;box-shadow:0 0 10px var(--primary-glow);position:relative;overflow:hidden}
.quiz-fs-progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}
.quiz-fs-stats{display:flex;gap:8px;flex-wrap:wrap}
.quiz-fs-stat{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;background:var(--surface);font-size:12px;font-weight:700}
.quiz-fs-stat.correct{color:var(--success);background:var(--success-soft)}
.quiz-fs-stat.wrong{color:var(--danger);background:var(--danger-soft)}
.quiz-fs-stat.remaining{color:var(--text-3)}
.quiz-fs-body{flex:1;padding:24px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.quiz-fs-card-wrap{width:100%;max-width:860px;animation:fadeUp .4s ease}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(400px) rotate(720deg);opacity:0}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

.dashboard{max-width:1280px;margin:0 auto;animation:fadeUp .5s ease}
.dashboard-hero{position:relative;padding:48px 40px;margin-bottom:36px;border-radius:var(--radius-xl);background:linear-gradient(135deg,rgba(99,102,241,0.15) 0%,rgba(139,92,246,0.1) 40%,rgba(236,72,153,0.1) 100%);border:1px solid var(--border);overflow:hidden;backdrop-filter:blur(20px)}
.dashboard-hero::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.3) 0%,transparent 70%);pointer-events:none;animation:float 8s ease-in-out infinite}
.dashboard-hero::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(236,72,153,0.2) 0%,transparent 70%);pointer-events:none;animation:float 10s ease-in-out infinite reverse}
.dashboard-hero>*{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);color:white;font-size:11px;font-weight:700;border-radius:20px;margin-bottom:18px;letter-spacing:.5px;text-transform:uppercase}
.dashboard-hero h1{font-size:40px;font-weight:800;margin-bottom:14px;letter-spacing:-1px;line-height:1.15;color:white;text-shadow:0 2px 20px rgba(0,0,0,0.2)}
.dashboard-hero .hero-desc{color:rgba(255,255,255,0.85);font-size:16px;line-height:1.6;max-width:600px;margin-bottom:28px}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:700px}
.hero-stat{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:var(--radius-md);padding:16px 18px;display:flex;align-items:center;gap:14px;transition:all .3s}
.hero-stat:hover{background:rgba(255,255,255,0.15);transform:translateY(-2px)}
.hero-stat .hs-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hero-stat .hs-value{font-size:24px;font-weight:800;color:white;line-height:1}
.hero-stat .hs-label{font-size:11px;color:rgba(255,255,255,0.7);margin-top:4px;font-weight:500}
.section-header{display:flex;align-items:flex-end;justify-content:space-between;margin:32px 0 20px;gap:16px}
.section-header h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:12px;letter-spacing:-.5px}
.section-header h2::before{content:'';width:5px;height:26px;background:var(--gradient-primary);border-radius:3px;box-shadow:0 0 12px var(--primary-glow)}
.section-subtitle{font-size:13px;color:var(--text-3);margin-top:4px;font-weight:500}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.category-card{position:relative;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);overflow:hidden;backdrop-filter:blur(10px)}
.category-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--card-gradient,var(--gradient-primary));transform:scaleX(0);transform-origin:left;transition:transform .4s}
.category-card:hover::before{transform:scaleX(1)}
.category-card::after{content:'';position:absolute;top:-50%;right:-30%;width:300px;height:300px;background:radial-gradient(circle,var(--card-glow,rgba(99,102,241,0.1)) 0%,transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none}
.category-card:hover::after{opacity:1}
.category-card:hover{border-color:var(--border-strong);transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.cc-header{display:flex;align-items:center;gap:16px;margin-bottom:16px;position:relative;z-index:1}
.cc-icon-wrap{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;background:var(--card-gradient,var(--gradient-primary));box-shadow:0 8px 20px var(--card-glow,var(--primary-glow));position:relative;overflow:hidden}
.cc-icon-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent)}
.cc-title{flex:1;min-width:0}
.cc-title h3{font-size:19px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.cc-desc{font-size:12px;color:var(--text-3);line-height:1.5}
.cc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:18px;border-top:1px solid var(--border);position:relative;z-index:1}
.cc-stat{text-align:center;padding:10px 4px;background:var(--surface);border-radius:10px;transition:all .2s}
.category-card:hover .cc-stat{background:var(--surface-hover)}
.cc-stat-value{font-size:18px;font-weight:800;line-height:1}
.cc-stat-label{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:700}
.cc-stat.mcq .cc-stat-value{color:var(--primary-hover)}
.cc-stat.qa .cc-stat-value{color:var(--success)}
.cc-stat.flash .cc-stat-value{color:var(--purple)}
.cc-stat.mnem .cc-stat-value{color:var(--warning)}
.cc-arrow{position:absolute;bottom:24px;inset-inline-end:24px;width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:16px;transition:all .3s;z-index:1}
.category-card:hover .cc-arrow{background:var(--gradient-primary);color:white;transform:translateX(4px);box-shadow:0 4px 16px var(--primary-glow)}
[dir="rtl"] .category-card:hover .cc-arrow{transform:translateX(-4px)}
.children-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;animation:fadeUp .4s ease}
.child-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:16px}
.child-card::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--gradient-primary);transform:scaleY(0);transition:transform .3s}
.child-card:hover::before{transform:scaleY(1)}
.child-card:hover{border-color:var(--border-strong);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.child-icon{width:52px;height:52px;border-radius:14px;background:var(--gradient-accent);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 6px 18px var(--primary-glow);position:relative;overflow:hidden}
.child-icon::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent)}
.child-content{flex:1;min-width:0}
.child-title{font-size:15px;font-weight:700;margin-bottom:6px;letter-spacing:-.2px;line-height:1.3}
.child-arrow{color:var(--text-4);font-size:18px;transition:all .2s;align-self:center}
.child-card:hover .child-arrow{color:var(--primary-hover);transform:translateX(3px)}
[dir="rtl"] .child-card:hover .child-arrow{transform:translateX(-3px)}
.content-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.content-badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.content-badge.mcq{background:var(--primary-soft);color:var(--primary-hover)}
.content-badge.qa{background:var(--success-soft);color:var(--success)}
.content-badge.flash{background:var(--purple-soft);color:var(--purple)}
.content-badge.mnem{background:var(--warning-soft);color:var(--warning)}
.content-badge.video{background:var(--pink-soft);color:var(--pink)}
.content-badge.image{background:var(--info-soft);color:var(--info)}
.topic-viewer{max-width:1100px;margin:0 auto;animation:fadeUp .4s ease}
.topic-hero{position:relative;padding:32px;margin-bottom:24px;border-radius:var(--radius-xl);background:linear-gradient(135deg,rgba(99,102,241,0.12),rgba(6,182,212,0.08));border:1px solid var(--border);overflow:hidden}
.topic-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.2) 0%,transparent 70%);pointer-events:none}
.topic-hero>*{position:relative;z-index:1}
.topic-hero-top{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.topic-icon-wrap{width:72px;height:72px;border-radius:20px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;box-shadow:0 10px 30px var(--primary-glow);position:relative;overflow:hidden}
.topic-icon-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent)}
.topic-info{flex:1;min-width:0}
.topic-info h1{font-size:28px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px;line-height:1.2;color:white}
.topic-path{font-size:12px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:500}
.topic-description{color:rgba(255,255,255,0.85);font-size:14px;line-height:1.7;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1)}
.topic-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.topic-badge{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);color:white}
.content-tabs{display:flex;gap:6px;padding:8px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:24px;overflow-x:auto;box-shadow:var(--shadow-sm)}
.content-tabs::-webkit-scrollbar{display:none}
.content-tab{padding:12px 20px;background:transparent;border:none;color:var(--text-3);font-size:13px;font-weight:700;cursor:pointer;border-radius:10px;transition:all .2s;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:8px}
.content-tab:hover:not(:disabled){color:var(--text-1);background:var(--surface-hover)}
.content-tab.active{background:var(--gradient-primary);color:white;box-shadow:0 4px 16px var(--primary-glow)}
.content-tab:disabled{opacity:.3;cursor:not-allowed}
.content-tab .tab-count{background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800}
.content-tab:not(.active) .tab-count{background:var(--surface);color:var(--text-3)}
.content-panel{display:none}
.content-panel.active{display:block;animation:fadeUp .3s ease}

/* ============ QUIZ STARTER MODAL ============ */
.quiz-starter-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);z-index:2500;display:none;align-items:center;justify-content:center;padding:20px}
.quiz-starter-overlay.show{display:flex;animation:fadeIn .3s ease}
.quiz-starter{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-xl);width:100%;max-width:520px;overflow:hidden;box-shadow:var(--shadow-lg);animation:scaleIn .4s cubic-bezier(.4,0,.2,1)}
.qs-header{padding:28px 32px 20px;background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(236,72,153,0.05));border-bottom:1px solid var(--border);text-align:center;position:relative;overflow:hidden}
.qs-header::before{content:'';position:absolute;top:-50%;right:-30%;width:300px;height:300px;background:radial-gradient(circle,rgba(99,102,241,0.2) 0%,transparent 70%);pointer-events:none}
.qs-header>*{position:relative;z-index:1}
.qs-icon{font-size:48px;margin-bottom:12px}
.qs-title{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.5px}
.qs-subtitle{font-size:13px;color:var(--text-3);font-weight:500}
.qs-body{padding:24px 32px}
.qs-section{margin-bottom:22px}
.qs-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.qs-count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qs-count-btn{padding:12px 8px;background:var(--surface);border:2px solid var(--border);border-radius:12px;color:var(--text-2);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center}
.qs-count-btn:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-hover)}
.qs-count-btn.active{background:var(--gradient-primary);color:white;border-color:transparent;box-shadow:0 4px 16px var(--primary-glow)}
.qs-count-btn small{display:block;font-size:9px;font-weight:600;opacity:.7;margin-top:2px}
.qs-custom-input{width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text-1);font-family:inherit;font-size:14px;font-weight:600;outline:none;transition:border-color .2s;margin-top:8px;display:none}
.qs-custom-input:focus{border-color:var(--primary)}
.qs-custom-input.show{display:block}
.qs-mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qs-mode-btn{padding:12px 8px;background:var(--surface);border:2px solid var(--border);border-radius:12px;color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.qs-mode-btn .mode-icon{font-size:20px}
.qs-mode-btn:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-hover)}
.qs-mode-btn.active{background:var(--gradient-primary);color:white;border-color:transparent;box-shadow:0 4px 16px var(--primary-glow)}
.qs-info-bar{display:flex;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;font-size:12px;font-weight:600}
.qs-info-item{flex:1;text-align:center}
.qs-info-item .qs-info-value{font-size:18px;font-weight:800;color:var(--primary-hover);line-height:1}
.qs-info-item .qs-info-label{font-size:10px;color:var(--text-3);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.qs-footer{padding:18px 32px 24px;display:flex;gap:10px}
.qs-footer .btn{flex:1;justify-content:center;padding:14px 20px;font-size:14px}

/* ============ QUIZ CARD (fullscreen) ============ */
.quiz-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-xl);padding:32px;position:relative;overflow:hidden;animation:fadeUp .4s ease;transition:border-color .3s}
.quiz-card::before{content:'';position:absolute;top:0;inset-inline-start:0;width:5px;height:100%;background:var(--gradient-primary)}
.quiz-card.answered-correct::before{background:var(--gradient-success)}
.quiz-card.answered-wrong::before{background:var(--gradient-warm)}
.quiz-card.answered-correct{border-color:rgba(16,185,129,0.3)}
.quiz-card.answered-wrong{border-color:rgba(239,68,68,0.3)}
.quiz-card-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.quiz-number{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 14px;background:var(--gradient-primary);color:white;font-size:14px;font-weight:800;border-radius:12px;box-shadow:0 4px 16px var(--primary-glow)}
.quiz-status{margin-inline-start:auto;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;display:none;align-items:center;gap:5px}
.quiz-card.answered-correct .quiz-status{display:flex;background:var(--success-soft);color:var(--success)}
.quiz-card.answered-wrong .quiz-status{display:flex;background:var(--danger-soft);color:var(--danger)}
.quiz-actions-top{display:flex;gap:6px;margin-inline-start:auto}
.quiz-action-btn{width:36px;height:36px;border:1px solid var(--border);background:var(--surface);color:var(--text-3);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.quiz-action-btn:hover{background:var(--surface-hover);color:var(--text-1);border-color:var(--border-strong)}
.quiz-action-btn.flagged{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
.quiz-action-btn.bookmarked{background:var(--purple-soft);color:var(--purple);border-color:var(--purple)}
.quiz-question{font-size:18px;font-weight:600;line-height:1.7;margin-bottom:20px;letter-spacing:-.3px}
.quiz-question-image{margin:16px 0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);max-height:300px;display:flex;align-items:center;justify-content:center;background:var(--bg-2)}
.quiz-question-image img{max-width:100%;max-height:300px;object-fit:contain;display:block}
.quiz-options{display:grid;gap:10px}
.quiz-option{padding:16px 18px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-md);cursor:pointer;transition:all .25s;display:flex;align-items:flex-start;gap:14px;font-size:14px;line-height:1.6;font-weight:500;position:relative;overflow:hidden}
.quiz-option:hover:not(.disabled){border-color:var(--primary);background:var(--primary-soft);transform:translateX(4px)}
[dir="rtl"] .quiz-option:hover:not(.disabled){transform:translateX(-4px)}
.quiz-option .opt-letter{width:32px;height:32px;border-radius:10px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;transition:all .2s;border:1px solid var(--border);position:relative;z-index:1}
.quiz-option .opt-text{flex:1;padding-top:3px;position:relative;z-index:1}
.quiz-option.correct{border-color:var(--success);background:var(--success-soft)}
.quiz-option.correct .opt-letter{background:var(--success);color:white;border-color:var(--success)}
.quiz-option.wrong{border-color:var(--danger);background:var(--danger-soft)}
.quiz-option.wrong .opt-letter{background:var(--danger);color:white;border-color:var(--danger)}
.quiz-option.disabled{cursor:default}
.quiz-option.correct.disabled,.quiz-option.wrong.disabled{opacity:1}
.quiz-option.disabled:not(.correct):not(.wrong){opacity:.5}
.quiz-explanation{margin-top:20px;padding:20px 24px;background:linear-gradient(135deg,var(--primary-soft),var(--info-soft));border:1px solid var(--primary);border-radius:var(--radius-md);font-size:14px;line-height:1.8;color:var(--text-2);display:none;position:relative}
.quiz-explanation::before{content:'💡';position:absolute;top:-14px;inset-inline-start:16px;background:var(--bg-1);padding:4px 8px;border-radius:8px;font-size:16px;border:1px solid var(--primary)}
.quiz-explanation.show{display:block;animation:fadeUp .3s ease}
.quiz-explanation strong{color:var(--primary-hover)}
.quiz-note-box{margin-top:16px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
.quiz-note-box label{display:block;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.quiz-note-box textarea{width:100%;min-height:60px;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text-1);font-family:inherit;font-size:13px;resize:vertical;outline:none;transition:border-color .2s}
.quiz-note-box textarea:focus{border-color:var(--primary)}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.quiz-nav-btn{padding:12px 24px;background:var(--bg-1);border:1px solid var(--border);border-radius:12px;color:var(--text-2);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:8px}
.quiz-nav-btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-hover);border-color:var(--primary)}
.quiz-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.quiz-nav-btn.primary{background:var(--gradient-primary);color:white;border-color:transparent;box-shadow:0 4px 16px var(--primary-glow)}
.quiz-nav-btn.primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px var(--primary-glow)}
.quiz-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;padding:16px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-md);margin-top:16px;max-height:200px;overflow-y:auto}
.quiz-dot{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text-3);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;position:relative}
.quiz-dot:hover{background:var(--surface-hover);color:var(--text-1)}
.quiz-dot.current{background:var(--gradient-primary);color:white;border-color:transparent;box-shadow:0 4px 12px var(--primary-glow)}
.quiz-dot.answered-correct{background:var(--success);color:white;border-color:transparent}
.quiz-dot.answered-wrong{background:var(--danger);color:white;border-color:transparent}
.quiz-dot.flagged::after{content:'🚩';position:absolute;top:-6px;inset-inline-end:-6px;font-size:10px}
.quiz-dot.bookmarked::before{content:'⭐';position:absolute;top:-6px;inset-inline-start:-6px;font-size:10px}

/* ============ QUIZ RESULTS (fullscreen) ============ */
.quiz-results-wrap{width:100%;max-width:720px;margin:0 auto;animation:fadeUp .5s ease}
.quiz-results{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-xl);padding:48px 40px;text-align:center;position:relative;overflow:hidden}
.quiz-results::before{content:'';position:absolute;top:-50%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,var(--primary-soft) 0%,transparent 70%);pointer-events:none}
.quiz-results>*{position:relative;z-index:1}
.results-icon{font-size:80px;margin-bottom:20px;animation:bounce 1s ease}
.results-score{font-size:72px;font-weight:900;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px;letter-spacing:-2px}
.results-label{font-size:18px;color:var(--text-2);margin-bottom:24px;font-weight:600}
.results-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:500px;margin:0 auto 28px}
.results-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px}
.results-stat-value{font-size:28px;font-weight:800;line-height:1;margin-bottom:4px}
.results-stat-value.correct{color:var(--success)}
.results-stat-value.wrong{color:var(--danger)}
.results-stat-value.total{color:var(--primary-hover)}
.results-stat-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.results-message{font-size:15px;color:var(--text-2);margin-bottom:28px;line-height:1.6;max-width:500px;margin-left:auto;margin-right:auto}
.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:confetti 3s ease-out forwards}

/* ============ STARTER CARD (in-page) ============ */
.starter-card{max-width:600px;margin:0 auto;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-xl);padding:48px 40px;text-align:center;position:relative;overflow:hidden;animation:fadeUp .4s ease}
.starter-card::before{content:'';position:absolute;top:-50%;right:-30%;width:400px;height:400px;background:radial-gradient(circle,rgba(99,102,241,0.15) 0%,transparent 70%);pointer-events:none}
.starter-card>*{position:relative;z-index:1}
.starter-icon{font-size:72px;margin-bottom:20px;filter:drop-shadow(0 8px 20px var(--primary-glow))}
.starter-title{font-size:28px;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}
.starter-subtitle{color:var(--text-3);font-size:14px;margin-bottom:28px;line-height:1.6}
.starter-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.starter-stat{padding:18px 12px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.starter-stat-value{font-size:32px;font-weight:900;line-height:1}
.starter-stat-value.available{color:var(--primary-hover)}
.starter-stat-value.studied{color:var(--success)}
.starter-stat-value.remaining{color:var(--warning)}
.starter-stat-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:6px;font-weight:700}
.starter-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.starter-actions .btn{padding:14px 28px;font-size:14px}

/* ============ Q&A ============ */
.qa-list{display:grid;gap:10px}
.qa-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;transition:all .2s}
.qa-card:hover{border-color:var(--success);box-shadow:var(--shadow-sm)}
.qa-question{padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background .15s}
.qa-question:hover{background:var(--surface-hover)}
.qa-question .q-icon{width:36px;height:36px;border-radius:10px;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;border:1px solid var(--success)}
.qa-question .q-text{flex:1;font-size:14px;font-weight:500;line-height:1.6}
.qa-question .q-toggle{color:var(--text-4);font-size:14px;transition:transform .3s;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:8px}
.qa-card.open .q-toggle{transform:rotate(180deg);color:var(--success)}
.qa-answer{max-height:0;overflow:hidden;transition:max-height .3s ease}
.qa-card.open .qa-answer{max-height:1000px}
.qa-answer-inner{padding:0 20px 20px 70px;font-size:14px;color:var(--success);font-weight:500;line-height:1.7}
.qa-answer-inner .arrow{color:var(--warning);margin-inline-end:8px;font-weight:800}
.qa-answer-inner img{max-width:100%;border-radius:var(--radius-sm);margin:10px 0;border:1px solid var(--border)}

/* ============ FLASHCARDS ============ */
.flashcard-wrapper{max-width:760px;margin:0 auto}
.flashcard-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;background:var(--bg-1);padding:14px 20px;border-radius:var(--radius-lg);border:1px solid var(--border)}
.flashcard-counter{font-size:14px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:10px}
.flashcard-counter .current-num{font-size:24px;font-weight:900;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.flashcard-counter .divider{color:var(--text-4);font-size:14px}
.flashcard-counter .total-num{font-size:16px;color:var(--text-3);font-weight:600}
.flashcard-progress-mini{flex:1;max-width:200px;height:6px;background:var(--surface);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.flashcard-progress-mini-fill{height:100%;background:var(--gradient-primary);border-radius:3px;transition:width .4s}
.flashcard-tools{display:flex;gap:6px}
.flashcard-tool-btn{padding:8px 14px;background:var(--surface);border:1px solid var(--border);color:var(--text-3);font-size:12px;font-weight:700;cursor:pointer;border-radius:10px;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:5px}
.flashcard-tool-btn:hover{background:var(--surface-hover);color:var(--text-1);border-color:var(--border-strong)}
.flashcard-tool-btn.active{background:var(--primary-soft);color:var(--primary-hover);border-color:var(--primary)}
.flashcard-container{perspective:2000px;min-height:400px;margin-bottom:20px}
.flashcard{width:100%;min-height:400px;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1);cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-xl);padding:48px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden}
.flashcard-front{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%);position:relative}
[data-theme="light"] .flashcard-front{background:linear-gradient(135deg,#eef2ff 0%,#e0e7ff 50%,#c7d2fe 100%)}
.flashcard-front::before{content:'';position:absolute;top:-50%;right:-30%;width:500px;height:500px;background:radial-gradient(circle,rgba(99,102,241,0.4) 0%,transparent 70%);pointer-events:none;animation:float 6s ease-in-out infinite}
.flashcard-back{background:linear-gradient(135deg,#064e3b 0%,#065f46 50%,#047857 100%);transform:rotateY(180deg);border-color:var(--success);position:relative}
[data-theme="light"] .flashcard-back{background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 50%,#6ee7b7 100%)}
.flashcard-back::before{content:'';position:absolute;top:-40%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(16,185,129,0.3) 0%,transparent 70%);pointer-events:none;animation:float 7s ease-in-out infinite}
.flashcard-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,0.6);margin-bottom:24px;padding:8px 18px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;border:1px solid rgba(255,255,255,0.15);position:relative;z-index:1}
.flashcard-text{font-size:22px;font-weight:600;line-height:1.7;color:white;position:relative;z-index:1;max-width:100%}
.flashcard-back .flashcard-text{color:#d1fae5;font-size:20px}
.flashcard-text img{max-width:100%;max-height:200px;border-radius:var(--radius-sm);margin:12px 0;border:2px solid rgba(255,255,255,0.2)}
.flashcard-hint{margin-top:28px;font-size:12px;color:rgba(255,255,255,0.5);font-style:italic;display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,0.05);border-radius:20px;position:relative;z-index:1;border:1px solid rgba(255,255,255,0.1)}
.flashcard-rating{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.flashcard-rating.hidden{display:none}
.rating-btn{padding:12px 22px;border-radius:14px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s;font-family:inherit;display:flex;align-items:center;gap:8px;min-width:100px;justify-content:center}
.rating-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.3)}
.rating-btn.again{background:rgba(239,68,68,0.15);border-color:var(--danger);color:var(--danger)}
.rating-btn.hard{background:rgba(245,158,11,0.15);border-color:var(--warning);color:var(--warning)}
.rating-btn.good{background:rgba(6,182,212,0.15);border-color:var(--info);color:var(--info)}
.rating-btn.easy{background:rgba(16,185,129,0.15);border-color:var(--success);color:var(--success)}
.flashcard-nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.flashcard-nav-btn{padding:12px 20px;background:var(--bg-1);border:1px solid var(--border);border-radius:12px;color:var(--text-2);font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:700;display:flex;align-items:center;gap:6px}
.flashcard-nav-btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-hover);border-color:var(--primary)}
.flashcard-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.flashcard-nav-btn.flip-btn{background:var(--gradient-primary);color:white;border:none;box-shadow:0 4px 16px var(--primary-glow)}
.flashcard-nav-btn.flip-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--primary-glow)}
.flashcard-stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.flashcard-stat-item{background:var(--bg-1);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.flashcard-stat-item .fs-value{font-size:20px;font-weight:800;line-height:1}
.flashcard-stat-item .fs-label{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:700}
.flashcard-stat-item.again .fs-value{color:var(--danger)}
.flashcard-stat-item.hard .fs-value{color:var(--warning)}
.flashcard-stat-item.good .fs-value{color:var(--info)}
.flashcard-stat-item.easy .fs-value{color:var(--success)}

/* ============ MNEMONICS ============ */
.mnemonics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.mnemonic-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden;transition:all .3s}
.mnemonic-card::before{content:'';position:absolute;top:0;inset-inline-start:0;inset-inline-end:0;height:4px;background:var(--gradient-warm)}
.mnemonic-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--warning)}
.mn-header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mn-icon-wrap{width:48px;height:48px;border-radius:14px;background:var(--warning-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:1px solid var(--warning)}
.mn-title{font-size:17px;font-weight:700;color:var(--warning);letter-spacing:-.3px}
.mn-code{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--pink);margin:10px 0 16px;font-weight:700;padding:8px 14px;background:var(--pink-soft);border-radius:10px;display:inline-block;border:1px solid rgba(236,72,153,0.2)}
.mn-items{list-style:none}
.mn-items li{font-size:13px;color:var(--text-2);padding:8px 0;display:flex;gap:10px;line-height:1.6;border-bottom:1px dashed var(--border)}
.mn-items li:last-child{border-bottom:none}
.mn-items li .letter{color:var(--success);font-weight:800;font-family:'JetBrains Mono',monospace;min-width:28px;background:var(--success-soft);padding:3px 10px;border-radius:8px;text-align:center;font-size:12px;border:1px solid var(--success)}

/* ============ VIDEOS ============ */
.videos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.video-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all .3s}
.video-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--pink)}
.video-thumbnail{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg-3);display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-thumbnail img{width:100%;height:100%;object-fit:cover}
.video-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);transition:background .3s}
.video-card:hover .video-play-overlay{background:rgba(0,0,0,0.5)}
.video-play-btn{width:64px;height:64px;border-radius:50%;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;font-size:24px;color:white;box-shadow:0 8px 30px var(--primary-glow);transition:transform .3s}
.video-card:hover .video-play-btn{transform:scale(1.1)}
.video-info{padding:16px}
.video-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.video-meta{display:flex;gap:10px;font-size:11px;color:var(--text-3);font-weight:600}
.video-meta span{display:inline-flex;align-items:center;gap:4px}

/* ============ VIDEO PLAYER ============ */
.video-player-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:3000;display:none;align-items:center;justify-content:center;flex-direction:column}
.video-player-modal.show{display:flex;animation:fadeIn .3s ease}
.video-player-modal.portrait .video-player-container{width:min(90vw,500px);height:auto;aspect-ratio:9/16;max-height:85vh}
.video-player-modal.landscape .video-player-container{width:min(95vw,1200px);height:min(85vh,675px)}
.video-player-container{position:relative;background:#000;border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.video-player-close{position:absolute;top:12px;inset-inline-end:12px;z-index:10;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.video-player-close:hover{background:rgba(239,68,68,0.8);transform:scale(1.1)}
.video-player-video{flex:1;width:100%;object-fit:contain;background:#000}
.video-player-controls{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;background:linear-gradient(transparent,rgba(0,0,0,0.9));display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity .3s}
.video-player-container:hover .video-player-controls{opacity:1}
.video-progress{width:100%;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;cursor:pointer;position:relative;overflow:hidden}
.video-progress:hover{height:8px}
.video-progress-fill{height:100%;background:var(--gradient-primary);border-radius:3px;transition:width .1s linear;position:relative}
.video-controls-row{display:flex;align-items:center;gap:12px}
.video-ctrl-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.video-ctrl-btn:hover{background:rgba(255,255,255,0.25);transform:scale(1.1)}
.video-ctrl-btn.play-pause{width:44px;height:44px;background:var(--gradient-primary);font-size:18px}
.video-time{font-size:12px;color:rgba(255,255,255,0.8);font-weight:600;font-variant-numeric:tabular-nums;min-width:100px}
.video-spacer{flex:1}
.video-speed-select{padding:6px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:white;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;outline:none}
.video-speed-select option{background:#1a1a1a;color:white}
.video-orientation-btn{padding:6px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:white;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s}
.video-orientation-btn:hover{background:rgba(255,255,255,0.25)}
.video-volume-wrap{display:flex;align-items:center;gap:6px}
.video-volume-slider{width:80px;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;cursor:pointer}
.video-volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:white;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.3)}

/* ============ IMAGES ============ */
.images-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.image-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;transition:all .3s}
.image-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--info)}
.image-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.image-card-caption{padding:12px;font-size:13px;font-weight:600;color:var(--text-2);line-height:1.4}
.image-viewer-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:3000;display:none;align-items:center;justify-content:center;padding:40px}
.image-viewer-modal.show{display:flex;animation:fadeIn .3s ease}
.image-viewer-modal img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--radius-md)}
.image-viewer-close{position:fixed;top:20px;inset-inline-end:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:all .2s}
.image-viewer-close:hover{background:rgba(239,68,68,0.8);transform:scale(1.1)}

/* ============ NOTES ============ */
.notes-list{display:grid;gap:12px}
.note-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;position:relative;overflow:hidden;transition:all .3s}
.note-card::before{content:'';position:absolute;top:0;inset-inline-start:0;width:4px;height:100%;background:var(--gradient-success)}
.note-card:hover{border-color:var(--success);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.note-title{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text-1);display:flex;align-items:center;gap:8px}
.note-title .note-icon{color:var(--success)}
.note-content{font-size:14px;color:var(--text-2);line-height:1.8;white-space:pre-wrap}
.note-content img{max-width:100%;border-radius:var(--radius-sm);margin:10px 0;border:1px solid var(--border)}
.note-meta{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-4);display:flex;gap:12px;font-weight:600}

/* ============ LINKS ============ */
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.link-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .25s;text-decoration:none;color:inherit}
.link-card:hover{border-color:var(--purple);background:var(--purple-soft);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.link-icon{width:44px;height:44px;border-radius:12px;background:var(--purple-soft);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--purple)}
.link-info{flex:1;min-width:0}
.link-title{font-size:14px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-url{font-size:11px;color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-arrow{color:var(--text-4);font-size:16px;transition:transform .2s}
.link-card:hover .link-arrow{color:var(--purple);transform:translateX(3px)}

.empty-state{text-align:center;padding:80px 20px;color:var(--text-3);background:var(--bg-1);border:1px dashed var(--border);border-radius:var(--radius-lg);animation:fadeUp .4s ease}
.empty-state .es-icon{font-size:72px;margin-bottom:20px;opacity:.5}
.empty-state h3{font-size:20px;color:var(--text-2);margin-bottom:10px;font-weight:700}
.empty-state p{font-size:14px;line-height:1.6;max-width:400px;margin:0 auto}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px;background:var(--bg-0)}
.loading-spinner{width:56px;height:56px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.loading-text{font-size:14px;color:var(--text-3);font-weight:500}

.toast-container{position:fixed;top:20px;inset-inline-end:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg-2);border:1px solid var(--border);border-inline-start:4px solid var(--primary);border-radius:14px;padding:14px 18px;min-width:280px;max-width:420px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;animation:slideIn .3s ease;font-size:13px;font-weight:500;backdrop-filter:blur(20px)}
.toast.success{border-inline-start-color:var(--success)}
.toast.error{border-inline-start-color:var(--danger)}
.toast.warning{border-inline-start-color:var(--warning)}
.toast-icon{font-size:18px;flex-shrink:0}
.toast-message{flex:1;color:var(--text-1)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.show{display:flex;animation:fadeIn .2s ease}
.modal{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-xl);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
.modal-header{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(99,102,241,0.05),transparent)}
.modal-header h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-close{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);color:var(--text-3);cursor:pointer;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--surface-hover);color:var(--text-1)}
.modal-body{padding:26px;font-size:14px;color:var(--text-2);line-height:1.7}
.modal-body h4{color:var(--text-1);margin-bottom:10px;margin-top:20px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.modal-body h4:first-child{margin-top:0}
.modal-body ul{list-style:none;padding:0;margin:10px 0}
.modal-body ul li{padding:8px 0 8px 26px;position:relative;font-size:13px;line-height:1.6}
.modal-body ul li::before{content:'✦';position:absolute;inset-inline-start:4px;color:var(--primary);font-size:12px}
.modal-footer{padding:18px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface)}
.btn{padding:11px 22px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--gradient-primary);color:white;box-shadow:0 4px 16px var(--primary-glow)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--primary-glow)}
.btn-secondary{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface-hover);color:var(--text-1)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:var(--danger);color:white}

.mobile-toggle{display:none;position:fixed;top:12px;inset-inline-start:12px;z-index:200}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:140;backdrop-filter:blur(4px)}
.sidebar-overlay.show{display:block}
@media (max-width:900px){
.sidebar{position:fixed;inset-inline-start:0;top:0;height:100vh;z-index:150;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
[dir="rtl"] .sidebar{transform:translateX(100%)}
.sidebar.open{transform:translateX(0)!important}
.mobile-toggle{display:flex}
.content{padding:20px 16px}
.topbar{padding:0 16px;padding-inline-start:60px}
.topbar-btn span:not(.spinner){display:none}
.topbar-btn{padding:9px 12px}
.category-grid,.children-grid{grid-template-columns:1fr}
.dashboard-hero{padding:32px 24px}
.dashboard-hero h1{font-size:28px}
.dashboard-hero .hero-desc{font-size:14px}
.hero-stats{grid-template-columns:repeat(2,1fr)}
.topic-hero{padding:24px 20px}
.topic-info h1{font-size:22px}
.topic-icon-wrap{width:56px;height:56px;font-size:28px}
.mnemonics-grid{grid-template-columns:1fr}
.quiz-card{padding:24px 20px}
.quiz-question{font-size:16px}
.flashcard-face{padding:32px 24px}
.flashcard-text{font-size:18px}
.flashcard-back .flashcard-text{font-size:16px}
.flashcard-container{min-height:340px}
.flashcard{min-height:340px}
.results-score{font-size:56px}
.results-stats{grid-template-columns:repeat(3,1fr);gap:8px}
.results-stat{padding:12px 8px}
.results-stat-value{font-size:22px}
.section-header h2{font-size:18px}
.cc-stats{grid-template-columns:repeat(4,1fr);gap:6px}
.cc-stat-value{font-size:15px}
.cc-stat-label{font-size:8px}
.category-card{padding:22px}
.cc-title h3{font-size:17px}
.videos-grid{grid-template-columns:1fr}
.images-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.links-grid{grid-template-columns:1fr}
.flashcard-stats-bar{grid-template-columns:repeat(2,1fr)}

// ==================== ENCRYPTION ====================
const _k1='M';const _k2='d';const _k3='x';const _k4='2';const _k5='0';const _k6='2';const _k7='6';const _k8='S';const _k9='e';const _k10='c';const _k11='r';const _k12='t';
function _gk(){return _k1+'e'+_k10+_k11+_k3+_k4+_k5+_k6+_k7+_k8+_k9+_k12+_k2+_k6}
const SALT_HEX='6d65646578697473616c7432303236';
async function deriveKey(passphrase){
const enc=new TextEncoder();
const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);
const salt=new Uint8Array(SALT_HEX.match(/.{1,2}/g).map(b=>parseInt(b,16)));
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptData(encrypted){
try{
const key=await deriveKey(_gk());
const iv=Uint8Array.from(atob(encrypted.iv),c=>c.charCodeAt(0));
const data=Uint8Array.from(atob(encrypted.data),c=>c.charCodeAt(0));
const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
return JSON.parse(new TextDecoder().decode(decrypted));
}catch(e){console.error('Decrypt error:',e);throw new Error(t('decryptError'))}
}
function isEncryptedFormat(obj){return obj&&typeof obj==='object'&&obj.v&&obj.iv&&obj.data}

}catch(e){}
if(!rawText){

rawText=await response.text();
try{const cache=await caches.open('medexit-data-v1');await cache.put('./mcqs_q_a_flashcards_andetc.json',new Response(rawText))}catch(e){}
}
let parsed=JSON.parse(rawText);
if(isEncryptedFormat(parsed)){
document.getElementById('loadingText').textContent=t('loadingDecrypt');

}
state.data=normalizeData(parsed);
loadProgress();

renderAll();
}catch(err){

function normalizeData(data){
if(!data)return{categories:[]};
if(Array.isArray(data))return{categories:data.map(normalizeItem)};
if(data.categories)return{categories:data.categories.map(normalizeItem)};
return{categories:[]};
}
function normalizeItem(item){
if(!item)return null;
const result={
id:item.id||('id_'+Math.random().toString(36).slice(2,8)),
name:item.name||'',icon:item.icon||'📚',description:item.description||'',
content:item.content||null,children:[]
};
const childSources=[item.children,item.subjects,item.topics,item.subtopics,item.categories];
childSources.forEach(source=>{
if(Array.isArray(source)){source.forEach(child=>{const normalized=normalizeItem(child);if(normalized)result.children.push(normalized)})}
});
return result;
}

// ==================== DATA HELPERS ====================
function countContent(item){
if(!item)return{mcqs:0,qa:0,flash:0,mnem:0,videos:0,images:0,notes:0,links:0,total:0};
const c=item.content||{};
const direct={
mcqs:(c.mcqs||[]).length,qa:(c.qa||[]).length,flash:(c.flashcards||[]).length,mnem:(c.mnemonics||[]).length,
videos:(c.videos||[]).length,images:(c.images||[]).length,notes:(c.notes||[]).length,links:(c.links||[]).length
};
let childCount={mcqs:0,qa:0,flash:0,mnem:0,videos:0,images:0,notes:0,links:0};
(item.children||[]).forEach(child=>{const cc=countContent(child);Object.keys(childCount).forEach(k=>childCount[k]+=cc[k]||0)});
const total={};
Object.keys(direct).forEach(k=>total[k]=direct[k]+childCount[k]);
total.total=total.mcqs+total.qa+total.flash+total.mnem+total.videos+total.images+total.notes+total.links;
return total;
}
function getItemType(item){
if(!item)return'empty';
const hasChildren=(item.children||[]).length>0;
const c=item.content||{};
const hasContent=(c.mcqs||[]).length>0||(c.qa||[]).length>0||(c.flashcards||[]).length>0||(c.mnemonics||[]).length>0||(c.videos||[]).length>0||(c.images||[]).length>0||(c.notes||[]).length>0||(c.links||[]).length>0;
if(hasChildren)return'container';
if(hasContent)return'leaf';
return'empty';
}

function openQuizStarter(topicKey,total){
state.quizStarter={topicKey,total,count:20,mode:'random'};
const overlay=document.getElementById('quizStarterOverlay');
const studied=state.mcqStudied[topicKey]||[];
const remaining=total-studied.length;
document.getElementById('qsTitle').textContent=t('startQuiz');
document.getElementById('qsSubtitle').textContent=t('configureSession');
document.getElementById('qsTotalAvailable').textContent=total;
document.getElementById('qsAlreadyStudied').textContent=studied.length;
document.getElementById('qsRemainingCount').textContent=remaining;
document.getElementById('qsAvailableLabel').textContent=t('available');
document.getElementById('qsStudiedLabel').textContent=t('studied');
document.getElementById('qsRemainingLabel').textContent=t('newQ');
document.getElementById('qsHowManyLabel').textContent=t('howMany');
document.getElementById('qsModeLabel').textContent=t('quizMode');
document.getElementById('qsModeRandom').textContent=t('modeRandom');
document.getElementById('qsModeSequential').textContent=t('modeSequential');
document.getElementById('qsModeWrong').textContent=t('modeWrong');
document.getElementById('qsCancelBtn').textContent=t('cancel');
document.getElementById('qsStartBtn').innerHTML='🚀 '+t('start');
document.querySelectorAll('.qs-count-btn').forEach(b=>b.classList.toggle('active',b.dataset.count==='20'));
document.querySelectorAll('.qs-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode==='random'));
document.getElementById('qsCustomInput').classList.remove('show');
overlay.classList.add('show');
}
function closeQuizStarter(){document.getElementById('quizStarterOverlay').classList.remove('show')}
function selectQuizCount(count){
state.quizStarter.count=count;
document.querySelectorAll('.qs-count-btn').forEach(b=>{
const val=b.dataset.count==='all'?'all':parseInt(b.dataset.count);
b.classList.toggle('active',val===count);
});
const custom=document.getElementById('qsCustomInput');
if(typeof count==='number'&&![10,20,50].includes(count)){
custom.classList.add('show');
custom.value=count;
custom.focus();
}else{
custom.classList.remove('show');
}
}
function selectQuizMode(mode){
state.quizStarter.mode=mode;
document.querySelectorAll('.qs-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
}
function startQuizFromStarter(){
const{topicKey,total,count,mode}=state.quizStarter;
const item=findItemById(state.data?.categories||[],topicKey);
if(!item)return;
const mcqs=item.content?.mcqs||[];
const studied=state.mcqStudied[topicKey]||[];
let available=[];
if(mode==='wrong'){
const wrongList=state.mcqWrongList[topicKey]||[];
available=wrongList.length>0?wrongList:[...Array(mcqs.length).keys()];
}else{
const unstudied=[...Array(mcqs.length).keys()].filter(i=>!studied.includes(i));
if(unstudied.length===0){
state.mcqStudied[topicKey]=[];
available=[...Array(mcqs.length).keys()];
toast(t('allStudied')+' '+t('resetProgress'),'warning');
}else{
available=unstudied;
}
}
let sessionSize;
if(count==='all')sessionSize=available.length;
else if(typeof count==='number'&&count>0)sessionSize=Math.min(count,available.length);
else sessionSize=available.length;
if(sessionSize===0){
toast(t('noContent'),'warning');
closeQuizStarter();
return;
}
if(mode==='random'||mode==='wrong'){
for(let i=available.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[available[i],available[j]]=[available[j],available[i]]}
}
const sessionIndices=available.slice(0,sessionSize);
state.mcqSessionIndices[topicKey]=sessionIndices;
state.mcqSessionSize[topicKey]=sessionSize;
state.mcqAnswers[topicKey]={};
state.mcqCurrentIndex[topicKey]=0;
state.mcqShowResults[topicKey]=false;
state.mcqElapsed[topicKey]=0;
state.mcqStreak[topicKey]=0;
state.mcqMode[topicKey]=mode;
if(!state.mcqFlags[topicKey])state.mcqFlags[topicKey]={};
if(!state.mcqBookmarks[topicKey])state.mcqBookmarks[topicKey]={};
if(!state.mcqNotes[topicKey])state.mcqNotes[topicKey]={};
if(!state.mcqWrongList[topicKey])state.mcqWrongList[topicKey]=[];
// Mark session as ACTIVE - this triggers fullscreen mode
state.mcqSessionActive[topicKey]=true;
closeQuizStarter();
renderAll();
}
function resetTopicProgress(topicKey){
state.mcqStudied[topicKey]=[];
state.mcqWrongList[topicKey]=[];
state.mcqAnswers[topicKey]={};
state.mcqSessionIndices[topicKey]=null;
state.mcqSessionActive[topicKey]=false;
saveProgress();
renderAll();
toast(t('progressSaved'),'success');
}

const topicKey=getActiveQuizTopicKey();
if(!topicKey){return}
const item=findItemById(state.data?.categories||[],topicKey);
if(!item){
state.mcqSessionActive[topicKey]=false;
renderAll();
return;
}
const mcqs=item.content?.mcqs||[];
const content=document.getElementById('content');
if(state.mcqShowResults[topicKey]){
content.innerHTML=renderFullscreenResults(mcqs,topicKey,item);
}else{
content.innerHTML=renderFullscreenQuizPage(mcqs,topicKey,item);
startMCQTimer(topicKey);
}
}
function renderFullscreenQuizPage(mcqs,topicKey,item){
if(!state.mcqAnswers[topicKey])state.mcqAnswers[topicKey]={};
if(state.mcqCurrentIndex[topicKey]===undefined)state.mcqCurrentIndex[topicKey]=0;
if(!state.mcqFlags[topicKey])state.mcqFlags[topicKey]={};
if(!state.mcqBookmarks[topicKey])state.mcqBookmarks[topicKey]={};
if(!state.mcqNotes[topicKey])state.mcqNotes[topicKey]={};
if(!state.mcqMode[topicKey])state.mcqMode[topicKey]='random';
if(!state.mcqStreak[topicKey])state.mcqStreak[topicKey]=0;
if(!state.mcqElapsed[topicKey])state.mcqElapsed[topicKey]=0;
if(!state.mcqWrongList[topicKey])state.mcqWrongList[topicKey]=[];

const mode=state.mcqMode[topicKey];
const sessionIndices=state.mcqSessionIndices[topicKey]||[];
const mcqList=sessionIndices.map(i=>({mcq:mcqs[i],origIdx:i}));
const totalQ=mcqList.length;
let activeIdx=state.mcqCurrentIndex[topicKey];
if(activeIdx>=totalQ)activeIdx=totalQ-1;
if(activeIdx<0)activeIdx=0;
state.mcqCurrentIndex[topicKey]=activeIdx;
const entry=mcqList[activeIdx];
const mcq=entry.mcq;
const origIdx=entry.origIdx;
const letters=['A','B','C','D','E','F'];

const answers=state.mcqAnswers[topicKey];
const answered=Object.keys(answers).length;
const correct=Object.entries(answers).filter(([qIdx,optIdx])=>mcqs[qIdx].answer===optIdx).length;
const wrong=answered-correct;
const progress=totalQ>0?(answered/totalQ)*100:0;
const streak=state.mcqStreak[topicKey];

const wasAnswered=answers[origIdx]!==undefined;
const selected=answers[origIdx];
const correctIdx=mcq.answer;
const question=mcq.q||mcq.question||'';
const options=mcq.options||[];
const explanation=mcq.explanation||mcq.explain||'';
const questionImage=mcq.image||mcq.img||'';
const isCorrect=wasAnswered&&selected===correctIdx;
const isFlagged=state.mcqFlags[topicKey][origIdx];
const isBookmarked=state.mcqBookmarks[topicKey][origIdx];
const userNote=state.mcqNotes[topicKey][origIdx]||'';

let cardClass='quiz-card';
if(wasAnswered)cardClass+=isCorrect?' answered-correct':' answered-wrong';

let html=`<div class="quiz-fullscreen-page">
<div class="quiz-fs-header">
<button class="quiz-fs-exit" onclick="confirmExitQuiz('${topicKey}')" title="${t('exitQuiz')}">✕</button>
<div class="quiz-fs-title">

<p>${t('quizInProgress')} • ${t('mode'+mode.charAt(0).toUpperCase()+mode.slice(1))||mode}</p>
</div>
<div class="quiz-fs-timer"><span class="timer-icon">⏱️</span><span id="quizTimerDisplay">${formatTime(state.mcqElapsed[topicKey])}</span></div>
${streak>=2?`<div class="quiz-fs-streak ${streak>=5?'on-fire':''}">🔥 ${streak} ${t('streak')}</div>`:''}
</div>
<div class="quiz-fs-progress">
<div class="quiz-fs-progress-bar-wrap">
<div class="quiz-fs-progress-label"><span>${t('progress')}</span><span>${answered} / ${totalQ}</span></div>
<div class="quiz-fs-progress-bar"><div class="quiz-fs-progress-fill" style="width:${progress}%"></div></div>
</div>
<div class="quiz-fs-stats">
<div class="quiz-fs-stat correct">✓ ${correct}</div>
<div class="quiz-fs-stat wrong">✗ ${wrong}</div>
<div class="quiz-fs-stat remaining">${totalQ-answered} ${t('remaining')}</div>
</div>
</div>
<div class="quiz-fs-body">
<div class="quiz-fs-card-wrap">
<div class="${cardClass}">
<div class="quiz-card-header">
<div class="quiz-number">${t('question')} ${activeIdx+1}</div>
<div class="quiz-actions-top">
<button class="quiz-action-btn ${isBookmarked?'bookmarked':''}" onclick="toggleBookmark('${topicKey}',${origIdx})" title="${t('bookmark')}">${isBookmarked?'⭐':'☆'}</button>
<button class="quiz-action-btn ${isFlagged?'flagged':''}" onclick="toggleFlag('${topicKey}',${origIdx})" title="${t('flag')}">${isFlagged?'🚩':'⚑'}</button>
</div>
<div class="quiz-status">${isCorrect?'✓ '+t('correct'):'✗ '+t('wrong')}</div>
</div>
<div class="quiz-question ${dirClass(question)}">${escapeHtml(question)}</div>
${questionImage?`<div class="quiz-question-image"><img src="${escapeHtml(questionImage)}" alt="Question image" onclick="openImageViewer('${escapeHtml(questionImage)}')"></div>`:''}
<div class="quiz-options">`;
options.forEach((opt,oIdx)=>{
let classes='quiz-option';
if(wasAnswered){classes+=' disabled';if(oIdx===correctIdx)classes+=' correct';else if(oIdx===selected)classes+=' wrong'}
html+=`<div class="${classes}" onclick="${wasAnswered?'':`answerMCQ('${topicKey}',${origIdx},${oIdx})`}">
<div class="opt-letter">${letters[oIdx]}</div>
<div class="opt-text ${dirClass(opt)}">${escapeHtml(opt)}</div>
</div>`;
});
html+=`</div>`;
if(explanation){
html+=`<div class="quiz-explanation ${wasAnswered?'show':''} ${dirClass(explanation)}"><strong>${t('explanation')}:</strong> ${escapeHtml(explanation)}</div>`;
}
html+=`<div class="quiz-note-box"><label>📝 ${t('addNote')}</label><textarea placeholder="Write your note here..." oninput="saveMCQNote('${topicKey}',${origIdx},this.value)">${escapeHtml(userNote)}</textarea></div>`;
html+=`</div>`;
html+=`<div class="quiz-nav">
<button class="quiz-nav-btn" onclick="prevMCQ('${topicKey}')" ${activeIdx===0?'disabled':''}>← ${t('previous')}</button>
${answered===totalQ?`<button class="quiz-nav-btn primary" onclick="finishQuiz('${topicKey}')">${t('finish')} 🏁</button>`:activeIdx<totalQ-1?`<button class="quiz-nav-btn primary" onclick="nextMCQ('${topicKey}')">${t('next')} →</button>`:`<button class="quiz-nav-btn primary" onclick="finishQuiz('${topicKey}')">${t('finish')} 🏁</button>`}
</div>`;
html+=`<div class="quiz-dots">`;
mcqList.forEach((e,idx)=>{
let dotClass='quiz-dot';
if(idx===activeIdx)dotClass+=' current';
else if(answers[e.origIdx]!==undefined){dotClass+=answers[e.origIdx]===mcqs[e.origIdx].answer?' answered-correct':' answered-wrong'}
if(state.mcqFlags[topicKey][e.origIdx])dotClass+=' flagged';
if(state.mcqBookmarks[topicKey][e.origIdx])dotClass+=' bookmarked';
html+=`<button class="${dotClass}" onclick="goToMCQ('${topicKey}',${idx})">${idx+1}</button>`;
});
html+=`</div>`;
html+=`</div></div></div>`;
return html;
}
function renderFullscreenResults(mcqs,topicKey,item){
const answers=state.mcqAnswers[topicKey]||{};
const sessionIndices=state.mcqSessionIndices[topicKey]||[];
const total=sessionIndices.length;
let correct=0;
sessionIndices.forEach(idx=>{if(answers[idx]!==undefined&&mcqs[idx].answer===answers[idx])correct++});
const wrong=total-correct;
const percent=total>0?Math.round((correct/total)*100):0;
const timeSpent=formatTime(state.mcqElapsed[topicKey]||0);
const flagged=Object.keys(state.mcqFlags[topicKey]||{}).filter(k=>state.mcqFlags[topicKey][k]).length;
let icon,message;
if(percent>=90){icon='🏆';message=t('excellent')}
else if(percent>=70){icon='🌟';message=t('great')}
else if(percent>=50){icon='📚';message=t('good')}
else{icon='💪';message=t('keepGoing')}
return`<div class="quiz-fullscreen-page">
<div class="quiz-fs-header">
<button class="quiz-fs-exit" onclick="exitQuiz('${topicKey}')" title="${t('backToTopic')}">✕</button>

<h2>${item.icon||'📚'} ${escapeHtml(item.name)}</h2>

<div class="quiz-fs-body" style="justify-content:center">

<div class="results-stat"><div class="results-stat-value total">${total}</div><div class="results-stat-label">${t('question')}</div></div>
</div>
${flagged?`<div style="display:inline-block;padding:10px 16px;background:var(--warning-soft);border:1px solid var(--warning);border-radius:10px;font-size:13px;font-weight:600;color:var(--warning);margin-bottom:20px">🚩 ${flagged} flagged</div>`:''}
<div class="results-message">${message}</div>
<div class="results-actions">
