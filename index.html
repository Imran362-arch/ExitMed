<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MedExit — Medical Exit Exam Prep</title>

<meta name="theme-color" content="#0a1628">
<meta name="description" content="Medical Exit Exam Preparation - MCQs, Flashcards, Q&A, Mnemonics">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedExit">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="icon" type="image/png" href="./icon-512.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-naskh-arabic@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/index.css">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #060d1a;
  --bg-secondary: #0b1528;
  --bg-tertiary: #111d33;
  --bg-card: #152542;
  --bg-card-hover: #1a2d4f;
  --bg-elevated: #1f365c;
  --text-primary: #f1f5f9;
  --text-secondary: #a8c5d1;
  --text-muted: #6b8a99;
  --text-dim: #4a6775;
  --accent: #06b6d4;
  --accent-hover: #22d3ee;
  --accent-dim: rgba(6, 182, 212, 0.12);
  --accent-glow: rgba(6, 182, 212, 0.35);
  --success: #10b981;
  --success-dim: rgba(16, 185, 129, 0.15);
  --warning: #f59e0b;
  --warning-dim: rgba(245, 158, 11, 0.15);
  --danger: #ef4444;
  --danger-dim: rgba(239, 68, 68, 0.15);
  --purple: #a855f7;
  --purple-dim: rgba(168, 85, 247, 0.15);
  --pink: #ec4899;
  --pink-dim: rgba(236, 72, 153, 0.15);
  --border: #1e3a47;
  --border-hover: #2a5163;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 40px rgba(6, 182, 212, 0.15);
  --font-main: 'Inter', -apple-system, sans-serif;
  --font-arabic: 'Noto Naskh Arabic', 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --gradient-primary: linear-gradient(135deg, #06b6d4 0%, #10b981 100%);
  --gradient-accent: linear-gradient(135deg, #06b6d4 0%, #a855f7 100%);
  --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
  --gradient-cool: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
}

[data-theme="light"] {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f5f9;
  --bg-card: #ffffff;
  --bg-card-hover: #f8fafc;
  --bg-elevated: #e2e8f0;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-dim: #94a3b8;
  --accent: #0891b2;
  --accent-hover: #0e7490;
  --accent-dim: rgba(8, 145, 178, 0.08);
  --accent-glow: rgba(8, 145, 178, 0.15);
  --success: #059669;
  --success-dim: rgba(5, 150, 105, 0.08);
  --warning: #d97706;
  --warning-dim: rgba(217, 119, 6, 0.08);
  --danger: #dc2626;
  --danger-dim: rgba(220, 38, 38, 0.08);
  --purple: #9333ea;
  --purple-dim: rgba(147, 51, 234, 0.08);
  --pink: #db2777;
  --pink-dim: rgba(219, 39, 119, 0.08);
  --border: #e2e8f0;
  --border-hover: #cbd5e1;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
  --shadow-glow: 0 0 40px rgba(8, 145, 178, 0.08);
}

body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(6,182,212,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(168,85,247,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.rtl-content {
  font-family: var(--font-arabic) !important;
  direction: rtl !important;
  text-align: right !important;
  line-height: 1.9 !important;
}

.ltr-content {
  direction: ltr !important;
  text-align: left !important;
}

.app {
  display: flex;
  height: 100vh;
  position: relative;
  z-index: 1;
}

/* ============ SIDEBAR ============ */
.sidebar {
  width: 300px;
  background: var(--bg-secondary);
  border-inline-end: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s ease;
}

.sidebar-header {
  padding: 20px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, rgba(6,182,212,0.05), rgba(16,185,129,0.03));
}

.logo {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--gradient-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px var(--accent-glow);
}

.logo-text h1 {
  font-size: 17px;
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}

.logo-text p {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  margin-top: 1px;
}

/* Controls */
.controls-bar {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
}

.lang-selector {
  flex: 1;
  display: flex;
  background: var(--bg-tertiary);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}

.lang-btn {
  flex: 1;
  padding: 7px 4px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 7px;
  transition: all 0.2s;
  font-family: inherit;
}

.lang-btn.active {
  background: var(--gradient-primary);
  color: white;
  box-shadow: var(--shadow-sm);
}

.lang-btn:hover:not(.active) {
  color: var(--text-primary);
  background: var(--bg-card-hover);
}

.theme-toggle {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}

.theme-toggle:hover {
  background: var(--bg-card-hover);
  color: var(--accent-hover);
  border-color: var(--accent);
}

/* Breadcrumb */
.breadcrumb-nav {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  overflow-x: auto;
  white-space: nowrap;
  background: var(--bg-tertiary);
}

.breadcrumb-nav::-webkit-scrollbar { display: none; }

.breadcrumb-item {
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.15s;
  font-weight: 500;
}

.breadcrumb-item:hover {
  color: var(--text-primary);
  background: var(--bg-card-hover);
}

.breadcrumb-item.current {
  color: var(--accent-hover);
  font-weight: 600;
}

.breadcrumb-sep {
  color: var(--text-dim);
  font-size: 10px;
}

/* Nav list */
.nav-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.nav-list::-webkit-scrollbar { width: 5px; }
.nav-list::-webkit-scrollbar-track { background: transparent; }
.nav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.nav-section-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  padding: 12px 12px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-section-title::before {
  content: '';
  width: 12px;
  height: 1px;
  background: var(--text-dim);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all 0.15s;
  margin-bottom: 2px;
  position: relative;
}

.nav-item:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--accent-dim);
  color: var(--accent-hover);
  font-weight: 600;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 60%;
  background: var(--gradient-primary);
  border-radius: 0 3px 3px 0;
}

.nav-item .ni-icon {
  font-size: 18px;
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-tertiary);
  border-radius: 7px;
}

.nav-item.active .ni-icon {
  background: var(--gradient-primary);
  box-shadow: 0 2px 8px var(--accent-glow);
}

.nav-item .ni-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-item .ni-count {
  font-size: 10px;
  background: var(--bg-tertiary);
  color: var(--text-muted);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
}

.nav-item.active .ni-count {
  background: var(--gradient-primary);
  color: white;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  background: var(--bg-tertiary);
}

/* ============ MAIN ============ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.topbar {
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--bg-secondary);
  backdrop-filter: blur(10px);
}

.back-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: 10px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  flex-shrink: 0;
}

.back-btn:hover {
  background: var(--accent-dim);
  color: var(--accent-hover);
  border-color: var(--accent);
  transform: translateX(-2px);
}

[dir="rtl"] .back-btn:hover {
  transform: translateX(2px);
}

.back-btn.visible { display: flex; }

.toggle-sidebar-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: 10px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.toggle-sidebar-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}

.topbar-title {
  flex: 1;
  min-width: 0;
}

.topbar-title h2 {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.3px;
}

.topbar-title p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.topbar-btn {
  padding: 8px 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}

.topbar-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  border-color: var(--border-hover);
}

.topbar-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.topbar-btn .spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
  scroll-behavior: smooth;
}

.content::-webkit-scrollbar { width: 8px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ============ DASHBOARD ============ */
.dashboard {
  max-width: 1200px;
  margin: 0 auto;
}

.dashboard-hero {
  position: relative;
  padding: 48px 40px;
  margin-bottom: 32px;
  border-radius: var(--radius-xl);
  background: linear-gradient(135deg, rgba(6,182,212,0.12) 0%, rgba(168,85,247,0.08) 50%, rgba(16,185,129,0.08) 100%);
  border: 1px solid var(--border);
  overflow: hidden;
}

.dashboard-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, transparent 70%);
  pointer-events: none;
}

.dashboard-hero::after {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -10%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 70%);
  pointer-events: none;
}

.dashboard-hero > * {
  position: relative;
  z-index: 1;
}

.dashboard-hero .hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--gradient-primary);
  color: white;
  font-size: 11px;
  font-weight: 700;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.dashboard-hero h1 {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 12px;
  letter-spacing: -0.8px;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-hover) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.dashboard-hero p {
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.6;
  max-width: 600px;
  margin-bottom: 24px;
}

.hero-stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.hero-stat {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 140px;
}

[data-theme="light"] .hero-stat {
  background: rgba(255,255,255,0.7);
}

.hero-stat .hs-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.hero-stat .hs-icon.cyan { background: var(--accent-dim); }
.hero-stat .hs-icon.green { background: var(--success-dim); }
.hero-stat .hs-icon.purple { background: var(--purple-dim); }
.hero-stat .hs-icon.orange { background: var(--warning-dim); }

.hero-stat .hs-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1;
}

.hero-stat .hs-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 3px;
}

/* Section header */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  margin-top: 12px;
}

.section-header h2 {
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.3px;
}

.section-header h2::before {
  content: '';
  width: 4px;
  height: 22px;
  background: var(--gradient-primary);
  border-radius: 2px;
}

.section-header .section-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Category cards */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 18px;
  margin-bottom: 40px;
}

.category-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}

.category-card::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  width: 100%;
  height: 4px;
  background: var(--gradient-primary);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
}

[dir="rtl"] .category-card::before {
  transform-origin: right;
}

.category-card:hover::before {
  transform: scaleX(1);
}

.category-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}

.category-card .cc-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.category-card .cc-icon-wrap {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
  position: relative;
}

.category-card .cc-icon-wrap.cyan { background: var(--accent-dim); }
.category-card .cc-icon-wrap.pink { background: var(--pink-dim); }
.category-card .cc-icon-wrap.purple { background: var(--purple-dim); }

.category-card .cc-title {
  flex: 1;
  min-width: 0;
}

.category-card h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 3px;
  letter-spacing: -0.3px;
}

.category-card .cc-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}

.category-card .cc-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.cc-stat {
  text-align: center;
  padding: 8px 4px;
  background: var(--bg-tertiary);
  border-radius: 8px;
}

.cc-stat .cc-stat-value {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1;
}

.cc-stat .cc-stat-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
  font-weight: 600;
}

.cc-stat.mcq .cc-stat-value { color: var(--accent-hover); }
.cc-stat.qa .cc-stat-value { color: var(--success); }
.cc-stat.flash .cc-stat-value { color: var(--purple); }
.cc-stat.mnem .cc-stat-value { color: var(--warning); }

.category-card .cc-arrow {
  position: absolute;
  bottom: 24px;
  inset-inline-end: 24px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 14px;
  transition: all 0.3s;
}

.category-card:hover .cc-arrow {
  background: var(--gradient-primary);
  color: white;
  transform: translateX(4px);
}

[dir="rtl"] .category-card:hover .cc-arrow {
  transform: translateX(-4px);
}

/* ============ SUBJECTS VIEW ============ */
.subjects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.subject-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}

.subject-card::after {
  content: '';
  position: absolute;
  inset-inline-end: -20px;
  top: -20px;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}

.subject-card:hover::after { opacity: 1; }

.subject-card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.subject-card .sc-icon-wrap {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--accent-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 14px;
}

.subject-card h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -0.2px;
}

.subject-card .sc-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.subject-card .sc-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ============ TOPICS VIEW ============ */
.topics-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

.topic-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
}

.topic-card:hover {
  border-color: var(--accent);
  background: var(--bg-card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.topic-card .tc-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--gradient-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.topic-card .tc-content { flex: 1; min-width: 0; }

.topic-card .tc-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: -0.2px;
}

.topic-card .tc-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tc-badge {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 3px;
}

.tc-badge.mcq { background: var(--accent-dim); color: var(--accent-hover); }
.tc-badge.qa { background: var(--success-dim); color: var(--success); }
.tc-badge.flash { background: var(--purple-dim); color: var(--purple); }
.tc-badge.mnem { background: var(--warning-dim); color: var(--warning); }

.topic-card .tc-arrow {
  color: var(--text-dim);
  font-size: 16px;
  transition: all 0.2s;
}

.topic-card:hover .tc-arrow {
  color: var(--accent-hover);
  transform: translateX(3px);
}

[dir="rtl"] .topic-card:hover .tc-arrow {
  transform: translateX(-3px);
}

/* ============ TOPIC CONTENT VIEWER ============ */
.content-viewer {
  max-width: 1100px;
  margin: 0 auto;
}

.content-hero {
  position: relative;
  padding: 36px 32px;
  margin-bottom: 24px;
  border-radius: var(--radius-xl);
  background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(168,85,247,0.06));
  border: 1px solid var(--border);
  overflow: hidden;
}

.content-hero::before {
  content: '';
  position: absolute;
  top: -30%;
  right: -10%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
  pointer-events: none;
}

.content-hero > * { position: relative; z-index: 1; }

.content-hero .ch-top {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.content-hero .ch-icon-wrap {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: var(--gradient-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  flex-shrink: 0;
  box-shadow: 0 6px 20px var(--accent-glow);
}

.content-hero .ch-info { flex: 1; min-width: 0; }

.content-hero h1 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
  line-height: 1.3;
}

.content-hero .ch-path {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.content-hero .ch-path span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.content-hero .ch-description {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.7;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.ch-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.ch-badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid;
}

.ch-badge.mcq { color: var(--accent-hover); border-color: var(--accent); background: var(--accent-dim); }
.ch-badge.qa { color: var(--success); border-color: var(--success); background: var(--success-dim); }
.ch-badge.flash { color: var(--purple); border-color: var(--purple); background: var(--purple-dim); }
.ch-badge.mnem { color: var(--warning); border-color: var(--warning); background: var(--warning-dim); }

/* Tabs */
.content-tabs {
  display: flex;
  gap: 4px;
  padding: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 24px;
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
}

.content-tabs::-webkit-scrollbar { display: none; }

.content-tab {
  padding: 11px 18px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.content-tab:hover:not(:disabled) {
  color: var(--text-primary);
  background: var(--bg-tertiary);
}

.content-tab.active {
  background: var(--gradient-primary);
  color: white;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.content-tab:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.content-tab .tab-count {
  background: rgba(255,255,255,0.2);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
}

.content-tab:not(.active) .tab-count {
  background: var(--bg-tertiary);
  color: var(--text-muted);
}

.content-panel { display: none; }
.content-panel.active { display: block; animation: fadeIn 0.4s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ MCQ ============ */
.mcq-progress {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.mcq-progress-info {
  flex: 1;
}

.mcq-progress-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 600;
}

.mcq-progress-bar {
  height: 8px;
  background: var(--bg-tertiary);
  border-radius: 4px;
  overflow: hidden;
}

.mcq-progress-fill {
  height: 100%;
  background: var(--gradient-primary);
  border-radius: 4px;
  transition: width 0.4s ease;
  box-shadow: 0 0 10px var(--accent-glow);
}

.mcq-progress-stats {
  display: flex;
  gap: 14px;
  font-size: 12px;
  font-weight: 700;
}

.mcq-progress-stats .stat {
  display: flex;
  align-items: center;
  gap: 4px;
}

.mcq-progress-stats .stat.correct { color: var(--success); }
.mcq-progress-stats .stat.wrong { color: var(--danger); }
.mcq-progress-stats .stat.remaining { color: var(--text-muted); }

.mcq-list { display: grid; gap: 18px; }

.mcq-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 26px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.mcq-card::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  width: 4px;
  height: 100%;
  background: var(--gradient-primary);
  opacity: 0;
  transition: opacity 0.3s;
}

.mcq-card:hover::before { opacity: 1; }

.mcq-card.answered-correct::before {
  background: var(--success);
  opacity: 1;
}

.mcq-card.answered-wrong::before {
  background: var(--danger);
  opacity: 1;
}

.mcq-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.mcq-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 10px;
  background: var(--gradient-primary);
  color: white;
  font-size: 12px;
  font-weight: 800;
  border-radius: 10px;
  letter-spacing: 0.3px;
  box-shadow: 0 2px 8px var(--accent-glow);
}

.mcq-status {
  margin-inline-start: auto;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  display: none;
  align-items: center;
  gap: 4px;
}

.mcq-card.answered-correct .mcq-status {
  display: flex;
  background: var(--success-dim);
  color: var(--success);
}

.mcq-card.answered-wrong .mcq-status {
  display: flex;
  background: var(--danger-dim);
  color: var(--danger);
}

.mcq-question {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.7;
  margin-bottom: 20px;
  letter-spacing: -0.2px;
}

.mcq-options { display: grid; gap: 10px; }

.mcq-option {
  padding: 14px 16px;
  background: var(--bg-tertiary);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  line-height: 1.6;
  position: relative;
}

.mcq-option:hover:not(.disabled) {
  border-color: var(--accent);
  background: var(--accent-dim);
  transform: translateX(4px);
}

[dir="rtl"] .mcq-option:hover:not(.disabled) {
  transform: translateX(-4px);
}

.mcq-option .opt-letter {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 12px;
  flex-shrink: 0;
  transition: all 0.2s;
  border: 1px solid var(--border);
}

.mcq-option .opt-text { flex: 1; padding-top: 2px; }

.mcq-option.correct {
  border-color: var(--success);
  background: var(--success-dim);
}

.mcq-option.correct .opt-letter {
  background: var(--success);
  color: white;
  border-color: var(--success);
}

.mcq-option.wrong {
  border-color: var(--danger);
  background: var(--danger-dim);
}

.mcq-option.wrong .opt-letter {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.mcq-option.disabled { cursor: default; }
.mcq-option.correct.disabled,
.mcq-option.wrong.disabled { opacity: 1; }
.mcq-option.disabled:not(.correct):not(.wrong) { opacity: 0.5; }

.mcq-explanation {
  margin-top: 16px;
  padding: 14px 18px;
  background: linear-gradient(135deg, var(--accent-dim), rgba(16,185,129,0.05));
  border: 1px solid var(--accent);
  border-radius: var(--radius-md);
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-secondary);
  display: none;
  position: relative;
}

.mcq-explanation::before {
  content: '💡';
  position: absolute;
  top: -12px;
  inset-inline-start: 14px;
  background: var(--bg-card);
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 14px;
  border: 1px solid var(--accent);
}

.mcq-explanation.show {
  display: block;
  animation: fadeIn 0.3s ease;
}

.mcq-explanation strong { color: var(--accent-hover); }

/* ============ Q&A ============ */
.qa-list { display: grid; gap: 10px; }

.qa-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: all 0.2s;
}

.qa-card:hover {
  border-color: var(--success);
  box-shadow: var(--shadow-sm);
}

.qa-question {
  padding: 16px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: background 0.15s;
}

.qa-question:hover { background: var(--bg-card-hover); }

.qa-question .q-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--success-dim);
  color: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  flex-shrink: 0;
  border: 1px solid var(--success);
}

.qa-question .q-text {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.6;
}

.qa-question .q-toggle {
  color: var(--text-dim);
  font-size: 14px;
  transition: transform 0.3s;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-tertiary);
  border-radius: 6px;
}

.qa-card.open .q-toggle { transform: rotate(180deg); color: var(--success); }

.qa-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.qa-card.open .qa-answer { max-height: 600px; }

.qa-answer-inner {
  padding: 0 18px 18px 64px;
  font-size: 14px;
  color: var(--success);
  font-weight: 500;
  line-height: 1.7;
  font-family: var(--font-mono);
}

.qa-answer-inner .arrow {
  color: var(--warning);
  margin-inline-end: 8px;
  font-weight: 800;
}

/* ============ FLASHCARDS ============ */
.flashcard-wrapper {
  max-width: 700px;
  margin: 0 auto;
}

.flashcard-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.flashcard-progress-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.flashcard-counter {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}

.flashcard-counter span {
  color: var(--accent-hover);
  font-size: 18px;
}

.flashcard-nav { display: flex; gap: 8px; }

.flashcard-nav button {
  padding: 10px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.flashcard-nav button:hover:not(:disabled) {
  background: var(--accent-dim);
  color: var(--accent-hover);
  border-color: var(--accent);
}

.flashcard-nav button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.flashcard-container {
  perspective: 1500px;
  min-height: 320px;
}

.flashcard {
  width: 100%;
  min-height: 320px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.flashcard.flipped { transform: rotateY(180deg); }

.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius-xl);
  padding: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
}

.flashcard-front {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-tertiary) 100%);
  position: relative;
  overflow: hidden;
}

.flashcard-front::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
  pointer-events: none;
}

.flashcard-back {
  background: linear-gradient(135deg, var(--accent-dim) 0%, var(--bg-card) 100%);
  transform: rotateY(180deg);
  border-color: var(--accent);
  position: relative;
  overflow: hidden;
}

.flashcard-back::before {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
  pointer-events: none;
}

.flashcard-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 20px;
  padding: 6px 14px;
  background: var(--bg-tertiary);
  border-radius: 20px;
  border: 1px solid var(--border);
}

.flashcard-text {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.7;
  color: var(--text-primary);
  position: relative;
  z-index: 1;
}

.flashcard-back .flashcard-text {
  color: var(--accent-hover);
  font-size: 19px;
}

.flashcard-hint {
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-dim);
  font-style: italic;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--bg-tertiary);
  border-radius: 20px;
}

/* ============ MNEMONICS ============ */
.mnemonics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.mnemonic-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}

.mnemonic-card::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  inset-inline-end: 0;
  height: 4px;
  background: var(--gradient-warm);
}

.mnemonic-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--warning);
}

.mnemonic-card .mn-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.mnemonic-card .mn-icon-wrap {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--warning-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  border: 1px solid var(--warning);
}

.mnemonic-card .mn-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--warning);
  letter-spacing: -0.2px;
}

.mnemonic-card .mn-code {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--pink);
  margin: 8px 0 14px;
  font-weight: 700;
  padding: 6px 12px;
  background: var(--pink-dim);
  border-radius: 8px;
  display: inline-block;
  border: 1px solid rgba(236,72,153,0.2);
}

.mnemonic-card .mn-items { list-style: none; }

.mnemonic-card .mn-items li {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 6px 0;
  display: flex;
  gap: 10px;
  line-height: 1.6;
  border-bottom: 1px dashed var(--border);
}

.mnemonic-card .mn-items li:last-child { border-bottom: none; }

.mnemonic-card .mn-items li .letter {
  color: var(--success);
  font-weight: 800;
  font-family: var(--font-mono);
  min-width: 22px;
  background: var(--success-dim);
  padding: 2px 8px;
  border-radius: 6px;
  text-align: center;
  font-size: 12px;
}

/* ============ EMPTY STATE ============ */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
  background: var(--bg-card);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
}

.empty-state .es-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;

// ==================== I18N HELPERS ====================
function t(key) {
  return (i18n[state.language] && i18n[state.language][key]) || i18n.en[key] || key;
}

function applyI18n() {
  document.getElementById('loadingText').textContent = t('loading');
  document.getElementById('taglineText').textContent = t('tagline');
  document.getElementById('topbarSubtitle').textContent = t('subtitle');
  document.getElementById('refreshLabel').textContent = t('refresh');
  document.getElementById('aboutLabel').textContent = t('about');
  document.getElementById('footerText').textContent = t('footer');
}

// ==================== LANGUAGE & THEME ====================
function setLanguage(lang) {
  state.language = lang;
  localStorage.setItem('medexit_lang', lang);
  
  const isRTL = (lang === 'ps' || lang === 'dr');
  document.documentElement.lang = lang === 'ps' ? 'ps' : lang === 'dr' ? 'fa' : 'en';
  document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
  document.body.dir = isRTL ? 'rtl' : 'ltr';
  
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  
  applyI18n();
  renderAll();
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('medexit_theme', state.theme);
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

// ==================== DATA LOADING ====================
async function loadData() {
  try {
    const response = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    state.data = normalizeData(data);
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderAll();
  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('loadingScreen').innerHTML = `
      <div style="text-align:center;padding:20px;">
        <div style="font-size:56px;margin-bottom:16px;">⚠️</div>
        <h3 style="color:var(--text-primary);margin-bottom:8px;font-size:18px;">${t('loadingFailed')}</h3>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px;">${err.message}</p>
        <button class="btn btn-primary" onclick="location.reload()">🔄 ${t('refresh')}</button>
      </div>
    `;
  }
}

async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  
  try {
    const response = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    state.data = normalizeData(data);
    renderAll();
    toast(t('refreshSuccess'), 'success');
  } catch (err) {
    toast(t('loadingFailed'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>🔄</span> <span id="refreshLabel">' + t('refresh') + '</span>';
  }
}

function normalizeData(data) {
  if (Array.isArray(data)) return { categories: data };
  if (data.categories) return data;
  return { categories: [] };
}

// ==================== DATA HELPERS ====================
function getCategories() { return state.data?.categories || []; }
function getCategory(id) { return getCategories().find(c => c.id === id); }
function getSubjects(categoryId) { return getCategory(categoryId)?.subjects || []; }
function getSubject(categoryId, subjectId) { return getSubjects(categoryId).find(s => s.id === subjectId); }
function getTopics(categoryId, subjectId) { return getSubject(categoryId, subjectId)?.topics || []; }
function getTopic(categoryId, subjectId, topicId) { return getTopics(categoryId, subjectId).find(t => t.id === topicId); }

function countItemsInCategory(cat) {
  let mcqs = 0, qa = 0, flash = 0, mnem = 0;
  (cat.subjects || []).forEach(sub => {
    (sub.topics || []).forEach(topic => {
      const c = topic.content || {};
      mcqs += (c.mcqs || []).length;
      qa += (c.qa || []).length;
      flash += (c.flashcards || []).length;
      mnem += (c.mnemonics || []).length;
    });
  });
  return { mcqs, qa, flash, mnem, total: mcqs + qa + flash + mnem };
}

function countItemsInSubject(sub) {
  let mcqs = 0, qa = 0, flash = 0, mnem = 0;
  (sub.topics || []).forEach(topic => {
    const c = topic.content || {};
    mcqs += (c.mcqs || []).length;
    qa += (c.qa || []).length;
    flash += (c.flashcards || []).length;
    mnem += (c.mnemonics || []).length;
  });
  return { mcqs, qa, flash, mnem, total: mcqs + qa + flash + mnem };
}

// ==================== UTILITIES ====================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function getCategoryIcon(catId) {
  const icons = { paraclinic: '🔬', clinic: '🏥', nmle: '📝' };
  return icons[catId] || '📚';
}

function getCategoryColorClass(catId) {
  const colors = { paraclinic: 'cyan', clinic: 'pink', nmle: 'purple' };
  return colors[catId] || 'cyan';
}

// ==================== NAVIGATION ====================
function pushHistory() {
  state.history.push({
    view: state.view,
    categoryId: state.categoryId,
    subjectId: state.subjectId,
    topicId: state.topicId,
    currentTab: state.currentTab
  });
  if (state.history.length > 20) state.history.shift();
}

function goBack() {
  if (state.history.length > 0) {
    const prev = state.history.pop();
    state.view = prev.view;
    state.categoryId = prev.categoryId;
    state.subjectId = prev.subjectId;
    state.topicId = prev.topicId;
    state.currentTab = prev.currentTab;
    renderAll();
    window.scrollTo(0, 0);
  } else {
    goHome();
  }
}

function goHome() {
  pushHistory();
  state.view = 'home';
  state.categoryId = null;
  state.subjectId = null;
  state.topicId = null;
  state.currentTab = 'mcqs';
  renderAll();
  window.scrollTo(0, 0);
}

function openCategory(catId) {
  pushHistory();
  state.view = 'category';
  state.categoryId = catId;
  state.subjectId = null;
  state.topicId = null;
  state.currentTab = 'mcqs';
  renderAll();
  window.scrollTo(0, 0);
  closeSidebar();
}

function openSubject(catId, subId) {
  pushHistory();
  state.view = 'subject';
  state.categoryId = catId;
  state.subjectId = subId;
  state.topicId = null;
  state.currentTab = 'mcqs';
  renderAll();
  window.scrollTo(0, 0);
  closeSidebar();
}

function openTopic(catId, subId, topicId) {
  pushHistory();
  state.view = 'topic';
  state.categoryId = catId;
  state.subjectId = subId;
  state.topicId = topicId;
  state.currentTab = 'mcqs';
  renderAll();
  window.scrollTo(0, 0);
  closeSidebar();
}

function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.content-tab').forEach(t => {
    const onclick = t.getAttribute('onclick') || '';
    t.classList.toggle('active', onclick.includes(`'${tab}'`));
  });
  document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById(`panel-${tab}`);
  if (panel) panel.classList.add('active');
}

// ==================== MCQ RENDERING ====================
function renderMCQs(mcqs, topicKey) {
  const answers = state.mcqAnswers[topicKey] || {};
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  
  const answered = Object.keys(answers).length;
  const correct = Object.entries(answers).filter(([qIdx, optIdx]) => mcqs[qIdx].answer === optIdx).length;
  const wrong = answered - correct;
  const progress = mcqs.length > 0 ? (answered / mcqs.length) * 100 : 0;
  
  let html = `
    <div class="mcq-progress">
      <div class="mcq-progress-info">
        <div class="mcq-progress-label">${t('progress')}</div>
        <div class="mcq-progress-bar">
          <div class="mcq-progress-fill" style="width: ${progress}%"></div>
        </div>
      </div>
      <div class="mcq-progress-stats">
        <div class="stat correct">✓ ${correct}</div>
        <div class="stat wrong">✗ ${wrong}</div>
        <div class="stat.remaining">${mcqs.length - answered} ${t('remaining')}</div>
      </div>
    </div>
    <div class="mcq-list">
  `;
  
  mcqs.forEach((mcq, qIdx) => {
    const wasAnswered = answers[qIdx] !== undefined;
    const selected = answers[qIdx];
    const correctIdx = mcq.answer;
    const question = mcq.q || mcq.question || '';
    const options = mcq.options || [];
    const explanation = mcq.explanation || mcq.explain || '';
    const isCorrect = wasAnswered && selected === correctIdx;
    
    let cardClass = 'mcq-card';
    if (wasAnswered) cardClass += isCorrect ? ' answered-correct' : ' answered-wrong';
    
    html += `
      <div class="${cardClass}">
        <div class="mcq-header">
          <div class="mcq-number">${t('question')} ${qIdx + 1}</div>
          <div class="mcq-status">
            ${isCorrect ? '✓ ' + t('correct') : '✗ ' + t('wrong')}
          </div>
        </div>
        <div class="mcq-question ${dirClass(question)}">${escapeHtml(question)}</div>
        <div class="mcq-options">
    `;
    
    options.forEach((opt, oIdx) => {
      let classes = 'mcq-option';
      if (wasAnswered) {
        classes += ' disabled';
        if (oIdx === correctIdx) classes += ' correct';
        else if (oIdx === selected) classes += ' wrong';
      }
      html += `
        <div class="${classes}" onclick="${wasAnswered ? '' : `answerMCQ('${topicKey}', ${qIdx}, ${oIdx})`}">
          <div class="opt-letter">${letters[oIdx]}</div>
          <div class="opt-text ${dirClass(opt)}">${escapeHtml(opt)}</div>
        </div>
      `;
    });
    
    html += `</div>`;
    
    if (explanation) {
      html += `
        <div class="mcq-explanation ${wasAnswered ? 'show' : ''} ${dirClass(explanation)}">
          <strong>${t('explanation')}:</strong> ${escapeHtml(explanation)}
        </div>
      `;
    }
    
    html += `</div>`;
  });
  
  html += `</div>`;
  return html;
}

function answerMCQ(topicKey, qIdx, optIdx) {
  if (!state.mcqAnswers[topicKey]) state.mcqAnswers[topicKey] = {};
  state.mcqAnswers[topicKey][qIdx] = optIdx;
  renderTopicView();
}

// ==================== Q&A RENDERING ====================
function renderQA(qa, topicKey) {
  let html = `<div class="qa-list">`;
  
  qa.forEach((item, idx) => {
    const cardId = `${topicKey}_qa_${idx}`;
    const isOpen = state.openQA[cardId];
    const q = item.q || item.question || '';
    const a = item.a || item.answer || '';
    
    html += `
      <div class="qa-card ${isOpen ? 'open' : ''}" id="qa-${cardId}" onclick="toggleQA('${cardId}')">
        <div class="qa-question">
          <div class="q-icon">Q</div>
          <div class="q-text ${dirClass(q)}">${escapeHtml(q)}</div>
          <div class="q-toggle">▾</div>
        </div>
        <div class="qa-answer">
          <div class="qa-answer-inner ${dirClass(a)}">
            <span class="arrow">→</span> ${escapeHtml(a)}
          </div>
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  return html;
}

function toggleQA(cardId) {
  state.openQA[cardId] = !state.openQA[cardId];
  const card = document.getElementById(`qa-${cardId}`);
  if (card) card.classList.toggle('open');
}

// ==================== FLASHCARDS RENDERING ====================
function renderFlashcards(flashcards, topicKey) {
  const idx = state.flashcardIndex[topicKey] || 0;
  const card = flashcards[idx];
  const front = card.front || card.q || card.question || '';
  const back = card.back || card.a || card.answer || '';
  
  return `
    <div class="flashcard-wrapper">
      <div class="flashcard-controls">
        <div class="flashcard-progress-info">
          <div class="flashcard-counter">
            <span>${idx + 1}</span> ${t('of')} ${flashcards.length}
          </div>
        </div>
        <div class="flashcard-nav">
          <button onclick="prevFlashcard('${topicKey}', ${flashcards.length})" ${idx === 0 ? 'disabled' : ''}>← ${t('previous')}</button>
          <button onclick="nextFlashcard('${topicKey}', ${flashcards.length})" ${idx === flashcards.length - 1 ? 'disabled' : ''}>${t('next')} →</button>
        </div>
      </div>
      <div class="flashcard-container">
        <div class="flashcard" id="flashcard-${topicKey}" onclick="flipFlashcard('${topicKey}')">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-label">${t('front')}</div>
            <div class="flashcard-text ${dirClass(front)}">${escapeHtml(front)}</div>
            <div class="flashcard-hint">👆 ${t('tapToFlip')}</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-label">${t('back')}</div>
            <div class="flashcard-text ${dirClass(back)}">${escapeHtml(back)}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function flipFlashcard(topicKey) {
  const card = document.getElementById(`flashcard-${topicKey}`);
  if (card) card.classList.toggle('flipped');
}

function prevFlashcard(topicKey, total) {
  if (!state.flashcardIndex[topicKey]) state.flashcardIndex[topicKey] = 0;
  if (state.flashcardIndex[topicKey] > 0) {
    state.flashcardIndex[topicKey]--;
    renderTopicView();
  }
}

function nextFlashcard(topicKey, total) {
  if (!state.flashcardIndex[topicKey]) state.flashcardIndex[topicKey] = 0;
  if (state.flashcardIndex[topicKey] < total - 1) {
    state.flashcardIndex[topicKey]++;
    renderTopicView();
  }
}

// ==================== MNEMONICS RENDERING ====================
function renderMnemonics(mnemonics) {
  let html = `<div class="mnemonics-grid">`;
  
  mnemonics.forEach(mn => {
    const title = mn.title || '';
    const code = mn.code || '';
    const items = mn.items || [];
    
    html += `
      <div class="mnemonic-card">
        <div class="mn-header">
          <div class="mn-icon-wrap">${mn.icon || '🧠'}</div>
          <div class="mn-title ${dirClass(title)}">${escapeHtml(title)}</div>
        </div>
        ${code ? `<div class="mn-code ${dirClass(code)}">${escapeHtml(code)}</div>` : ''}
        <ul class="mn-items">
          ${items.map(it => `
            <li>
              <span class="letter ${dirClass(it.letter)}">${escapeHtml(it.letter)}</span>
              <span class="${dirClass(it.text)}">${escapeHtml(it.text)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  });
  
  html += `</div>`;
  return html;
}

// ==================== SIDEBAR ====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ==================== MODAL ====================
function openAboutModal() {
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-header">
      <h3>ℹ️ ${t('aboutTitle')}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p>${t('aboutText')}</p>
      <h4>✨ ${t('features')}</h4>
      <ul>
        ${t('featureList').map(f => `<li>${f}</li>`).join('')}
      </ul>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">✓ ${t('ok')}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ==================== TOAST ====================
function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <span class="toast-icon">${icons[type] || icons.info}</span>
    <span class="toast-message">${message}</span>
  `;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'slideIn 0.3s ease reverse';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('show')) {
      closeModal();
    } else if (state.view !== 'home') {
      goBack();
    }
  }
  if ((e.altKey || e.metaKey) && e.key === 'ArrowLeft') {
    e.preventDefault();
    goBack();
  }
});

// ==================== INIT ====================
function init() {
  applyTheme();
  setLanguage(state.language);
  loadData();
}

init();
</script>
</body>
</html>
