        function t(key) { return (i18n[state.language] && i18n[state.language][key]) || i18n.en[key] || key; }

        // ==================== STATE ====================
        let state = {
            language: localStorage.getItem('medexit_lang') || 'en',
            theme: localStorage.getItem('medexit_theme') || 'dark',
            data: null,
            navStack: [],
            currentTab: 'mcqs',
            mcqAnswers: {},
            mcqCurrentIndex: {},
            mcqShowResults: {},
            mcqTimers: {},
            flashcardIndex: {},
            openQA: {}
        };

        // ==================== LANGUAGE & THEME ====================
        function setLanguage(lang) {
            state.language = lang;
            localStorage.setItem('medexit_lang', lang);
            const isRTL = lang === 'ps' || lang === 'dr';
            document.documentElement.lang = lang;
            document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
            applyI18n();
            renderAll();
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('medexit_theme', state.theme);
            applyTheme();
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '☀️' : '🌙';
        }

        function applyI18n() {
            document.getElementById('loadingText').textContent = t('loading');
            document.getElementById('taglineText').textContent = t('tagline');
            document.getElementById('topbarSubtitle').textContent = t('subtitle');
            document.getElementById('refreshLabel').textContent = t('refresh');
        }

        // ==================== DATA LOADING ====================
        async function loadData() {
            try {
                const res = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                state.data = normalizeData(data);
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                renderAll();
            } catch (err) {
                document.getElementById('loadingScreen').innerHTML =
                    `<div style="text-align:center;padding:30px;"><h3>⚠️ Load Error</h3><p>${err.message}</p><button onclick="location.reload()">Retry</button></div>`;
            }
        }

        async function refreshData() {
            try {
                const res = await fetch('./mcqs_q_a_flashcards_andetc.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                state.data = normalizeData(data);
                renderAll();
                toast(t('refreshSuccess'), 'success');
            } catch (e) {
                toast(t('loadingFailed'), 'error');
            }
        }

        function normalizeData(data) {
            if (!data) return { categories: [] };
            if (Array.isArray(data)) return { categories: data.map(normalizeItem) };
            if (data.categories) return { categories: data.categories.map(normalizeItem) };
            return { categories: [] };
        }

        function normalizeItem(item) {
            if (!item) return null;
            const result = {
                id: item.id || ('id_' + Math.random().toString(36).slice(2, 8)),
                name: item.name || '',
                icon: item.icon || '📚',
                description: item.description || '',
                content: item.content || null,
                children: []
            };
            [
                item.children,
                item.subjects,
                item.topics,
                item.subtopics,
                item.categories
            ].forEach(src => {
                if (Array.isArray(src)) src.forEach(c => {
                    const n = normalizeItem(c);
                    if (n) result.children.push(n);
                });
            });
            return result;
        }

        // ==================== NAVIGATION ====================
        function navigateTo(item) {
            state.navStack.push({ item });
            state.currentTab = 'mcqs';
            renderAll();
            document.getElementById('content').scrollTo(0, 0);
            closeSidebar();
        }

        function goBack() {
            if (state.navStack.length > 0) {
                state.navStack.pop();
                renderAll();
            }
        }

        function goHome() {
            state.navStack = [];
            renderAll();
            closeSidebar();
        }

        function navigateToItem(id) {
            const item = findItemById(state.data?.categories || [], id);
            if (item) navigateTo(item);
        }

        function findItemById(items, id) {
            for (const item of items) {
                if (item.id === id) return item;
                if (item.children?.length) {
                    const f = findItemById(item.children, id);
                    if (f) return f;
                }
            }
            return null;
        }

        function getCurrentItem() {
            return state.navStack.length ? state.navStack[state.navStack.length - 1].item : null;
        }

        // ==================== RENDER ====================
        function renderAll() {
            applyI18n();
            renderBreadcrumb();
            renderNav();
            renderContent();
        }

        function renderBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            let html = `<span class="breadcrumb-item ${state.navStack.length === 0 ? 'current' : ''}" onclick="goHome()">🏠 ${t('dashboard')}</span>`;
            state.navStack.forEach((e, i) => {
                const last = i === state.navStack.length - 1;
                html += `<span class="breadcrumb-sep">›</span>`;
                html += `<span class="breadcrumb-item ${last ? 'current' : ''}" onclick="goBackTo(${i+1})">${e.item.icon} ${escapeHtml(e.item.name)}</span>`;
            });
            bc.innerHTML = html;
        }

        function goBackTo(idx) {
            state.navStack = state.navStack.slice(0, idx);
            renderAll();
        }

        function renderNav() {
            const nav = document.getElementById('navList');
            if (state.navStack.length === 0) {
                let html = `<div class="nav-section-title">${t('categories')}</div>`;
                (state.data?.categories || []).forEach((cat, i) => {
                    const c = countContent(cat);
                    html += `<div class="nav-item" onclick="navigateToItem('${cat.id}')">
                <span class="ni-icon">${cat.icon}</span><span class="ni-name">${escapeHtml(cat.name)}</span>
                <span class="ni-count">${c.total}</span></div>`;
                });
                nav.innerHTML = html;
            } else {
                const cur = getCurrentItem();
                const children = cur.children || [];
                let html = `<div class="nav-section-title">${t('subtopics')}</div>`;
                children.forEach((child, i) => {
                    const c = countContent(child);
                    html += `<div class="nav-item" onclick="navigateToItem('${child.id}')">
                <span class="ni-icon">${child.icon}</span><span class="ni-name">${escapeHtml(child.name)}</span>
                <span class="ni-count">${c.total}</span></div>`;
                });
                nav.innerHTML = html;
            }
        }

        function countContent(item) {
            if (!item) return { mcqs: 0, qa: 0, flash: 0, mnem: 0, total: 0 };
            const c = item.content || {};
            let mcqs = (c.mcqs || []).length;
            let qa = (c.qa || []).length;
            let flash = (c.flashcards || []).length;
            let mnem = (c.mnemonics || []).length;
            (item.children || []).forEach(ch => {
                const cc = countContent(ch);
                mcqs += cc.mcqs;
                qa += cc.qa;
                flash += cc.flash;
                mnem += cc.mnem;
            });
            return { mcqs, qa, flash, mnem, total: mcqs + qa + flash + mnem };
        }

        function getItemType(item) {
            if (!item) return 'empty';
            const hasChildren = (item.children || []).length > 0;
            const c = item.content || {};
            const hasContent = (c.mcqs?.length || c.qa?.length || c.flashcards?.length || c.mnemonics?.length) > 0;
            if (hasChildren) return 'container';
            if (hasContent) return 'leaf';
            return 'empty';
        }

        function renderContent() {
            const content = document.getElementById('content');
            const tt = document.getElementById('topbarTitle');
            if (state.navStack.length === 0) {
                renderDashboard();
                tt.innerHTML = '🩺 MedExit';
            } else {
                const cur = getCurrentItem();
                tt.innerHTML = `${cur.icon} ${escapeHtml(cur.name)}`;
                const type = getItemType(cur);
                if (type === 'container') renderContainerView(cur);
                else if (type === 'leaf') renderLeafView(cur);
                else renderEmptyView();
            }
        }

        function renderDashboard() {
            const content = document.getElementById('content');
            const cats = state.data?.categories || [];
            let tMcqs = 0,
                tQa = 0,
                tFlash = 0,
                tMnem = 0;
            cats.forEach(c => {
                const cc = countContent(c);
                tMcqs += cc.mcqs;
                tQa += cc.qa;
                tFlash += cc.flash;
                tMnem += cc.mnem;
            });
            let html = `<div class="dashboard">
            <div class="dashboard-hero">
              <div class="hero-badge">✨ ${t('dashboard')}</div>
              <h1>${t('welcomeTitle')}</h1>
              <p class="hero-desc">${t('welcomeDesc')}</p>
              <div class="hero-stats">
                <div class="hero-stat"><div class="hs-icon">📋</div><div><div class="hs-value">${tMcqs}</div><div class="hs-label">${t('totalMCQs')}</div></div></div>
                <div class="hero-stat"><div class="hs-icon">💬</div><div><div class="hs-value">${tQa}</div><div class="hs-label">${t('totalQA')}</div></div></div>
                <div class="hero-stat"><div class="hs-icon">🎴</div><div><div class="hs-value">${tFlash}</div><div class="hs-label">${t('totalFlash')}</div></div></div>
                <div class="hero-stat"><div class="hs-icon">🧠</div><div><div class="hs-value">${tMnem}</div><div class="hs-label">${t('totalMnem')}</div></div></div>
              </div>
            </div>
            <div class="section-header"><div><h2>${t('exploreCategories')}</h2><div class="section-subtitle">${cats.length} ${t('categories')}</div></div></div>
            <div class="category-grid">`;
            cats.forEach((cat, i) => {
                const c = countContent(cat);
                html += `<div class="category-card" onclick="navigateToItem('${cat.id}')">
              <div class="cc-header"><div class="cc-icon-wrap">${cat.icon}</div><div class="cc-title"><h3>${escapeHtml(cat.name)}</h3>${cat.description ? `<div class="cc-desc">${escapeHtml(cat.description).substring(0,60)}</div>`:''}</div></div>
              <div class="cc-stats">
                <div class="cc-stat mcq"><div class="cc-stat-value">${c.mcqs}</div><div class="cc-stat-label">MCQs</div></div>
                <div class="cc-stat qa"><div class="cc-stat-value">${c.qa}</div><div class="cc-stat-label">Q&A</div></div>
                <div class="cc-stat flash"><div class="cc-stat-value">${c.flash}</div><div class="cc-stat-label">Cards</div></div>
                <div class="cc-stat mnem"><div class="cc-stat-value">${c.mnem}</div><div class="cc-stat-label">Mnemo</div></div>
              </div>
              <div class="cc-arrow">→</div></div>`;
            });
            html += `</div></div>`;
            content.innerHTML = html;
        }

        function renderContainerView(item) {
            const content = document.getElementById('content');
            const children = item.children || [];
            let html = `<div class="topic-viewer">
            <div class="topic-hero">
              <div class="topic-hero-top"><div class="topic-icon-wrap">${item.icon}</div>
              <div class="topic-info"><h1>${escapeHtml(item.name)}</h1><div class="topic-path">${buildPathDisplay()}</div></div></div>
              ${item.description ? `<div class="topic-description">${escapeHtml(item.description)}</div>` : ''}
            </div>
            <div class="section-header"><div><h2>${t('subtopics')}</h2><div class="section-subtitle">${children.length} ${t('items')}</div></div></div>
            <div class="children-grid">`;
            children.forEach(ch => {
                const c = countContent(ch);
                html += `<div class="child-card" onclick="navigateToItem('${ch.id}')">
              <div class="child-icon">${ch.icon}</div>
              <div class="child-content"><div class="child-title">${escapeHtml(ch.name)}</div>
              <div class="child-meta"><span>📚 ${ch.children?.length||0} items</span></div>
              <div class="content-badges">${c.mcqs?`<span class="content-badge mcq">📋 ${c.mcqs}</span>`:''}${c.qa?`<span class="content-badge qa">💬 ${c.qa}</span>`:''}${c.flash?`<span class="content-badge flash">🎴 ${c.flash}</span>`:''}${c.mnem?`<span class="content-badge mnem">🧠 ${c.mnem}</span>`:''}</div>
              </div><div class="child-arrow">→</div></div>`;
            });
            html += `</div>`;
            if (item.content && ((item.content.mcqs||[]).length || (item.content.qa||[]).length || (item.content.flashcards||[]).length || (item
                    .content.mnemonics || []).length)) {
                html += renderContentTabs(item);
            }
            html += `</div>`;
            content.innerHTML = html;
        }

        function renderLeafView(item) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="topic-viewer">${renderContentTabs(item)}</div>`;
        }

        function renderEmptyView() {
            document.getElementById('content').innerHTML = `<div class="topic-viewer"><div class="empty-state"><div class="es-icon">📭</div><h3>${t('noContent')}</h3><p>${t('noContentDesc')}</p></div></div>`;
        }

        function buildPathDisplay() {
            return state.navStack.map(e => `<span>${e.item.icon} ${escapeHtml(e.item.name)}</span>`).join('<span style="color:rgba(255,255,255,.4)">›</span>');
        }

        function renderContentTabs(item) {
            const c = item.content || {};
            const mcqs = c.mcqs || [];
            const qa = c.qa || [];
            const flashcards = c.flashcards || [];
            const mnemonics = c.mnemonics || [];
            const tk = item.id;
            if (state.mcqShowResults[tk]) return renderQuizResults(mcqs, tk);
            let html = `<div class="topic-hero"><div class="topic-hero-top"><div class="topic-icon-wrap">${item.icon}</div>
            <div class="topic-info"><h1>${escapeHtml(item.name)}</h1><div class="topic-path">${buildPathDisplay()}</div></div></div>
            <div class="topic-badges">${mcqs.length?`<span class="topic-badge">📋 ${mcqs.length}</span>`:''}${qa.length?`<span class="topic-badge">💬 ${qa.length}</span>`:''}${flashcards.length?`<span class="topic-badge">🎴 ${flashcards.length}</span>`:''}${mnemonics.length?`<span class="topic-badge">🧠 ${mnemonics.length}</span>`:''}</div></div>
            <div class="content-tabs">
              <button class="content-tab ${state.currentTab==='mcqs'?'active':''}" onclick="switchTab('mcqs')" ${!mcqs.length?'disabled':''}>📋 MCQs</button>
              <button class="content-tab ${state.currentTab==='qa'?'active':''}" onclick="switchTab('qa')" ${!qa.length?'disabled':''}>💬 Q&A</button>
              <button class="content-tab ${state.currentTab==='flashcards'?'active':''}" onclick="switchTab('flashcards')" ${!flashcards.length?'disabled':''}>🎴 Flashcards</button>
              <button class="content-tab ${state.currentTab==='mnemonics'?'active':''}" onclick="switchTab('mnemonics')" ${!mnemonics.length?'disabled':''}>🧠 Mnemonics</button>
            </div>
            <div class="content-panel ${state.currentTab==='mcqs'?'active':''}" id="panel-mcqs">${mcqs.length?renderMCQQuiz(mcqs,tk):renderEmpty()}</div>
            <div class="content-panel ${state.currentTab==='qa'?'active':''}" id="panel-qa">${qa.length?renderQA(qa,tk):renderEmpty()}</div>
            <div class="content-panel ${state.currentTab==='flashcards'?'active':''}" id="panel-flashcards">${flashcards.length?renderFlashcards(flashcards,tk):renderEmpty()}</div>
            <div class="content-panel ${state.currentTab==='mnemonics'?'active':''}" id="panel-mnemonics">${mnemonics.length?renderMnemonics(mnemonics):renderEmpty()}</div>`;
            return html;
        }

        // ==================== MCQ QUIZ (AUTO-ADVANCE) ====================
        function renderMCQQuiz(mcqs, tk) {
            if (!state.mcqAnswers[tk]) state.mcqAnswers[tk] = {};
            if (state.mcqCurrentIndex[tk] === undefined) state.mcqCurrentIndex[tk] = 0;
            const answers = state.mcqAnswers[tk];
            const curIdx = state.mcqCurrentIndex[tk];
            const mcq = mcqs[curIdx];
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            const answered = Object.keys(answers).length;
            const correct = Object.entries(answers).filter(([q, a]) => mcqs[q].answer === a).length;
            const wrong = answered - correct;
            const progress = mcqs.length ? (answered / mcqs.length * 100) : 0;
            const wasAnswered = answers[curIdx] !== undefined;
            const selected = answers[curIdx];
            const correctIdx = mcq.answer;
            const question = mcq.q || mcq.question || '';
            const options = mcq.options || [];
            const explanation = mcq.explanation || '';
            const image = mcq.image || '';
            const video = mcq.video || '';
            const note = mcq.note || '';
            const isCorrect = wasAnswered && selected === correctIdx;
            let cardClass = 'quiz-card';
            if (wasAnswered) cardClass += isCorrect ? ' answered-correct' : ' answered-wrong';
            let html = `<div class="quiz-container">
            <div class="quiz-header">
              <div class="quiz-progress-info"><div class="quiz-progress-label"><span>${t('progress')}</span><span>${answered}/${mcqs.length}</span></div>
              <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progress}%"></div></div></div>
              <div class="quiz-stats"><div class="quiz-stat correct">✓ ${correct}</div><div class="quiz-stat wrong">✗ ${wrong}</div><div class="quiz-stat remaining">${mcqs.length-answered} left</div></div>
            </div>
            <div class="${cardClass}">
              <div class="quiz-card-header"><div class="quiz-number">${t('question')} ${curIdx+1}</div><div class="quiz-status">${isCorrect?'✓ '+t('correct'):'✗ '+t('wrong')}</div></div>
              <div class="quiz-question">${escapeHtml(question)}</div>`;
            if (image) html += `<img src="${image}" class="mcq-image" alt="Question image" onerror="this.style.display='none'">`;
            if (video) {
                if (video.includes('youtube.com') || video.includes('youtu.be')) {
                    const vid = getYoutubeId(video);
                    html += `<iframe width="100%" height="280" src="https://www.youtube.com/embed/${vid}" frameborder="0" allowfullscreen class="mcq-video"></iframe>`;
                } else {
                    html += `<video controls class="mcq-video"><source src="${video}" type="video/mp4"></video>`;
                }
            }
            html += `<div class="quiz-options">`;
            options.forEach((opt, oi) => {
                let cls = 'quiz-option';
                if (wasAnswered) {
                    cls += ' disabled';
                    if (oi === correctIdx) cls += ' correct';
                    else if (oi === selected) cls += ' wrong';
                }
                html += `<div class="${cls}" onclick="${wasAnswered?'':`answerMCQ('${tk}',${curIdx},${oi})`}">
              <div class="opt-letter">${letters[oi]}</div><div class="opt-text">${escapeHtml(opt)}</div></div>`;
            });
            html += `</div>`;
            if (explanation) html += `<div class="quiz-explanation ${wasAnswered?'show':''}"><strong>${t('explanation')}:</strong> ${escapeHtml(explanation)}</div>`;
            if (note) html += `<div class="mcq-note">📝 ${escapeHtml(note)}</div>`;
            html += `</div>`;
            // Navigation
            html += `<div class="quiz-nav">`;
            if (curIdx > 0) html += `<button class="quiz-nav-btn" onclick="prevMCQ('${tk}')">← ${t('previous')}</button>`;
            else html += `<div></div>`;
            // For wrong answer, show Next button (manual)
            if (wasAnswered && !isCorrect && curIdx < mcqs.length - 1) {
                html += `<button class="quiz-nav-btn primary" onclick="nextMCQ('${tk}')">${t('next')} →</button>`;
            } else if (wasAnswered && !isCorrect && curIdx === mcqs.length - 1) {
                html += `<button class="quiz-nav-btn primary" onclick="finishQuiz('${tk}')">${t('finish')} 🏁</button>`;
            } else if (!wasAnswered && curIdx < mcqs.length - 1) {
                html += `<div></div>`;
            } else if (!wasAnswered && curIdx === mcqs.length - 1) {
                html += `<div></div>`;
            }
            html += `</div>`;
            // Dots
            html += `<div class="quiz-dots">`;
            mcqs.forEach((_, qi) => {
                let dc = 'quiz-dot';
                if (qi === curIdx) dc += ' current';
                else if (answers[qi] !== undefined) dc += answers[qi] === mcqs[qi].answer ? ' answered-correct' : ' answered-wrong';
                html += `<button class="${dc}" onclick="goToMCQ('${tk}',${qi})">${qi+1}</button>`;
            });
            html += `</div></div>`;
            return html;
        }

        function getYoutubeId(url) {
            const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{6,20})/);
            return m ? m[1] : '';
        }

        function answerMCQ(tk, qi, oi) {
            if (state.mcqAnswers[tk][qi] !== undefined) return;
            const item = getCurrentItem();
            if (!item) return;
            const mcqs = item.content?.mcqs || [];
            const mcq = mcqs[qi];
            const isCorrect = oi === mcq.answer;
            state.mcqAnswers[tk][qi] = oi;
            renderContent();
            // Auto-advance on correct answer
            if (isCorrect) {
                if (state.mcqTimers[tk]) clearTimeout(state.mcqTimers[tk]);
                state.mcqTimers[tk] = setTimeout(() => {
                    if (state.mcqCurrentIndex[tk] < mcqs.length - 1) {
                        state.mcqCurrentIndex[tk]++;
                        renderContent();
                    } else {
                        state.mcqShowResults[tk] = true;
                        renderContent();
                    }
                }, 1500);
            }
        }

        function prevMCQ(tk) {
            if (state.mcqCurrentIndex[tk] > 0) {
                state.mcqCurrentIndex[tk]--;
                renderContent();
            }
        }

        function nextMCQ(tk) {
            const item = getCurrentItem();
            if (!item) return;
            const mcqs = item.content?.mcqs || [];
            if (state.mcqCurrentIndex[tk] < mcqs.length - 1) {
                state.mcqCurrentIndex[tk]++;
                renderContent();
            } else {
                state.mcqShowResults[tk] = true;
                renderContent();
            }
        }

        function goToMCQ(tk, qi) {
            state.mcqCurrentIndex[tk] = qi;
            renderContent();
        }

        function finishQuiz(tk) {
            state.mcqShowResults[tk] = true;
            renderContent();
        }

        function renderQuizResults(mcqs, tk) {
            const answers = state.mcqAnswers[tk] || {};
            const total = mcqs.length;
            const correct = Object.entries(answers).filter(([q, a]) => mcqs[q].answer === a).length;
            const wrong = total - correct;
            const percent = total ? Math.round(correct / total * 100) : 0;
            let icon, msg;
            if (percent >= 90) { icon = '🏆';
                msg = t('excellent'); } else if (percent >= 70) { icon = '🌟';
                msg = t('great'); } else if (percent >= 50) { icon = '📚';
                msg = t('good'); } else { icon = '💪';
                msg = t('keepGoing'); }
            return `<div class="quiz-container"><div class="quiz-results">
            <div class="results-icon">${icon}</div><div class="results-score">${percent}%</div>
            <div class="results-label">${t('youScored')} ${correct} / ${total}</div>
            <div class="results-stats"><div class="results-stat"><div class="results-stat-value correct">${correct}</div><div class="results-stat-label">${t('correct')}</div></div>
            <div class="results-stat"><div class="results-stat-value wrong">${wrong}</div><div class="results-stat-label">${t('wrong')}</div></div>
            <div class="results-stat"><div class="results-stat-value total">${total}</div><div class="results-stat-label">${t('question')}</div></div></div>
            <div class="results-message">${msg}</div>
            <div class="results-actions"><button class="btn btn-primary" onclick="retryQuiz('${tk}')">🔄 ${t('retry')}</button>
            <button class="btn btn-secondary" onclick="reviewQuiz('${tk}')">📖 ${t('reviewAnswers')}</button></div></div></div>`;
        }

        function retryQuiz(tk) {
            state.mcqAnswers[tk] = {};
            state.mcqCurrentIndex[tk] = 0;
            state.mcqShowResults[tk] = false;
            renderContent();
        }

        function reviewQuiz(tk) {
            state.mcqShowResults[tk] = false;
            state.mcqCurrentIndex[tk] = 0;
            renderContent();
        }

        // ==================== QA ====================
        function renderQA(qa, tk) {
            let html = `<div class="qa-list">`;
            qa.forEach((item, i) => {
                const cid = `${tk}_qa_${i}`;
                const open = state.openQA[cid];
                const q = item.q || item.question || '';
                const a = item.a || item.answer || '';
                const img = item.image || '';
                const vid = item.video || '';
                html += `<div class="qa-card ${open?'open':''}" id="qa-${cid}" onclick="toggleQA('${cid}')">
              <div class="qa-question"><div class="q-icon">Q</div><div class="q-text">${escapeHtml(q)}</div><div class="q-toggle">▾</div></div>
              <div class="qa-answer"><div class="qa-answer-inner">${escapeHtml(a)}${img?`<br><img src="${img}" style="max-width:100%;border-radius:10px;margin-top:8px">`:''}${vid?`<br><video controls style="width:100%;border-radius:10px;margin-top:8px"><source src="${vid}"></video>`:''}</div></div></div>`;
            });
            html += `</div>`;
            return html;
        }

        function toggleQA(cid) {
            state.openQA[cid] = !state.openQA[cid];
            const el = document.getElementById(`qa-${cid}`);
            if (el) el.classList.toggle('open');
        }

        // ==================== FLASHCARDS (Modern) ====================
        function renderFlashcards(flashcards, tk) {
            if (state.flashcardIndex[tk] === undefined) state.flashcardIndex[tk] = 0;
            const idx = state.flashcardIndex[tk];
            const card = flashcards[idx];
            const front = card.front || card.q || card.question || '';
            const back = card.back || card.a || card.answer || '';
            const img = card.image || '';
            return `<div class="flashcard-wrapper">
            <div class="flashcard-controls">
              <div class="flashcard-counter"><span>${idx+1}</span> / ${flashcards.length}</div>
              <div class="flashcard-nav">
                <button onclick="prevFlashcard('${tk}')" ${idx===0?'disabled':''}>← ${t('previous')}</button>
                <button onclick="nextFlashcard('${tk}',${flashcards.length})" ${idx===flashcards.length-1?'disabled':''}>${t('next')} →</button>
              </div>
            </div>
            <div class="flashcard-container">
              <div class="flashcard" id="flashcard-${tk}" onclick="flipFlashcard('${tk}')">
                <div class="flashcard-face flashcard-front">
                  <div class="flashcard-label">${t('front')}</div>
                  ${img?`<img src="${img}" style="max-width:80%;max-height:180px;border-radius:12px;margin-bottom:10px;object-fit:contain">`:''}
                  <div class="flashcard-text">${escapeHtml(front)}</div>
                  <div class="flashcard-hint">👆 ${t('tapToFlip')}</div>
                </div>
                <div class="flashcard-face flashcard-back">
                  <div class="flashcard-label">${t('back')}</div>
                  <div class="flashcard-text">${escapeHtml(back)}</div>
                </div>
              </div>
            </div>
            <div style="text-align:center;margin-top:12px;font-size:11px;color:var(--text-4)">${idx+1} ${t('of')} ${flashcards.length}</div>
          </div>`;
        }

        function flipFlashcard(tk) {
            const el = document.getElementById(`flashcard-${tk}`);
            if (el) el.classList.toggle('flipped');
        }

        function prevFlashcard(tk) {
            if (state.flashcardIndex[tk] > 0) {
                state.flashcardIndex[tk]--;
                renderContent();
            }
        }

        function nextFlashcard(tk, total) {
            if (state.flashcardIndex[tk] < total - 1) {
                state.flashcardIndex[tk]++;
                renderContent();
            }
        }

        // ==================== MNEMONICS ====================
        function renderMnemonics(mnemonics) {
            let html = `<div class="mnemonics-grid">`;
            mnemonics.forEach(mn => {
                const title = mn.title || '';
                const code = mn.code || '';
                const items = mn.items || [];
                html += `<div class="mnemonic-card"><div class="mn-header"><div class="mn-icon-wrap">🧠</div><div class="mn-title">${escapeHtml(title)}</div></div>
              ${code?`<div class="mn-code">${escapeHtml(code)}</div>`:''}
              <ul class="mn-items">${items.map(it=>`<li><span class="letter">${escapeHtml(it.letter)}</span><span>${escapeHtml(it.text)}</span></li>`).join('')}</ul></div>`;
            });
            html += `</div>`;
            return html;
        }

        // ==================== TABS ====================
        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.content-tab').forEach(t => {
                const oc = t.getAttribute('onclick') || '';
                t.classList.toggle('active', oc.includes(`'${tab}'`));
            });
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById(`panel-${tab}`);
            if (panel) panel.classList.add('active');
        }

        // ==================== SIDEBAR ====================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
        }

        // ==================== TOAST ====================
        function toast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span><span>${msg}</span>`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // ==================== UTILS ====================
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(
                /'/g, '&#039;');
        }

        // ==================== INIT ====================
        function init() {
            applyTheme();
            setLanguage(state.language);
            loadData();
        }
        init();
    </script>
</body>
</html>
