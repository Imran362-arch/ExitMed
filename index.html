${state.mcqWrongList[topicKey]&&state.mcqWrongList[topicKey].length>0?`<button class="btn btn-secondary" onclick="retryWrongOnly('${topicKey}')">❌ ${t('wrongOnly')}</button>`:''}
<button class="btn btn-secondary" onclick="exitQuiz('${topicKey}')">← ${t('backToTopic')}</button>
</div>
</div>
</div>
</div>
</div>`;
}

// ==================== QUIZ ACTIONS ====================
function startMCQTimer(topicKey){
if(state.mcqTimerInterval)clearInterval(state.mcqTimerInterval);
state.mcqTimerStart[topicKey]=Date.now()-(state.mcqElapsed[topicKey]*1000);
state.mcqTimerInterval=setInterval(()=>{
if(!state.mcqTimerStart[topicKey])return;
state.mcqElapsed[topicKey]=Math.floor((Date.now()-state.mcqTimerStart[topicKey])/1000);
const el=document.getElementById('quizTimerDisplay');
if(el)el.textContent=formatTime(state.mcqElapsed[topicKey]);
},1000);
}
function answerMCQ(topicKey,origIdx,optIdx){
if(!state.mcqAnswers[topicKey])state.mcqAnswers[topicKey]={};
state.mcqAnswers[topicKey][origIdx]=optIdx;
const item=findItemById(state.data?.categories||[],topicKey);
const mcqs=item?.content?.mcqs||[];
const isCorrect=optIdx===mcqs[origIdx].answer;
if(isCorrect){
state.mcqStreak[topicKey]=(state.mcqStreak[topicKey]||0)+1;
if(state.mcqStreak[topicKey]>=5)showConfetti();
}else{
state.mcqStreak[topicKey]=0;
if(!state.mcqWrongList[topicKey])state.mcqWrongList[topicKey]=[];
if(!state.mcqWrongList[topicKey].includes(origIdx))state.mcqWrongList[topicKey].push(origIdx);
}
if(!state.mcqStudied[topicKey])state.mcqStudied[topicKey]=[];
if(!state.mcqStudied[topicKey].includes(origIdx))state.mcqStudied[topicKey].push(origIdx);
saveProgress();
renderAll();
}
function prevMCQ(topicKey){if(state.mcqCurrentIndex[topicKey]>0){state.mcqCurrentIndex[topicKey]--;renderAll()}}
function nextMCQ(topicKey){
const item=findItemById(state.data?.categories||[],topicKey);
const mcqs=item?.content?.mcqs||[];
const sessionIndices=state.mcqSessionIndices[topicKey]||[];
if(state.mcqCurrentIndex[topicKey]<sessionIndices.length-1){state.mcqCurrentIndex[topicKey]++;renderAll()}
}
function goToMCQ(topicKey,idx){state.mcqCurrentIndex[topicKey]=idx;renderAll()}
function toggleFlag(topicKey,origIdx){if(!state.mcqFlags[topicKey])state.mcqFlags[topicKey]={};state.mcqFlags[topicKey][origIdx]=!state.mcqFlags[topicKey][origIdx];saveProgress();renderAll()}
function toggleBookmark(topicKey,origIdx){if(!state.mcqBookmarks[topicKey])state.mcqBookmarks[topicKey]={};state.mcqBookmarks[topicKey][origIdx]=!state.mcqBookmarks[topicKey][origIdx];saveProgress();renderAll()}
function saveMCQNote(topicKey,origIdx,value){if(!state.mcqNotes[topicKey])state.mcqNotes[topicKey]={};state.mcqNotes[topicKey][origIdx]=value;saveProgress()}
function finishQuiz(topicKey){
if(state.mcqTimerInterval)clearInterval(state.mcqTimerInterval);
state.mcqShowResults[topicKey]=true;
saveProgress();
renderAll();
const item=findItemById(state.data?.categories||[],topicKey);
const mcqs=item?.content?.mcqs||[];
const sessionIndices=state.mcqSessionIndices[topicKey]||[];
const answers=state.mcqAnswers[topicKey]||{};
let correct=0;
sessionIndices.forEach(idx=>{if(answers[idx]!==undefined&&mcqs[idx].answer===answers[idx])correct++});
const percent=sessionIndices.length>0?Math.round((correct/sessionIndices.length)*100):0;
if(percent>=80)showConfetti();
}
function retryQuiz(topicKey){
state.mcqAnswers[topicKey]={};
state.mcqCurrentIndex[topicKey]=0;
state.mcqShowResults[topicKey]=false;
state.mcqElapsed[topicKey]=0;
state.mcqStreak[topicKey]=0;
saveProgress();
renderAll();
}
function retryWrongOnly(topicKey){
state.mcqMode[topicKey]='wrong';
const wrongList=state.mcqWrongList[topicKey]||[];
const item=findItemById(state.data?.categories||[],topicKey);
const mcqs=item?.content?.mcqs||[];
state.mcqSessionIndices[topicKey]=wrongList.length>0?[...wrongList]:[...Array(mcqs.length).keys()];
state.mcqAnswers[topicKey]={};
state.mcqCurrentIndex[topicKey]=0;
state.mcqShowResults[topicKey]=false;
state.mcqElapsed[topicKey]=0;
state.mcqStreak[topicKey]=0;
renderAll();
}
function reviewQuiz(topicKey){
state.mcqShowResults[topicKey]=false;
state.mcqCurrentIndex[topicKey]=0;
renderAll();
}
function confirmExitQuiz(topicKey){
if(confirm(t('exitQuizConfirm'))){
exitQuiz(topicKey);
}
}
function exitQuiz(topicKey){
if(state.mcqTimerInterval)clearInterval(state.mcqTimerInterval);
state.mcqSessionActive[topicKey]=false;
state.mcqShowResults[topicKey]=false;
state.mcqSessionIndices[topicKey]=null;
saveProgress();
renderAll();
}

// ==================== FLASHCARDS ====================
function renderFlashcards(flashcards,topicKey){
if(!state.flashcardIndex[topicKey])state.flashcardIndex[topicKey]=0;
if(!state.flashcardRatings[topicKey])state.flashcardRatings[topicKey]={};
if(state.flashcardShuffled[topicKey]===undefined)state.flashcardShuffled[topicKey]=false;
let indices=[...Array(flashcards.length).keys()];
if(state.flashcardShuffled[topicKey]){
if(!state._shuffledFlash||state._shuffledFlash.key!==topicKey){
for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}
state._shuffledFlash={key:topicKey,indices};
}
indices=state._shuffledFlash.indices;
}
const idx=state.flashcardIndex[topicKey];
if(idx>=indices.length)state.flashcardIndex[topicKey]=0;
const activeIdx=state.flashcardIndex[topicKey];
const cardIdx=indices[activeIdx];
const card=flashcards[cardIdx];
const front=card.front||card.q||card.question||'';
const back=card.back||card.a||card.answer||'';
const frontImage=card.frontImage||card.image||'';
const backImage=card.backImage||'';
const ratings=state.flashcardRatings[topicKey]||{};
const ratingCounts={again:0,hard:0,good:0,easy:0};
Object.values(ratings).forEach(r=>{if(ratingCounts[r]!==undefined)ratingCounts[r]++});
const rated=Object.keys(ratings).length;
const progressPct=flashcards.length>0?(rated/flashcards.length)*100:0;
return`<div class="flashcard-wrapper">
<div class="flashcard-toolbar">
<div class="flashcard-counter">
<span class="current-num">${activeIdx+1}</span>
<span class="divider">${t('of')}</span>
<span class="total-num">${flashcards.length}</span>
</div>
<div class="flashcard-progress-mini"><div class="flashcard-progress-mini-fill" style="width:${progressPct}%"></div></div>
<div class="flashcard-tools">
<button class="flashcard-tool-btn ${state.flashcardShuffled[topicKey]?'active':''}" onclick="toggleFlashShuffle('${topicKey}')">🔀 ${t('shuffle')}</button>
</div>
</div>
<div class="flashcard-container">
<div class="flashcard" id="flashcard-${topicKey}" onclick="flipFlashcard('${topicKey}')">
<div class="flashcard-face flashcard-front">
<div class="flashcard-label">${t('front')}</div>
<div class="flashcard-text ${dirClass(front)}">

</div>

${escapeHtml(back)}
${backImage?`<br><img src="${escapeHtml(backImage)}" alt="" onclick="event.stopPropagation();openImageViewer('${escapeHtml(backImage)}')">`:''}
</div>
</div>
</div>
</div>
<div class="flashcard-nav-row">
<button class="flashcard-nav-btn" onclick="prevFlashcard('${topicKey}',${flashcards.length})" ${activeIdx===0?'disabled':''}>← ${t('previous')}</button>

<button class="rating-btn easy" onclick="rateFlashcard('${topicKey}',${cardIdx},'easy')">🤩 ${t('easy')}</button>
</div>
<div class="flashcard-stats-bar">
<div class="flashcard-stat-item again"><div class="fs-value">${ratingCounts.again}</div><div class="fs-label">${t('again')}</div></div>
<div class="flashcard-stat-item hard"><div class="fs-value">${ratingCounts.hard}</div><div class="fs-label">${t('hard')}</div></div>
<div class="flashcard-stat-item good"><div class="fs-value">${ratingCounts.good}</div><div class="fs-label">${t('goodRating')}</div></div>
<div class="flashcard-stat-item easy"><div class="fs-value">${ratingCounts.easy}</div><div class="fs-label">${t('easy')}</div></div>
</div>
</div>`;
}
function flipFlashcard(topicKey){
const card=document.getElementById(`flashcard-${topicKey}`);
if(card)card.classList.toggle('flipped');
const rating=document.getElementById(`flashRating-${topicKey}`);
if(rating){
const isFlipped=card&&card.classList.contains('flipped');
rating.classList.toggle('hidden',!isFlipped);
}
}
function prevFlashcard(topicKey,total){if(state.flashcardIndex[topicKey]>0){state.flashcardIndex[topicKey]--;renderAll()}}
function nextFlashcard(topicKey,total){if(state.flashcardIndex[topicKey]<total-1){state.flashcardIndex[topicKey]++;renderAll()}}
function rateFlashcard(topicKey,cardIdx,rating){
if(!state.flashcardRatings[topicKey])state.flashcardRatings[topicKey]={};
state.flashcardRatings[topicKey][cardIdx]=rating;
saveProgress();
const item=getCurrentItem();
const flashcards=item?.content?.flashcards||[];
if(state.flashcardIndex[topicKey]<flashcards.length-1){state.flashcardIndex[topicKey]++;renderAll()}
else{toast('All cards rated! 🎉','success')}
}
function toggleFlashShuffle(topicKey){
state.flashcardShuffled[topicKey]=!state.flashcardShuffled[topicKey];
state.flashcardIndex[topicKey]=0;
state._shuffledFlash=null;
renderAll();
}

// ==================== MNEMONICS ====================
function renderMnemonics(mnemonics){
let html=`<div class="mnemonics-grid">`;
mnemonics.forEach(mn=>{
const title=mn.title||'';
const code=mn.code||'';
const items=mn.items||[];
html+=`<div class="mnemonic-card">
<div class="mn-header"><div class="mn-icon-wrap">${mn.icon||'🧠'}</div><div class="mn-title ${dirClass(title)}">${escapeHtml(title)}</div></div>
${code?`<div class="mn-code ${dirClass(code)}">${escapeHtml(code)}</div>`:''}
<ul class="mn-items">${items.map(it=>`<li><span class="letter ${dirClass(it.letter)}">${escapeHtml(it.letter)}</span><span class="${dirClass(it.text)}">${escapeHtml(it.text)}</span></li>`).join('')}</ul>
</div>`;
});
html+=`</div>`;
return html;
}

${thumb?`<img src="${escapeHtml(thumb)}" alt="${escapeHtml(title)}">`:''}
<div class="video-play-overlay"><div class="video-play-btn">▶</div></div>
</div>

</div></div>`;
});

}

// ==================== VIDEO PLAYER ====================
let currentVideo=null;
function openVideoPlayer(src){
const modal=document.getElementById('videoPlayerModal');
const video=document.getElementById('videoPlayerVideo');
video.src=src;
modal.classList.add('show');
currentVideo=video;
video.play().catch(()=>{});
document.getElementById('videoPlayPause').textContent='⏸';
}
function closeVideoPlayer(){
const modal=document.getElementById('videoPlayerModal');
const video=document.getElementById('videoPlayerVideo');
video.pause();
video.src='';
modal.classList.remove('show');
currentVideo=null;
}
function toggleVideoPlay(){
if(!currentVideo)return;
if(currentVideo.paused){currentVideo.play();document.getElementById('videoPlayPause').textContent='⏸'}
else{currentVideo.pause();document.getElementById('videoPlayPause').textContent='▶'}
}
function skipVideo(sec){if(!currentVideo)return;currentVideo.currentTime=Math.max(0,Math.min(currentVideo.duration,currentVideo.currentTime+sec))}
function setVideoSpeed(val){if(!currentVideo)return;currentVideo.playbackRate=parseFloat(val)}
function setVideoVolume(val){if(!currentVideo)return;currentVideo.volume=parseFloat(val);document.getElementById('videoMuteBtn').textContent=val==0?'🔇':val<0.5?'🔉':'🔊'}
function toggleVideoMute(){
if(!currentVideo)return;
currentVideo.muted=!currentVideo.muted;
document.getElementById('videoMuteBtn').textContent=currentVideo.muted?'🔇':'🔊';
document.getElementById('videoVolume').value=currentVideo.muted?0:currentVideo.volume;
}
function seekVideo(e){
if(!currentVideo||!currentVideo.duration)return;
const rect=e.currentTarget.getBoundingClientRect();
const pct=(e.clientX-rect.left)/rect.width;
currentVideo.currentTime=pct*currentVideo.duration;
}
function toggleVideoOrientation(){
const modal=document.getElementById('videoPlayerModal');
const isLandscape=modal.classList.contains('landscape');
if(isLandscape){modal.classList.remove('landscape');modal.classList.add('portrait');document.getElementById('videoOrientationIcon').textContent='📱';document.getElementById('videoOrientationLabel').textContent='Portrait'}
else{modal.classList.remove('portrait');modal.classList.add('landscape');document.getElementById('videoOrientationIcon').textContent='🖥';document.getElementById('videoOrientationLabel').textContent='Landscape'}
}
function toggleVideoFullscreen(){
const container=document.getElementById('videoPlayerContainer');
if(!document.fullscreenElement){container.requestFullscreen?.()}
else{document.exitFullscreen?.()}
}
setInterval(()=>{
if(!currentVideo||!currentVideo.duration)return;
const pct=(currentVideo.currentTime/currentVideo.duration)*100;
const fill=document.getElementById('videoProgressFill');
if(fill)fill.style.width=pct+'%';
const time=document.getElementById('videoTime');
if(time)time.textContent=formatTime(currentVideo.currentTime)+' / '+formatTime(currentVideo.duration);
},250);

// ==================== MODAL ====================
function openAboutModal(){
const modal=document.getElementById('modal');
modal.innerHTML=`<div class="modal-header"><h3>ℹ️ ${t('aboutTitle')}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

// ==================== TOAST ====================
function toast(message,type='info'){
const container=document.getElementById('toastContainer');
const icons={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
const el=document.createElement('div');
el.className=`toast ${type}`;
el.innerHTML=`<span class="toast-icon">${icons[type]||icons.info}</span><span class="toast-message">${message}</span>`;
container.appendChild(el);
setTimeout(()=>{el.style.animation='slideIn .3s ease reverse';setTimeout(()=>el.remove(),300)},3000);
}

// ==================== CONFETTI ====================
function showConfetti(){
const container=document.getElementById('confettiContainer');
const colors=['#6366f1','#ec4899','#10b981','#f59e0b','#06b6d4','#a855f7'];
for(let i=0;i<50;i++){
const piece=document.createElement('div');
piece.className='confetti-piece';
piece.style.left=Math.random()*100+'%';
piece.style.background=colors[Math.floor(Math.random()*colors.length)];
piece.style.animationDelay=Math.random()*2+'s';
piece.style.animationDuration=(2+Math.random()*2)+'s';
piece.style.borderRadius=Math.random()>0.5?'50%':'0';
piece.style.transform=`rotate(${Math.random()*360}deg)`;
container.appendChild(piece);
setTimeout(()=>piece.remove(),4000);
}
}

// ==================== SERVICE WORKER ====================
if('serviceWorker' in navigator){
const swCode=`
const CACHE='medexit-v2';
self.addEventListener('install',e=>{self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
self.addEventListener('fetch',e=>{
if(e.request.method!=='GET')return;
e.respondWith(
fetch(e.request).then(r=>{
const clone=r.clone();
caches.open(CACHE).then(c=>c.put(e.request,clone));
return r;
}).catch(()=>caches.match(e.request))
);
});`;
const blob=new Blob([swCode],{type:'application/javascript'});
const swUrl=URL.createObjectURL(blob);
navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown',(e)=>{
if(e.key==='Escape'){
if(document.getElementById('quizStarterOverlay').classList.contains('show')){closeQuizStarter();return}
if(document.getElementById('imageViewerModal').classList.contains('show')){closeImageViewer();return}
if(document.getElementById('videoPlayerModal').classList.contains('show')){closeVideoPlayer();return}
if(document.getElementById('modalOverlay').classList.contains('show')){closeModal();return}
const activeTopic=getActiveQuizTopicKey();
if(activeTopic){confirmExitQuiz(activeTopic);return}
if(state.navStack.length>0){goBack();return}
}
const current=getCurrentItem();
if(current&&state.currentTab==='flashcards'&&!isAnyQuizActive()){
const flashcards=current.content?.flashcards||[];
if(flashcards.length){
const topicKey=current.id;
if(e.code==='Space'){e.preventDefault();flipFlashcard(topicKey)}
if(e.key==='ArrowLeft')prevFlashcard(topicKey,flashcards.length);
if(e.key==='ArrowRight')nextFlashcard(topicKey,flashcards.length);
if(e.key==='1'){const card=document.querySelector('.rating-btn.again');if(card)card.click()}
if(e.key==='2'){const card=document.querySelector('.rating-btn.hard');if(card)card.click()}
if(e.key==='3'){const card=document.querySelector('.rating-btn.good');if(card)card.click()}
if(e.key==='4'){const card=document.querySelector('.rating-btn.easy');if(card)card.click()}
}
}
const activeTopic=getActiveQuizTopicKey();
if(activeTopic){
const item=findItemById(state.data?.categories||[],activeTopic);
const mcqs=item?.content?.mcqs||[];
if(mcqs.length&&!state.mcqShowResults[activeTopic]){
const topicKey=activeTopic;
if(e.key==='ArrowLeft')prevMCQ(topicKey);
if(e.key==='ArrowRight')nextMCQ(topicKey);
if(['a','b','c','d','e','f'].includes(e.key.toLowerCase())){
const idx='abcdef'.indexOf(e.key.toLowerCase());
const sessionIndices=state.mcqSessionIndices[topicKey]||[];
const activeIdx=state.mcqCurrentIndex[topicKey];
const origIdx=sessionIndices[activeIdx];
if(origIdx!==undefined&&!(state.mcqAnswers[topicKey]||{})[origIdx]){
answerMCQ(topicKey,origIdx,idx);
}
}
}
}
if((e.altKey||e.metaKey)&&e.key==='ArrowLeft'){e.preventDefault();goBack()}
});
